# ─────────────────────────────────────────────────────────────────────────────
# § OPUS 5 ADOPTION (lateral bump 2026-07-24) — STAGED, not a blind sweep.
# Opus 5 (claude-opus-5) replaces Opus 4.8 as opus_latest at the SAME $5/$25 and an
# identical adaptive-thinking API surface (1M ctx, 128K out; the ONE new API delta is
# thinking:disabled + effort xhigh/max → 400 — n/a to our harness). It is materially
# stronger than 4.8 (SWE-bench Pro 79 vs 69, FrontierBench 43 vs 19, OSWorld 71 vs 56,
# ARC-AGI-2 90 vs 72, GDPval-AA 1861 vs 1593) and ≈ Fable 5 on MOST benchmarks — at
# HALF Fable's cost. Full behavioral + routing analysis + operator checklist:
#   docs/research/OPUS5_ADOPTION_AND_PROMPTING_2026-07-24.md
#
# WHY STAGED (Sonnet-5 precedent, applied verbatim): CC HARNESS surfaces (auto-mode
# leads + ALL teammate spawns) are gated by auto_mode_allowlist, and new models lag
# ~2 weeks into Max auto mode. An agent CANNOT self-verify auto-mode membership (a probe
# of `--permission-mode auto --model claude-opus-5` is refused by the classifier). So
# until an OPERATOR live-interactive test confirms Opus 5 in auto mode, EVERY opus-4-8
# role / allowlist / launcher default below STAYS on opus-4-8. Do NOT run
# `claude-bump-models --apply` (it would flip not-yet-allowlisted harness surfaces →
# spawn refusal / silent demotion). Opus 4.8 is still fully served (it is Opus 5's own
# cyber-refusal fallback), so no ref to it is "stale".
#
# OPERATOR ACTIVATION (the one human step) — then agent completes the sweep:
#   0a. PREREQ — bump the eval track to CC 2.1.219: `claude-opus-5` is NOT registered by the
#       current eval binary (2.1.215); CC support was ADDED in 2.1.219 (API usage needs no bump).
#       PARALLEL-install (`npm i --prefix ~/.claude-219 @anthropic-ai/claude-code@2.1.219`, keep
#       2.1.215 intact for 1-line rollback) AND `export CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH=1` in
#       ~/.zshrc claude-next() — 219's depth-3 nested-spawn default REVERSES 2.1.217's containment of
#       the still-open #68619 runaway (4M tok/5min) on our spawn-heavy shared binary — BEFORE
#       repointing :383/:387 → ~/.claude-219. MANIFEST 2.1.219 + [[claude-code-2.1.219-opus5-eval]].
#   0b. Live-test on the ~/.claude-219 binary (this IS the operator gate): `CLAUDE_NEXT_MODEL=claude-opus-5
#       claude-next` (= `--permission-mode auto --model claude-opus-5`). Engages autonomously ⇒
#       allowlisted AND entitled. NB entitlement may be SERVER-date-gated (like Fable 5 was — a binary
#       bump alone may not unlock it; relaunch/re-login fetches it) → first smoke `--model claude-opus-5
#       --print "ok"` returns a real completion + `claude-accounts` shows a live budget.
#   1. flip versions map: opus_latest → claude-opus-5, opus_prior → claude-opus-4-8, clear opus_staged;
#      run `claude-bump-models --apply` (NOW safe — sweeps opus-4-8→opus-5); add claude-opus-5 to
#      auto_mode_allowlist.non_firstParty_max ALONGSIDE 4.8.
#   2. flip the eval-track default: ~/.zshrc claude-next() --model / CLAUDE_NEXT_MODEL
#      default claude-opus-4-8 → claude-opus-5.
#   3. move the opus-4-8 ROLES below → claude-opus-5: lead_default, default_teammate,
#      teammate_mechanical, teammate_research, research_worker, frontier_access.fallback.
#   4. RE-SWEEP effort (see effort_defaults § opus5): Opus 5's own default is `high`, NOT
#      max — `max` over-thinks + self-correction/re-verification loops; medium/low are
#      STRONGER than on 4.8. Our global default:max is WRONG-SIGNED for Opus 5.
#   5. re-run claude-lint-models; spot-check one teammate's live model (silent-demotion).
# Until then: Opus 5 IS usable via explicit non-auto `--model claude-opus-5` sessions and
# the API directly; the frontier tier (Fable 5) and all Fable roles are UNCHANGED.
#
# ROUTING NOTE (record now; act on adoption): Opus 5 ≈ Fable 5 at HALF cost collapses
# Fable's "delta above the default" for MOST work. On adoption, reconsider whether the
# call-time frontier roles (research_adversarial / workflow_judge / eval_judge /
# teammate_frontier) still warrant Fable's 2×. Fable retains an edge only on the hardest
# pure-reasoning (HLE no-tools, DeepSWE) + a couple coding slices; Mythos 5 still leads
# cyber + health. Opus 5 becomes the new frontier-role FALLBACK once allowlisted.
# ─────────────────────────────────────────────────────────────────────────────


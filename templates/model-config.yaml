# extensions (07-07 → 07-09 → 07-14 → 07-19) were Anthropic securing capacity in stages ("demand
# for Fable has been challenging to predict"); that staging is now resolved to permanent access.
# ⇒ The "when the window ends, run /model-upgrade --downgrade" flow is now OBSOLETE for Fable:
#   `active` stays true, `permanent: true`, no downgrade.

# Provenance label at open time. Everything downstream keys on it.
name: Auto-label agent PRs
on:
  pull_request: {types: [opened]}
jobs:
  auto-label:
    if: github.event.pull_request.user.login == 'acmebot' || contains(github.event.pull_request.body, 'acme:evidence:begin')
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: write}
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number, labels: ['agent'] });

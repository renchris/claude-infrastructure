## 7. The no-API path, stated honestly

It is **arm B plus arm C with the accelerator removed**, not a degraded arm A. What it keeps: exact created/renamed/deleted detection via the id→tree diff on `(FILEID, GEN_COUNT)`; O(changes) conversion; the whole L2–L6 stack unchanged. What it loses: the zero-byte "did the content change" oracle (a same-size, same-second, mtime-preserving overwrite is invisible to stat; `GEN_COUNT` catches it on APFS and is unmeasured on File Provider), and cloud-side hashes for AIP-labelled files. What it costs: hydration — every content check on an online-only file is a download, so pin the in-scope subtrees and budget the rest. What it needs from IT: nothing beyond the sync client, provided the walker is a plain binary (no Homebrew Watchman, no launchd daemon needed for T3). The Claude desktop app cannot start sessions under `~/Library/CloudStorage` even with Full Disk Access (claude-code #34554) — another reason the agent never works from the sync root.


## 11. Receipts

Per-axis reports (`agent-context-sync-2026-09-21/`): `A1-cursor`, `A2-deepwiki-indexers`, `B1-graph-drive-delta`, `B2-graph-notify-mail-teams`, `C1-macos-onedrive-symlinks`, `C2-watchman-fsevents`, `C4-rclone`, `D-manifest-buildgraph`, `E-converters`, `F-rag-incremental-ingestion`, `G-agent-docs-conventions`, `H-version-mess`, `I1-hostile-reviewer`, `I2-red-team-symlink-hash`; verifier reports `verify/C1..C10`. Every table row above names its source axis by mechanism; the reports carry the URLs, quotes and the reproduction commands for each measurement.

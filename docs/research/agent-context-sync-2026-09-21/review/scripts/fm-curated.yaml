## 10. Build order

1. **Week 1 — the correct pipeline with no accelerators.** Real `docs-source/`; T3 metadata walk + SQLite manifest with the three-hash classifier and multi-state verdict; `openpyxl` emitter, pandoc, MarkItDown-pptx, PyMuPDF4LLM (or Docling-pypdfium pending AGPL clearance); write-once cache; `docs/mirror/` with content-derived frontmatter; `INDEX.md`, `CHANGELOG.md`, `STATE.md`, per-dir `CLAUDE.md`; one commit per cycle; tombstones + breaker; land-gate lints (no symlinks, double-conversion, frontmatter contract). Run the §9 probes in parallel.
2. **Week 2 — Graph arm.** Own Graph client (or `graph-batch`); per-drive delta state machine with 410/400 split and atomic cursor; `quickXorHash`-first classifier; mail folder delta with two-phase fetch; daily reconcile; throttling discipline.
3. **Week 3 — curation map.** `sources:` frontmatter contract; generated `DEPENDS.tsv`; refresh-queue command in README; STALE linter; debounce; prototype on ~20 curated pages and measure how often affected-page regeneration produces cross-page incoherence before widening.
4. **Then** Teams channel delta + monthly rollups, tier-2 PDF backfill and VLM sidecars as budgeted batches, lineage/near-dup proposals, FSEvents T1/T2 only if the §9 probe 5 number says T3 alone is too slow.


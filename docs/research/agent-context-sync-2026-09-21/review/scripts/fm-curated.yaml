  INDEX.md            llms.txt v2 shape: H1, blockquote with sync generation + the literal
                      "what changed since <date>" git command, ## groups of `- [name](path): one line`,
                      ## Optional holding the mirror tree.  ≤ 200 lines / ≤ 25 KB — one Read.
  README.md           20 lines: how this folder is built; which sources are Graph-delta vs manual;
                      the refresh-queue command verbatim
  CHANGELOG.md        append-only, one section per sync: A|M|R|D per path, counts, breaker state
  DEPENDS.tsv         generated
  _sync/STATE.md      last run, per-source cursor age, pass_complete flags, counts, quarantined,
                      breaker state — the agent reads this FIRST
  _manifest/          index.jsonl shards (generated), cache/<key>/ (write-once converter outputs)
  topics/             TIER 2 — curated, entity-organized, CLAUDE.md (~15 lines: "synthesis; every
    CLAUDE.md          claim cites ../mirror/…; run the refresh queue before trusting a STALE page")
    clients/<entity>/INDEX.md, <entity>-<aspect>.md …
    workstreams/…  decisions/<yyyy-mm-dd>-<slug>.md  people/…
  mirror/             TIER 1 — generated, 1:1, CLAUDE.md (~10 lines: "GENERATED — DO NOT EDIT;
    CLAUDE.md          edits are overwritten each sync; sync command: …")
    sharepoint/<site>/<library>/<path>/<Name>.md | <Name>.xlsx.d/
    onedrive/<user>/…
    email/<yyyy>/<mm>/<yyyy-mm-dd>-<from-slug>-<subject-slug>.md   +  email/threads/<slug>.md (L4)
    teams/<team>/<channel>/<yyyy-mm>.md          one page per channel per MONTH
  figures/<sha>.png + <sha>.md

Rules and the measurement behind each:

- **Index first, discovery-by-Glob never.** Glob returns at most 100 files ordered by mtime on the ordinary tool path (`globLimits?.maxResults ?? 100` in the 2.1.114 and 2.1.183 bundles; the REPL bridge passes 25,000; the model cannot raise it) with a `truncated` flag — over a 1,192-file corpus that is not a truncation but a *biased sample* on a key `git clone` resets. Grep has its own silent cap: `head_limit` defaults to **250 in every output mode, including `files_with_matches`**, which additionally sorts by mtime descending; pass `head_limit: 0` for any completeness-critical enumeration, or use `rg` via Bash. These constants are version-perishable — re-grep the bundle rather than quote them. `INDEX.md` is the entry point; the mirror sits under `## Optional` as a verification surface, not a reading surface.
- **Page budget ≤ 400 lines / ≤ 25 KB / ~6 K tokens, hard split at 800 lines.** The binding constraint is tokens, not the Read tool's 2,000-line default (≈ 34 K tokens at this repo's measured 61–73 chars/line; one existing research file here is 146 K chars). 25 KB is Anthropic's own shipped budget for a file meant to be read whole.
- **Names are retrieval signal** (Anthropic's context-engineering guidance says so explicitly): lowercase kebab-case, entity-first then aspect, no abbreviations in filenames — put them in `aliases:` — and a `-YYYY-MM-DD` suffix only on point-in-time artefacts, never on living pages (updating one forces a rename that git reports as delete+create: measured, a rename with a 42 %-similar edit shows `D`/`A` at git's default 50 % threshold and `git log --follow` does not cross it). "Renamed" therefore comes from `source_id`, never from git.
- **Tombstones in place**, with `status: deleted, deleted_at, last_seen_sha256, source_id, superseded_by?`, a `[DELETED UPSTREAM]` title and the `git show` command that recovers the last content; plus the CHANGELOG entry, because a set of tombstones is not a timeline. Removal alone leaves three states indistinguishable — deleted upstream, never existed, wrong path — which demand opposite actions (Debezium ships a null-valued tombstone for the same reason). Reap on a 180-day policy.
- **Per-directory `CLAUDE.md` guardrails** cost zero context until the agent opens that directory, then arrive exactly when relevant. The docs index ships as a **Skill** (description resident, body on demand); the root `CLAUDE.md` gets three lines: `docs/INDEX.md` is the map, `mirror/` is generated, and the one command that answers "what changed".
- **Freshness is greppable text or `git log`, never mtime.**
- **`aliases:` before embeddings.** Grep's real failure is vocabulary mismatch ("PO" vs "purchase order"); an aliases line plus a synonym block in the index fixes it with no infrastructure. Cursor's own A/B (+0.3 % overall) and Sourcegraph retiring its embeddings layer for freshness burden are the evidence. If vectors ever become necessary it is a search-over-the-mirror problem: sqlite-vec, upserts keyed on `rendered_sha256 + chunk hash`, deletes by `source_id` on tombstone.
- **Run the sync, and any broad search over the mirror, in a subagent** so only the summary returns to the lead's context.

### 4.7 L6 — operations

- **Cadence.** Delta poll 60 s–5 min per drive (1 RU each); local T3 walk on demand at session start and every N min under launchd; **daily full reconcile** regardless (Microsoft's ceiling is "no more than once per day"); tier-2 PDF backfill and VLM captioning as budgeted batch jobs off-peak (initial crawl is egress-bound: 100 GB/h per user).
- **One lock, one commit.** A machine-wide lock per `docs/` root; temp+rename for every file; one manifest snapshot, one `CHANGELOG` section and one git commit per cycle (per-file commits destroy the reviewability of "what changed this cycle"); the agent reads a committed ref, never a mid-write tree.
- **Budgets as first-class state.** Per-run byte budget for `materialise()`, egress budget per hour, RU budget per minute; a run that exhausts a budget records `pass_complete=false`, which keeps the deletion breaker armed and the cursor un-advanced.
- **`_sync/STATE.md` is what the agent reads first** — per-source cursor age, last complete pass, counts (created/modified/renamed/deleted/quarantined/dataless), breaker state, converter versions. Publish the SLA honestly: files "typically under a minute, guaranteed within 6 hours, plus a daily reconcile". Drive every freshness indicator from git and STATE.md, never from notification arrival.
- **Compliance is data, not a footnote.** Delegated views are per-principal — record the principal, never merge two users' mirrors. Carry the highest sensitivity label into page frontmatter; exclude above a threshold; IRM-encrypted files are `quarantined` rows with stub pages. A git mirror flattens labels, DLP and ACLs and is an exfiltration channel: keep the `docs/` remote tenant-owned or absent, and expect Endpoint DLP to be able to block `git`/`node` reads of CloudStorage (policy-dependent).
- **Time is advisory.** Store server and client timestamps separately in UTC ISO-8601; client-supplied `fileSystemInfo` stamps can precede the service's own `createdDateTime` (observed live); mtime never decides.
- **Names.** NFC for identity, raw bytes in provenance, `core.precomposeunicode=true`; watch the 400/520-character path limits with short slug paths and original names in frontmatter; leave rclone's unicode normalization on if rclone is the transport.
- **rclone, demoted to transport.** `--onedrive-delta` is a cheap *full listing* (the delta call is issued without a stored token; source `backend/onedrive/onedrive.go`), rclone persists no `deltaLink`, and its sync is "stateless like all of rclone's syncs" — measured floor ~1.35 s per 1,000-item page, 482 delta calls and ~11 min to conclude nothing changed on a large library (rclone #9226). The O(changes) door is `rclone copy --files-from-raw changed.txt --no-traverse` (~1 API call per file) with a separate local delete pass (`sync` ignores `--no-traverse`), `--backup-dir` so same-name overwrites stay diffable, `--max-delete` set explicitly, `--use-json-log` parsed with an assertion that a run reporting transfers yielded non-zero parsed rows, and never `--checksum` on the hot path (SharePoint's Office-file mutation makes it cry wolf on the majority file type).


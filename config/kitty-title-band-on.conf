# ⌘⇧B's ON half for the PATCHED kitty (docs/patches/kitty-window-title-band.patch). Inert until
# scripts/kitty-build-swap.sh `swap` points ~/.config/kitty/kitty-title-on.conf here, and `rollback`
# points it back at config/kitty-title-on.conf. Stock kitty does not know the option below, so this
# file must never be loaded by a stock build — which is why the swap moves the link and the app
# together.
#
# The band is drawn OVER the pane's first row and allocated no row, so turning it on changes no row
# count, signals no child and moves no content (scripts/checks/kitty-title-band-verify.sh (a)).
# That is why this half needs none of kitty-title-on.conf's padding swap: the OFF half
# (kitty-title-off.conf) is unchanged, and the band is the ONE draggable title the 2026-09-16
# ruling asked for — kitty hit-tests it in C, so a press on it starts a pane drag.
#
# Width: the build defaults to `text` (the title's own width, at the left edge). To take the
# full-width band instead, add `window_title_bar_overlay_width full` below; no rebuild.
include kitty.conf
window_title_bar_min_windows 0
window_title_bar_overlay yes

# public-hygiene.conf — what scripts/public-hygiene-lint.py refuses in this PUBLIC repo, beyond the
# operator's private redaction map (which names the identifiers themselves and therefore lives only
# in the private store: $CC_PRIVATE_DIR/public-projection/replace-text.txt).
# Plan and classification: docs/plans/PUBLIC_REPO_HYGIENE.md.
#
# FORMAT — one directive per line, '#' comments and blank lines ignored:
#   path   <glob>     a tracked path matching this (fnmatch, repo-relative) is LOCAL-ONLY content
#   email  <regex>    an e-mail address fully matching this is ALLOWED (placeholder / public / bot)
#
# Any e-mail address NOT allowed below is a finding, so a new real address is caught without anyone
# having to list it first. Phone-shaped numbers are a built-in arm; 555-01xx is the allowed range.

# ── local-only content (skills/LOCAL_ONLY.md records why each one is not tracked) ─────────────
path   vendor/uidotsh/*
path   skills/grok-wiki-cli/*
path   skills/grok-wiki-custom/*
path   skills/repo-wiki/*
path   skills/kpmg-deck/*
path   assets/*/recycle-bmo.*
path   assets/*/clawd-bmo*
path   identity.local.json
path   */identity.local.json

# ── e-mail addresses that may appear ──────────────────────────────────────────────────────────
email  .*@example\.(com|org|net|test)
email  .*@[a-z0-9.-]+\.example\.(com|org|net)
email  .*@example\.onmicrosoft\.com
email  .*@[a-z0-9.-]*\.(invalid|test|local|localhost|example)
email  .*@(localhost|e\.com|x\.com|t|w1\.local|v\.local)
email  .*@users\.noreply\.github\.com
email  (noreply|no-reply|notifications|support|security)@[a-z0-9.-]+
email  noreply@anthropic\.com
email  git@(github\.com|gitlab\.com|bitbucket\.org)
email  %s@github\.com
email  (robobun|claude-bot)@(oven|bun)\.sh
# not addresses at all: file names carrying a scale/size suffix (x@2x.png, page@1440x900.png, postgresql@14.log)
email  .*@[A-Za-z0-9.]*\.(png|webp|jpe?g|gif|svg|log|mp4)
email  contributors@(project\.test|example\.org)
email  jane\.doe@contoso\.com
email  [a-z]+@substack\.com
path   skills/outlook-cleanup/*

# ── TrueMemory security advisories: local-only until filed and acknowledged upstream ─────────
path   docs/plans/TRUEMEMORY_UPSTREAM.md
path   docs/research/truememory-upstream-2026-09-28/*
path   docs/research/truememory-upstream-2026-09-28.md
path   docs/plans/TRUEMEMORY_2_0.md
path   docs/research/truememory-2.0-2026-09-28/*

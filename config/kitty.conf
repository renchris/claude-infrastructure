# kitty.conf — SSOT for the operator's terminal, deployed by symlink to ~/.config/kitty/kitty.conf
#
# WHY THIS FILE EXISTS
#   iTerm2 froze the box at ~30 concurrent Claude Code panes
#   (docs/research/iterm2-freeze-30-sessions-2026-07-30.md). kitty is the challenger the bakeoff
#   selected on thread count flat-in-pane-count; the standing caveats live in
#   docs/research/terminal-for-30-panes-2026-07-31.md §6 and are NOT restated here — read them
#   before crediting kitty with anything this file does not itself measure.
#
# APPLYING THIS FILE
#   APPLYING TO EVERY OPEN WINDOW IS ONE ACTION, NOT A PER-WINDOW CHORE. A reload is global —
#   it re-lays-out every OS window and every tab at once, so there is nothing to repeat per
#   window. Two equivalent triggers:
#       ctrl+cmd+,                                   kitty's own shipped chord on macOS
#       kitty @ load-config ~/.config/kitty/kitty.conf   the CLI form
#   (`ctrl+shift+f5` is the cross-platform chord for the same action. Neither is mapped in §3,
#   so both are kitty defaults and stay live as long as clear_all_shortcuts is unset.)
#   WHAT LOOKS LIKE A STALE WINDOW USUALLY IS NOT. A window on another macOS Space keeps its
#   last SCREENSHOT until you switch to it — `screencapture -l<id>` will hand you that stale
#   frame while `kitty @ ls` already reports the new grid. Trust `kitty @ ls`, or focus the
#   window once, before concluding the reload missed it.
#
#   `kitty @ load-config` reloads most options live, but NOT allow_remote_control and NOT listen_on
#   ("Changing this option by reloading the config is not supported" — kitty 0.48.2 conf docs).
#   Those two need a full kitty restart, and a restart kills every pane and every Claude Code
#   session inside them. Restart at a clean moment, never mid-build.
#
#   ALSO NOT RELOADED: font_size / font_family into ALREADY-OPEN windows. Measured 2026-08-01 on
#   kitty 0.48.2 — a fixed window (id 13) held 85x115 across config 12.0 -> reload -> 14.0 ->
#   reload, i.e. the grid did not move at all. The reload is silent about this: rc=0, and the file
#   on disk is correct, so the config LOOKS applied while every visible pane still renders the old
#   size. The runtime lever that does work is
#       kitty @ set-font-size --all <size>
#   which moved that same window to 70x87 immediately (fewer cells = larger glyphs) and, per kitty's
#   own --help, also applies to OS windows created later. So after editing 7c, run BOTH: reload for
#   persistence across restarts, and set-font-size --all to move what is already on screen.
#
#   🚨 THE PARAGRAPH ABOVE IS TRUE OF A CHANGED FILE VALUE AND FALSE OF A RUNTIME OVERRIDE, AND
#   THAT DISTINCTION COST THE OPERATOR A DAY (2026-08-26). A reload does not IGNORE font size — it
#   RE-ASSERTS the config's value, discarding whatever ⌘+ / ⌘- / `set-font-size` had set at
#   runtime. The 2026-08-01 measurement moved the FILE from 12.0 to 14.0 and saw a window that had
#   never been zoomed stay put, which says nothing about the zoomed case. Measured three ways on
#   kitty 0.48.2, 2026-08-26, with the runtime at 20.0 and this file at 14.0:
#       kitty @ load-config <this file>                  -> every OS window snapped 20 -> 14
#       touch <this file>          (mtime only, no edit) -> same, within ~1s
#       set 20, then wait                                -> same, unprompted, every 1-3 minutes
#   The third case is the one that presents as a bug: kitty runs a CONFIG WATCHER
#   (`kitten __watch_conf__ <pid> 100 /etc/xdg/kitty/kitty.conf ~/.config/kitty/kitty.conf`), and
#   ~/.config/kitty/kitty.conf is a symlink onto THIS file inside a checkout that a dozen
#   concurrent sessions touch. So every incidental mtime change silently reverts the operator's
#   zoom, on all OS windows at once, with no log and no visible cause.
#   RULED OUT by measurement, so do not re-litigate them: a ⌘- decrement (from 20 it lands on 14,
#   the config value, NOT 18), a ⌘0 / reload keystroke (neutralised with `map cmd+0 no_op`, the
#   reset still fired), OS-window creation, and pane splits.
#   CONSEQUENCE FOR 7c: the operator's preferred size must live in THIS FILE, never as a runtime
#   ⌘+ zoom — a runtime zoom here has a half-life of minutes. `kitty @ load-config -o font_size=N`
#   does survive subsequent reloads, but dies with the kitty process; it is a probe, not a fix.
#
#   Colours are the same shape of trap, with a different actuator: a bare `load-config` with NO
#   argument reloads "the previously specified config file", which is whatever path kitty was
#   STARTED with — if kitty predates this file's symlink, that is a rc=0 no-op. Name the path
#   explicitly, and push colours into live windows with `kitty @ set-colors --configured --all`.
#
# VERIFIED AGAINST kitty 0.48.2 (`kitty @ <cmd> --help`, 2026-07-31). Every option below was read
# out of this machine's own kitty docs, not from memory.

# ─────────────────────────────────────────────────────────────────────────────
# 1. LAYOUT — the `splits` layout is what makes vsplit/hsplit legal at all
# ─────────────────────────────────────────────────────────────────────────────
# --location=vsplit|hsplit are "only used by the splits layout" (launch --help). Without `splits`
# enabled the ⌘D bindings below silently place the pane somewhere layout-dependent instead of
# erroring — the same silent-misplacement shape as the anchor trap in §4 of the research doc.
# `stack` is second so ⌘⇧Z can zoom one pane to fill the tab. (Was ⌘⇧Enter for iTerm2 parity
# until 2026-08-07 — that chord is one slipped modifier from the Claude Code composer's ⇧Enter
# newline, and the slip hides every other session in the tab. See §3's note on the move.)
enabled_layouts splits,stack

# ── SELECTION → CLIPBOARD (2026-08-24) ───────────────────────────────────────
# Operator: "highlight text to automatically copy to clipboard" was not working, and it looked like
# a regression in the crash-resumed panes. It was not a regression anywhere: `copy_on_select`
# appeared NOWHERE in this file and kitty's compiled-in default is empty — read out of
# kitty.options.types.defaults, not from the docs — so the feature was absent in EVERY pane,
# resumed or not. There was no per-pane drift to find on this axis.
#
# WHY THIS SETTING CANNOT CONFLICT WITH CLAUDE CODE, AND WHICH ONE WOULD. copy_on_select is purely
# DOWNSTREAM of a selection kitty has already made: it changes no key handling, no input path and
# no escape-sequence handling, and the application cannot observe it at all.
#   The tempting sibling fix is deliberately NOT here: `mouse_map left press grabbed
#   mouse_selection normal`, to make a plain drag select while the app holds the mouse, WOULD
#   conflict — it takes left-drag away from Claude Code in every pane and breaks its own
#   click-to-position, scrolling and menu handling. A plain drag that does not select is the app
#   holding the mouse BY DESIGN; shift+drag is the sanctioned override and kitty already ships it
#   (`shift+left press grabbed mouse_selection normal`, one of 19 default selection maps — all
#   intact here: clear_all_mouse_actions is unset and no custom map below binds left-drag).
#
# Cost, stated plainly rather than discovered later: any stray drag now replaces the clipboard.
copy_on_select clipboard

# ─────────────────────────────────────────────────────────────────────────────
# 2. REMOTE CONTROL — the load-bearing setting for handoff / self-recycle
# ─────────────────────────────────────────────────────────────────────────────
# socket-only: "Remote control requests received over a socket are accepted unconditionally.
# Requests received over the TTY are denied." That denial is the point — with `yes`, ANY program
# that can print to a pane (including a compromised dependency, or `cat` on a hostile file) can
# open windows, read other panes' contents, and run commands. Our automation only ever needs the
# socket, so the TTY path is pure attack surface. Do not "simplify" this to `yes`.
allow_remote_control socket-only

# kitty exports KITTY_LISTEN_ON into every child process, so a script running inside a pane finds
# the socket with no configuration ("if you run kitten @ within a kitty window, there is no need to
# specify the --to option as it will automatically read from the environment" — kitty --help).
#
# This is REQUIRED, not optional, for agent automation. A script run by Claude Code's Bash tool has
# NO controlling terminal, so kitty's fallback tty path fails with
#   Error: open /dev/tty: device not configured
# — measured on this box before this file existed. socket-only would deny that path anyway, but the
# absence of a socket is what actually breaks it. listen_on is the whole reason handoff works.
#
# {kitty_pid} keeps concurrent kitty instances from colliding on one socket path.
# HARDENING NOT YET APPLIED: /tmp is world-writable on macOS, so any local user could drive kitty
# through this socket. Single-user box ⇒ accepted for now; the fix is a 0700 dir, and it must be
# verified (kitty expands env vars but does not create directories) before being trusted.
listen_on unix:/tmp/kitty-{kitty_pid}

# ─────────────────────────────────────────────────────────────────────────────
# 3. SPLIT PANES — iTerm2 muscle memory, preserved key-for-key
# ─────────────────────────────────────────────────────────────────────────────
# iTerm2 ⌘D  = "Split Vertically"   = vertical divider  = new pane to the RIGHT → vsplit
# iTerm2 ⌘⇧D = "Split Horizontally" = horizontal divider = new pane BELOW      → hsplit
# If these land the opposite way on your screen, swap the two words — nothing else changes.
#
# ⚠ ORDER IS LOAD-BEARING FOR cmd+shift+d. kitty ships a macOS default binding of
# cmd+shift+d → close_window. Both survive into the keymap with identical (empty) conditions, and
# the LAST one wins — verified on this config: n=2, [0]='close_window', [1]='launch --location=
# hsplit'. Ours is last only because this is the user config, loaded after the defaults. Do not
# move these two lines into an included file that loads earlier, or ⌘⇧D silently becomes
# "close the pane" instead of "split the pane" — a destructive inversion with no error.
#
# --cwd=current inherits the working directory of the pane you split FROM, which is what iTerm2
# does and what makes ⌘D usable mid-task. It reads the cwd of the source window's foreground
# process and needs no shell integration (shell integration is enabled by default in 0.48 and
# only `--cwd=last_reported` actually depends on it).
#
# ⚠ BUT --cwd=current ALONE lands the split in a POOL WORKTREE, not the primary checkout.
# The pane you split from is normally running Claude Code, and the always-isolate `claude()`
# zsh function cd's into ~/Development/.worktrees/wt-pool-N before exec'ing. So the "cwd of the
# source window's foreground process" IS the worktree. Measured on kitty 0.48.2 from such a pane
# (`kitten @ launch --source-window id:N --cwd=<value>`), ALL FOUR special values agree:
#     current -> wt-pool-4   oldest -> wt-pool-4   root -> wt-pool-4   last_reported -> wt-pool-4
# The login shell underneath is still in reso-management-app (verified with lsof -d cwd), but no
# kitty --cwd value reaches past the foreground process down to it — and last_reported is the
# worktree too, because zsh's chpwd hook OSC-7-reported it on the way in.
#
# So the redirect happens in the launched program instead. kitty-split-cwd.sh takes --cwd=current
# as its input, then hops to the repo's MAIN worktree only when that input is a LINKED worktree;
# everywhere else (the main checkout, a subdir of it, a non-git dir) it stays put, preserving the
# iTerm2 inherit-cwd behaviour above. It then exec's a login shell, as the pane would have anyway.
map cmd+d       launch --location=vsplit --cwd=current ${HOME}/.claude/bin/kitty-split-cwd.sh
map cmd+shift+d launch --location=hsplit --cwd=current ${HOME}/.claude/bin/kitty-split-cwd.sh

# ─────────────────────────────────────────────────────────────────────────────
# 6c. MOVE PANE MENU — iTerm2's right-click "Move Session to…", point-and-click
# ─────────────────────────────────────────────────────────────────────────────
# iTerm2's session right-click offers "Move Session to Split Pane" / "Move Session to Window" —
# no drag required, useful exactly when there is no free desktop space to drag a pane to. kitty
# has no built-in equivalent (its own right-click is the single fixed action
# `paste_from_selection`), so bin/kitty-pane-menu builds the menu outside kitty — a native macOS
# "choose from list" driven over the remote-control socket, same technique as ⌘W's close dialog
# below — offering Paste / Move to New Window / Move to <each other OS window> / Close Pane.
#
# PLAIN right-click (a trackpad two-finger tap included) is REBOUND here, not left at kitty's
# default `paste_from_selection` — for the SAME reason cmd+left exists above: most panes run
# Claude Code, which grabs the mouse, and kitty's stock right-click mapping is `ungrabbed`-only,
# so inside a live session the click never reached kitty at all. Binding `grabbed,ungrabbed`
# fixes that, and nothing is lost by rebinding: "Paste" is the menu's first item, so the old
# one-click paste is still one extra click away, not gone.
#
# cmd+right is kept as a SECOND route to the identical menu — cheap (one line, kitty ships NO
# mouse_map using cmd/super at all, so it collides with nothing) and useful for anyone on a
# plain mouse where a bare right-click still means "the OS-level context menu", or muscle memory
# from before this bound plain right-click.
mouse_map right     press grabbed,ungrabbed launch --type=background ${HOME}/.claude/bin/kitty-pane-menu
mouse_map cmd+right press grabbed,ungrabbed launch --type=background ${HOME}/.claude/bin/kitty-pane-menu

# Close the focused pane (iTerm2 ⌘W). Closing the last pane closes the tab, then the OS window.
#
# ⚠ CONFIRMATION IS LOAD-BEARING. `close_window` is unconditional and silent: one ⌘W on a pane
# running a live Claude Code session kills it with no prompt, and a killed session is not a
# closed one — the transcript survives but the in-memory context does not, so recovery costs a
# `--resume` and whatever the summariser drops. That happened on 2026-08-04 to a mid-flight
# bottle-service image-quality session. iTerm2 never had this hole: its per-profile "Prompt
# before closing → when jobs are running" put a modal in the way. This is the kitty equivalent.
#
# ⚠ AND IT MUST BE A REAL MACOS DIALOG, NOT kitty's. The obvious binding here is kitty's own
# `close_window_with_confirmation ignore-shell`. It was tried first and REJECTED on sight: kitty
# draws that confirmation INSIDE the pane — a full-pane takeover that blanks the very session you
# are deciding about and offers "Yes / No" as terminal text. There is no option to change that;
# the confirmation is an `ask` kitten, and a kitten is a terminal program by construction. So the
# guard lives outside kitty instead: these three keys launch a background helper that puts up an
# AppleScript dialog (kitty's own icon, Cancel defaulted) and then performs the close over the
# remote-control socket only if the operator confirms.
#
# Remote-control closes deliberately BYPASS kitty's own confirmation — verified 2026-08-04 by
# closing a window running `sleep 120` with `kitty @ close-window` and getting no prompt — so the
# helper's close cannot trigger a second, in-terminal prompt behind the first.
#
# The helper reproduces `ignore-shell` itself: a pane at a bare shell prompt closes instantly with
# no dialog, and only a pane with a command actually running is worth interrupting for. It reads
# that from shell integration's `at_prompt`, which is on (unset ⇒ kitty's `enabled` default) and
# VERIFIED live — `kitty @ ls` reports a real per-window value. When the signal is missing the
# helper fails SAFE and asks; a guard that goes quiet when its input disappears is worse than no
# guard, because it still looks like it is on.
#
# --type=background is what keeps kitty responsive while the dialog is up. Note the helper CANNOT
# use $KITTY_LISTEN_ON: a background launch does not inherit it (measured), so it re-derives the
# socket from its PPID. Do not "simplify" the helper by trusting that variable.
#
# FAILURE MODE, chosen deliberately: if the helper or the dialog breaks, it returns without
# closing anything. ⌘W does nothing rather than killing a session unasked.
map cmd+w        launch --type=background ${HOME}/.claude/bin/kitty-confirm-close window

# ⌃⇧W is kitty's OWN default for `close_window` — the same silent kill under a different finger,
# and it survives untouched unless it is re-bound here. Verified by dumping the parsed keymap:
# SingleKey(mods=5, key=119) resolved to a bare `close_window` with this file loaded.
map ctrl+shift+w launch --type=background ${HOME}/.claude/bin/kitty-confirm-close window

# ⌘⇧W is kitty's macOS default `close_os_window`. It DOES honour confirm_os_window_close (probed
# live 2026-08-04: a throwaway OS window running a command survived its own close_os_window call),
# so it was never unguarded — but that guard is the in-terminal takeover this section exists to
# get away from. Routed through the helper too, which asks once for the whole window and names how
# many running panes are about to go.
map cmd+shift+w  launch --type=background ${HOME}/.claude/bin/kitty-confirm-close os-window

# Zoom/unzoom the focused pane to fill the tab. Uses the `stack` layout above.
#
# 🚨 MOVED OFF THE ENTER KEY 2026-08-07, AFTER IT COST THE OPERATOR TWO SESSIONS.
# This was `map cmd+shift+enter toggle_layout stack` — iTerm2 parity, and a trap, because
# ⇧Enter is the NEWLINE key in the Claude Code composer and Claude Code runs in essentially
# every pane on this box. One slipped modifier ran `toggle_layout stack`, which draws ONLY the
# focused pane and hides every other session in that tab full-size behind it. The operator's
# report was "it seemed like it was deleted"; the session was alive, idle, and buried. It then
# happened a second time, to the session investigating the first one — so the operator could see
# one or the other and never both, which is precisely the stack-layout contract.
#
# kitty's OWN macOS default made it a three-way cluster on one key. Read out of the LOADED
# keymap (key 57345 = Enter), not from the docs:
#     ⇧Enter        (unbound in kitty)   → passes through: composer newline, the intended key
#     ⌘Enter        new_window           ← kitty stock default, neutralised below
#     ⌘⇧Enter       toggle_layout stack  ← was here
# Two of the three chords wreck the layout and all three are one modifier apart.
#
# ⌘⇧Z instead: mnemonic for zoom, nowhere near Enter, and probed FREE against the LOADED keymap
# (0 bindings at mods=cmd|shift, key=122) with the probe positive-controlled against ⌘D, which
# correctly read as TAKEN — the same discipline §3b and §4b used, because a lookup miss is not
# absence. Note ⌃⇧Z is separately taken by kitty's own `scroll_to_prompt -1`; this is ⌘, not ⌃.
map cmd+shift+z toggle_layout stack

# ⌘Enter — kitty's stock macOS `new_window`. NEUTRALISED, not rebound.
# It splits the focused pane in half and drops a bare shell into it. That is a destructive edit
# to a live layout: kitty's splits layout halves the CURRENT pane on every split, so repeated
# accidents walk a tab down 149 → 74 → 36 → 24 columns, and a Claude Code TUI stops being
# readable somewhere around 80. Measured on this box the same day: one tab at 24/49/149/49/24.
# Nobody wants that from a mistyped newline, and the deliberate way to split is ⌘D (§3), which
# at least opens in the current working directory.
map cmd+enter no_op

# ── THE STANDING RULE THIS SECTION NOW ENFORCES (operator directive 2026-08-07) ──
# "Use out-of-the-box Claude Code keybindings as expected, rather than restrict ourselves to
# not use them." kitty is the host; Claude Code owns the keyboard. Where the two collide,
# kitty yields — we do not train fingers around a terminal binding.
#
# Claude Code's documented multiline chords (code.claude.com/docs/en/interactive-mode):
#     \ + Enter     every terminal
#     Shift+Enter   "Native in … Kitty …", no configuration required
#     Option+Enter  requires Option-delivered-as-Meta (the line below)
#     Ctrl+J        every terminal, no configuration
# Cmd+Enter appears ZERO times in that document — Claude Code binds nothing on it. So the two
# chords removed above were never Claude Code's; they were kitty's, sitting one modifier away
# from ⇧Enter, which is the one that matters. Nothing above costs a Claude Code shortcut.

# Deliver Option as Meta. WITHOUT THIS, FIVE DOCUMENTED CLAUDE CODE SHORTCUTS SILENTLY DO
# NOTHING — Option+Enter (newline) and Alt+B / Alt+F / Alt+Y / Alt+P (word-motion, yank,
# history). Measured 2026-08-07: kitty binds NONE of alt+b/f/y/p, so kitty was never the thing
# intercepting them — `macos_option_as_alt` defaulted to 0, meaning Option is a compose key and
# never reaches the application as a modifier at all. The chords did not lose a fight; they were
# never delivered. Claude Code's docs call for exactly this and name the equivalent switch for
# iTerm2 ("Esc+"), Apple Terminal ("Use Option as Meta Key") and VS Code.
#
# `left`, not `both`, on purpose: the LEFT Option becomes Meta and the RIGHT Option keeps typing
# accented characters (é, ü, …), so nothing is actually lost. Change to `both` if you never type
# accents and want the right key to work too.
#
# Enum, measured by loading each spelling rather than read off a legend — the ordering is not
# what you would guess and getting it backwards silently swaps which physical key works:
#     no → 0 · right → 1 · left → 2 · both/yes → 3
macos_option_as_alt left

# ─────────────────────────────────────────────────────────────────────────────
# 3b. DRAGGING PANES WITH THE MOUSE — the half of iTerm2's split handling that
#     keyboard bindings cannot cover
# ─────────────────────────────────────────────────────────────────────────────
# iTerm2 gives a split two mouse gestures: drag the DIVIDER to resize, and drag a pane by its
# header to re-order it. kitty implements both, but neither is usable as shipped, and they fail
# in two DIFFERENT ways — so they need two different fixes, not one.
#
# RESIZE — on by default, but effectively un-hittable. `window_drag_tolerance` (default 2pt) is
# the tolerance around a border where a left-press starts a border drag, and `window_border_width`
# is a 0.5pt hairline. Raising the tolerance widens the GRAB REGION while drawing exactly zero
# extra pixels — the right lever at 30 panes, where border width is screen space we cannot spend.
# 6pt is comfortably grabbable yet well inside a cell, so a click meant for text near a divider is
# not swallowed. kitty's own docs note a border drag resizes the layout row/column/slot rather
# than one window, so several panes may move together — that IS iTerm2's divider behaviour.
# kitty's documented off switch is a large negative value (e.g. -200), not 0.
window_drag_tolerance 6

# 🚨 THE CHORDS ARE SWAPPED AS OF 2026-09-15, AND EVERYTHING BELOW THIS NOTE IS THE ARGUMENT
# THAT LED TO THE PREVIOUS ASSIGNMENT. It is kept because it is the record of what was believed
# and why, and because the CONSTRAINT it establishes is unchanged — only the operator's side of
# the trade moved. Operator, with a photograph of two stacked bars: "we want ONE title bar on
# ⌘⇧B" — styled, DRAGGABLE, showing the hand cursor. Those cannot all be one artifact: the
# overlay is a graphics placement, i.e. PIXELS above the cell grid, so it is not in kitty's
# hit-test and can never carry a hand cursor or be dragged, however it is drawn. The handle has
# to be a real bar. So asking for a draggable bar on ⌘⇧B IS choosing the real bar on ⌘⇧B, and
# the row it takes while it is up is the cost he is now buying. He is not buying a PERMANENT
# row: kitty hides these bars again the moment a drag lands ("After any drag operation
# completes, the bars are automatically hidden again", kitty.conf(5)), so the row is transient
# and the padding reservoir he rejected stays rejected.
#   ⌘⇧B  the ONE bar — real, hit-tested, grabbable, in our palette, Monaco, one row while up
#   ⌘⌥B  the styled zero-shift glance — the overlay, no PTY resize, no cost when off
# What the real bar CANNOT wear is the overlay's face: kitty 0.48.2 styles it by COLOUR AND
# ALIGNMENT ONLY (window_title_bar_align, window_title_bar_{active,inactive}_{fg,bg}) — there is
# no font/size/weight option, so SF Pro Semibold is unreachable on it. The palette below is
# already the overlay's, which is why the real bar in his screenshot already carried our colours.
#
# RE-ORDER — absent by default, and not because of a missing keybinding: the grab handle is the
# window TITLE BAR, which kitty does not draw. kitty documents `toggle_window_title_bars` as
# "Temporarily show window title bars to allow drag-to-reorder", so the map below IS the feature.
# Without it there is no way to drag a pane to a new position; ⌘⇧arrows (§4) move a pane by
# keyboard, but that is a different gesture and cannot target an arbitrary slot.
# ⌘⇧B verified FREE against the loaded keymap (kitty 0.48.2) — not merely absent from a list:
# the probe was positive-controlled against ⌘D, which correctly read as taken.
# REVERTED to the built-in on 2026-09-14, after a zero-shift replacement was built, landed and
# then measured DEAD ON THIS MACHINE. The replacement toggled `window_title_bar_min_windows` and
# compensated the stolen row out of the top padding — sound, and proven in a clean instance (rows
# constant, SIGWINCH 0/0, bar visible, content unmoved, all in one run). It does not work on the
# operator's live windows, and the reason is specific: a per-tab `toggle_window_title_bars` override
# BEATS min_windows and persists across config reloads, so the config flips and nothing appears.
# Measured on his focused OS window: config in the ON state -> 0 title-bar rows; one
# `toggle_window_title_bars` action -> 34. The chord was flipping a setting his windows ignore.
# The per-tab toggle cannot be fused with the padding swap — it is an action, not a config value, so
# it is a SECOND relayout: 2 signals per press against the built-in's 1. Strictly worse.
# Full record: docs/research/kitty-pane-title-overlay-2026-09-14.md § G.
# SUPERSEDED AGAIN on 2026-09-14, and this time the row is not paid at all. Operator, on the
# reverted built-in: "command shift b works now but still causes the original content layout shift
# jitter", and on the padding reservoir: "Having a permanent row for a no CLS show/hide row is not
# the answer." Both are correct and together they rule out every in-grid option: the bar needs one
# cell of pixels, and inside the grid it can only TAKE a row (shift) or RESERVE one (permanent cost).
# The third place is ABOVE the grid. `scripts/kitty-pane-title-overlay.py` draws the title as a
# graphics-protocol placement at z=1, which the protocol defines as painting over the glyphs, so the
# grid never changes: no PTY resize, no SIGWINCH, and zero cost when off. MEASURED on live Claude
# panes: 4/4 labelled, rows 47 before and after, content unmoved.
# THE COST, stated plainly: row 1 of each pane is COVERED while titles are up, not moved. And kitty
# frees a placement on any clear or scroll without telling anyone, so the script re-asserts every 2s
# while ON and stops the moment it is toggled OFF.
map cmd+shift+b combine : launch --type=background --allow-remote-control ${HOME}/.claude/scripts/kitty-pane-title-overlay.py off --all : toggle_window_title_bars

# ⌘⌥B — THE REORDER DRAG, WHICH THE OVERLAY ABOVE SILENTLY COST US (2026-09-14).
# Operator: "ensure that command shift b still allows for dragging split panes in placement.
# its not working for me right now." It was not working, and it was this file's own doing:
# §3's RESIZE/RE-ORDER note says the re-order grab handle IS the window title bar, and the
# overlay draws a PICTURE of one. kitty has no idea that image exists — its drag machinery
# hangs off real title-bar render data (`set_window_being_dragged`, `set_window_drag_overlay`,
# `set_window_title_bar_render_data` in fast_data_types) — so replacing the built-in with a
# graphics placement kept the label and dropped the gesture. Nobody wrote that down.
#
# ONE CHORD CANNOT DO BOTH, and the reason is structural rather than a missing option. The
# handle has to be a real bar; a real bar takes a text row; taking a row is the PTY resize
# that IS the jitter the overlay exists to remove. So the two gestures want opposite things
# and get one chord each:
#   ⌘⇧B  the everyday glance — zero shift, legible, nothing moves, many times a day
#   ⌘⌥B  the deliberate rearrange — real bars, grabbable, one row while they are up
# ⌘⌥B was verified free in this file (⌘⌥ is used only by the arrows, o, and shift+o).
# SWAPPED 2026-09-15 (see the note at the head of §3): the operator asked for the grabbable bar
# on ⌘⇧B, so the two roles traded chords. The paragraph above is left as written because its
# STRUCTURAL claim — one chord cannot do both — is what makes the swap a choice rather than a
# bug, and it is the sentence a future session will otherwise re-derive.
#
# 🚨 AND IT MUST WIPE THE OVERLAY FIRST, BECAUSE THE TWO TOGGLES STACK AND ONE OF THEM IS A
# PICTURE. Operator, 2026-09-15, with a screenshot: "the title above drags but not the title
# below. why do we have double title". Both were on. kitty's real bar takes a row and sits at
# the top of the pane; the overlay strip then paints over the pane's FIRST CONTENT ROW, i.e.
# directly beneath it — two labels of the same text, one above the other, in two different
# faces. The top one is kitty's and drags. The bottom one is a graphics placement: it is
# PIXELS, it is not in kitty's hit-test at all, so it shows no hand cursor and can never be
# grabbed. That is the whole of the "drag-to-reorder is broken" report — the drag worked and
# the wrong thing was being dragged, which no amount of instrumenting the drag could reveal.
#
# The two chords were designed as independent and that is the defect: they are mutually
# exclusive VIEWS of the same information. Arming the rearrange therefore clears the glance
# first, so there is exactly one bar on screen and it is the one that responds to the mouse.
# `combine` runs them in order; the overlay's `off` is a no-op when it is already hidden, so
# the chord stays a plain toggle for anyone who never uses the other one. That guard now
# rides ⌘⇧B, which is where the operator's "ONE title bar" ask lands.
map cmd+opt+b launch --type=background --allow-remote-control ${HOME}/.claude/scripts/kitty-pane-title-overlay.py toggle

# `drag_threshold` (default 5px — the distance before ANY drag begins) is deliberately left alone.
# It already matches iTerm2's feel, and lowering it turns ordinary text selection near a border
# into an accidental window drag. A value of 0 disables dragging entirely.

# ─────────────────────────────────────────────────────────────────────────────
# 4. PANE NAVIGATION
# ─────────────────────────────────────────────────────────────────────────────
# Directional focus — the split-aware equivalent of iTerm2's ⌘⌥arrows.
map cmd+opt+left  neighboring_window left
map cmd+opt+right neighboring_window right
map cmd+opt+up    neighboring_window up
map cmd+opt+down  neighboring_window down

# Cycle panes (iTerm2 ⌘] / ⌘[).
map cmd+]         next_window
map cmd+[         previous_window

# Move the focused pane within the split tree. This is a SWAP with the neighbouring slot, not a
# free placement — and it is a silent no-op when that direction has no neighbour: no beep, no
# message, nothing. In a two-pane side-by-side tab, ⌘⇧↑/↓ are therefore correctly dead, which
# reads exactly like a broken binding. `layout_action move_to_screen_edge` below is the action
# that can put a pane somewhere it has no neighbour to trade with.
map cmd+shift+left  move_window left
map cmd+shift+right move_window right
map cmd+shift+up    move_window up
map cmd+shift+down  move_window down

# Relocate the focused pane to a whole edge of the tab — the placement `move_window` cannot express.
# ⌥ rather than ⇧ only because ⌘⇧+arrows is already `move_window`; these keep the
# arrow-family shape (⌘⌥ = go to neighbour, ⌘⇧ = move, ⌘⌥⇧ = move to edge).
map cmd+opt+shift+left  layout_action move_to_screen_edge left
map cmd+opt+shift+right layout_action move_to_screen_edge right
map cmd+opt+shift+up    layout_action move_to_screen_edge top
map cmd+opt+shift+down  layout_action move_to_screen_edge bottom

# Flip a split's axis (side-by-side ↔ stacked). `rotate 180` swaps the pair instead of rotating it.
map cmd+shift+r layout_action rotate

# Give every split an equal share again after manual resizing.
#
# Verified 2026-08-02: 73/99/61/61 → 74/74/74/74 in one shot.
# If you ever test this from the shell, `kitty @ action` targets the ACTIVE
# window, NOT the one you ran it in — so `kitty @ action layout_action equalize`
# silently equalizes some *other* tab and this one looks untouched. Use
# `kitty @ action --self layout_action equalize`. (`kitty @ action` also exits 0
# on an unknown action name, so a bare exit code proves nothing either way.)
map cmd+shift+e layout_action equalize

# Resize mode — press, use arrows, Esc to leave.
map cmd+r start_resizing_window

# ─────────────────────────────────────────────────────────────────────────────
# 4b. MOVING A PANE OUT OF ITS TAB — the cross-MONITOR case
# ─────────────────────────────────────────────────────────────────────────────
# `move_window` above can only trade places inside ONE tab's split tree. Reaching another tab — or
# another OS window, which is the only way a pane reaches a second monitor — is a different action:
# detach_window. Measured on this box (kitty 0.48.2) by detaching a live pane twice: window id and
# child pid were UNCHANGED through a move into a new OS window and then into an existing tab. The
# pty survives, so a running Claude Code session moves with its scrollback and its process intact.
# That is the property that matters at fleet scale — a pane holds hours of session state.
#
# kitty has NO action that sends an OS window to a chosen display; a pane's monitor is simply
# wherever its OS window happens to sit. So the one-step route to "the other screen" is to detach
# INTO a tab that already lives there, which is what `ask` is for — it opens a chooser of tabs.
map cmd+shift+o detach_window ask

# Straight out into a NEW OS window (then place it on the monitor once, by hand).
map cmd+opt+o detach_window

# Move the whole TAB to another OS window; `ask` chooses which.
# ⌘⌥⇧ and not ⌘⌃ — ⌃ is unused by hand here, and ⌘⇧O is already detach_window.
map cmd+opt+shift+o detach_tab ask

# ⌘⇧O / ⌘⌥O / ⌘⌃O were probed FREE against kitty's own loaded keymap (n=0 for all three), with the
# probe positive-controlled against ⌘D, which correctly read as taken — the same discipline §3b
# used for ⌘⇧B, because "absent from the docs" is not the same fact as "absent from the keymap".
#
# NOT enabled: `tab_bar_min_tabs 1`. kitty's docs are explicit that TABS — never panes — can be
# dragged between OS windows with the mouse, but the default of 2 hides the tab bar while each OS
# window holds a single tab, so there is no handle to grab. Showing it costs one text row in EVERY
# OS window, permanently, and §6 is explicit that screen space is what we cannot spend at 30 panes.
# The keyboard routes above need no tab bar. Uncomment only if you want the mouse gesture:
# tab_bar_min_tabs 1

# ─────────────────────────────────────────────────────────────────────────────
# 5. TABS
# ─────────────────────────────────────────────────────────────────────────────
map cmd+t new_tab_with_cwd
map cmd+shift+]  next_tab
map cmd+shift+[  previous_tab

# ── The tab bar has to stop lying about what it is holding (added 2026-08-07) ──
#
# kitty's DEFAULT tab_title_template is effectively "{title}", and a tab's title is the title of
# its ACTIVE pane. So a tab holding five live Claude Code sessions advertises exactly one of
# them, and the other four have no representation anywhere on screen — not a pixel, not a name.
# That is what made a session unfindable on 2026-08-07: the operator was hunting for
# "Investigate lakehouse-lecture session crash", and the tab actually holding it was labelled
# "Fix shared repo checkpoint overflow in teammate-checkpoint.sh".
#
# `num_windows` and `layout_name` are real fields on kitty 0.48.2's TabBarData — verified by
# reading kitty.tab_bar.TabBarData.__annotations__ out of the running install, not from docs.
#
#   {num_windows}  a tab holding more than one session now SAYS how many.
#   {layout_name}  renders `stack` when the tab is ZOOMED. Zoom hides every non-focused pane in
#                  the tab, and until now it did so with no on-screen indication of any kind —
#                  the operator's "it seemed like it was deleted". A zoom must be visible even
#                  after the binding that caused it accidentally has been moved off Enter (§3),
#                  because ⌘⇧Z can still be pressed on purpose and then forgotten.
#
# 🚨 VERIFY BY SCREENSHOT, NEVER BY `kitty @ load-config` EXITING 0. kitty accepts unknown
# placeholder text in this template silently and renders it literally, so a typo ships as
# decoration. `kitty @ ls` reports the WINDOW title, not the rendered bar, and cannot catch it.
# (Same lesson as the ```bash-fence-vs-inline-code rule: a rendering claim is only true of the
# renderer you actually looked at.)
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{f'[{num_windows}] ' if num_windows > 1 else ''}{f'⧉ ' if layout_name == 'stack' else ''}{title}"

# Cap each tab's title so the bar stops DROPPING tabs entirely.
# Operator report, same day: "kitty has tabs on the bottom but it doesn't display ALL of the tabs
# and only reveals more once I delete or move tabs." kitty divides the bar between tabs and does
# not scroll or paginate; past a certain count the overflow is simply not drawn, with no "+3 more"
# indicator. Long Claude Code session titles (they run 60-70 chars) are what exhausts the width.
# 22 chars is enough to tell two sessions apart and fits roughly 3x as many tabs on a 2560px
# display. This does NOT make the bar authoritative — `cc-where` is what actually answers "where
# is my session", because no bar can name panes that are inside a tab rather than being the tab.
tab_title_max_length 22

# ─────────────────────────────────────────────────────────────────────────────
# 6. BEHAVIOUR AT 30+ PANES
# ─────────────────────────────────────────────────────────────────────────────
# Every pane holds its own scrollback in memory; this is the one memory knob that scales with pane
# count. 2000 lines/pane is kitty's default and is deliberately NOT raised here — overflow spills
# to a disk-backed pager instead of RAM.
scrollback_lines 2000

# ── Redraw throttling (added 2026-08-02 after a measured lag investigation) ──
# A live Claude TUI animates a spinner continuously, so at N panes kitty has N always-dirty
# regions and never reaches an idle state. Measured on this box at 21 panes across 4 OS windows
# on 3×5K + 1 XDR: WindowServer 71% CPU, kitty 10%. The two knobs below are the only ones that
# scale down with pane count; both trade frames nobody can see for compositor headroom.
#
# repaint_delay: kitty's default 10ms = up to 100 FPS. The displays are 60Hz, so frames 11-100
# are composited and discarded. 16ms caps at the panel rate — imperceptible, and it removes the
# redraws WindowServer was compositing and throwing away, across every visible pane.
repaint_delay 16
#
# input_delay: default 3ms. Claude streams tokens in small writes; a short delay means kitty wakes
# per-write and redraws a partial screen. 5ms batches more PTY output per redraw — fewer wakeups,
# fewer partial repaints. Kept small so typing latency is untouched (this delays the *program's*
# output being processed, not keystrokes).
input_delay 5
#
# NOT tunable from here, but the dominant kitty MEMORY term — recorded so the next investigation
# does not re-derive it: kitty's footprint measured 1667 MB, of which 1125 MB IOSurface + 172 MB
# IOAccelerator = 78% GPU backing store. IOSurface is allocated per OS WINDOW (33 regions for 4
# windows), sized to that window's 5K backing store — it does NOT scale with pane count, and only
# the active tab of an OS window renders. So the same 21 panes held as 4 tabs in ONE OS window
# cost a fraction of 4 separate OS windows. That is a layout choice, deliberately left to the
# operator rather than forced here.

# Do not let a stray ⌘Q during a 30-pane run take the fleet with it.
#
# This is now the BACKSTOP, not the main guard — §3's three bindings put a native macOS dialog in
# front of ⌘W / ⌃⇧W / ⌘⇧W. What is left are the paths that are not key bindings at all and so can
# never be intercepted: the red traffic-light button, the OS-level close shortcut, and `quit`.
# Those still get kitty's in-terminal takeover. It is ugly and it is kept anyway — an ugly guard
# beats no guard on a path nothing else can reach.
#
# WAS `2` — "at least this many panes in the window". That counted panes, not WORK, and it left
# the exact hole that cost a live session on 2026-08-04: a SINGLE-pane OS window running Claude
# Code counts 1, which is < 2, so it closed silently. `-1` (kitty's own default) flips the unit
# from panes to running commands: with shell integration on, panes sitting at a shell prompt are
# not counted at all, so the threshold is "≥1 pane is actually running something".
#
# The trade this makes, stated so nobody re-derives it: an OS window holding several IDLE shells
# now closes without a prompt, where `2` would have asked. That is the intended direction — the
# prompt should track work in flight, not rectangles on screen. Add `count-background` to the
# value if detached background jobs should also block a close; deliberately not taken.
confirm_os_window_close -1

# Keep the app alive when the last window closes, so a restart does not race the fleet coming back.
macos_quit_when_last_window_closed no

# A pane whose command exits should close, not linger as a dead rectangle in a 30-pane grid.
# (This is kitty's default; stated explicitly because the handoff self-close path depends on it.)
close_on_child_death no

# ─────────────────────────────────────────────────────────────────────────────
# 6b. URLs & HYPERLINKS — why clicking a link "did nothing, or sometimes copied"
# ─────────────────────────────────────────────────────────────────────────────
# SYMPTOM: clicking a link in a pane either did nothing at all, or copied to the clipboard
# instead of opening. Both are the SAME root cause, and neither is about the browser — Dia was
# already the macOS default handler (LSHandlers: http/https -> company.thebrowser.dia, read out
# of com.apple.launchservices.secure.plist), and `open -b company.thebrowser.dia <url>` exits 0.
# The URL opener was never broken. The CLICK never reached it.
#
# kitty's own shipped defaults (read out of this machine's kitty.conf reference, 0.48.2):
#     mouse_map left click            ungrabbed          mouse_handle_click selection link prompt
#     mouse_map ctrl+shift+left release grabbed,ungrabbed mouse_handle_click link
#
# Two independent facts fall out of those two lines:
#
#   1. "DOES NOTHING" — the plain-left-click mapping is `ungrabbed` ONLY. A full-screen TUI that
#      enables mouse reporting (Claude Code, vim, lazygit) GRABS the mouse, so the click is
#      delivered to the application instead of to kitty, and kitty never looks for a link. Since
#      most panes on this box are running Claude Code, that is the common case, not the edge case.
#
#   2. "SOMETIMES COPIES" — in the ungrabbed case the plain-click handler is
#      `selection link prompt`, and that list is a PRIORITY ORDER. With an active selection under
#      the pointer, the click resolves the SELECTION and returns; the link is never considered.
#      So the same click opens a link or handles a selection depending on invisible prior state,
#      which is exactly the "not always" the operator described.
#
# THE FIX IS A BINDING THAT IS LINK-ONLY AND GRAB-INDEPENDENT.
# `cmd+left` was verified FREE: kitty ships NO mouse_map using cmd/super at all (grep over the
# full default mouse_map list, n=0), so this claims nothing. It is also the native macOS
# open-a-link gesture, and TUIs do not consume it. Note `mouse_handle_click link` — link ALONE,
# with no `selection`, so it cannot be pre-empted by a stray selection the way the default is.
mouse_map cmd+left click grabbed,ungrabbed mouse_handle_click link

# kitty's own ctrl+shift+left is left untouched — it already works in both grab states and is
# muscle memory for anyone who knows kitty. This adds a route; it removes none.

# Pin the browser rather than inheriting the OS default. `default` works TODAY only because Dia
# currently holds the http/https handler — any browser install or update can silently steal that,
# and the failure mode is "links open in the wrong app", which nobody files a bug about.
# Verified parseable: kitty stores this option as a LIST (runtime default is ['default'], i.e. it
# is parsed with to_cmdline), so arguments are legal here — this is not a single-program field.
# Bundle id, not a path: survives the app being moved or renamed.
#
# …and route claude.ai links to the ACCOUNT that owns the pane you clicked in. One
# `open -b` for every pane means an artifact published by the account-3 session lands in
# the account-1 Dia Space and renders "Page not found" — the link is fine, the browser
# identity is wrong. cc-url-open reads the focused kitty window, looks its account up in
# cc-registry, maps it through accounts.json to that account's Dia Space, and opens there.
# Everything else (and every failure) falls through to the `open -b` this line used to be.
#
# WHY A /bin/sh WRAPPER, not the bare command: kitty spawns this WITHOUT a shell and with
# a Dock-launch PATH, so `cc-url-open` would not resolve and a bare absolute path would
# hardcode $HOME. The shell expands $HOME, and its `||` is the load-bearing part — if
# cc-url-open is missing (fresh machine, pre-install), sh exits 127 and the link still
# opens. A link handler that can swallow a click is worse than one that routes it wrong.
open_url_with /bin/sh -c '"$HOME/.claude/bin/cc-url-open" "$@" || open -b company.thebrowser.dia "$@"' cc-url-open

# Make hyperlinks DISCOVERABLE. kitty's default `underline_hyperlinks hover` only underlines an
# OSC-8 hyperlink once the pointer is already on it, so there is nothing on screen telling you a
# link is there to aim at. `always` marks them permanently, using url_style/url_color (§7a).
underline_hyperlinks always

# Show the real target while cmd is held — the same modifier that activates the link above, so
# the gesture is "hold cmd, read where it goes, click". Guards against OSC-8 links whose visible
# text and actual target disagree.
show_hyperlink_targets cmd

# KEYBOARD ROUTE — WITHDRAWN 2026-08-17 (operator ruling; closes decision bbbedc12cb8b).
#
# THE BINDING THIS REPLACES, and why it existed:
#   map --allow-fallback=shifted,ascii cmd+e open_url_with_hints
# kitty binds the hints kitten to kitty_mod+e (= ctrl+shift+e), a three-key chord needing two
# hands — the operator's verdict was "no way I'm gonna memorise that, it's hard on the hand",
# a usability defect and not a preference. ⌘E was probed FREE against the LOADED keymap
# (positive-controlled against ⌘D, which correctly read as taken) and added as a one-handed
# alias to the SAME action, so kitty's own docs still read true.
#
# WHY IT IS NOW no_op. The premise was "a laptop with no mouse". That premise is false HERE:
# two better routes to the same job already exist in this very file and are used instead —
# `mouse_map cmd+left click … mouse_handle_click link` (§6) opens any link with the trackpad
# that sits under the palm, and `underline_hyperlinks always` + `show_hyperlink_targets cmd`
# (above) make every link permanently visible and preview its target before you commit. The
# hints kitten earns its keep on a keyboard-only/tiling setup where reaching for a pointer is
# genuinely expensive. This box is a MacBook. So ⌘E bought an ALIAS, not a capability.
#
# AND ITS FAILURE MODE IS DISPROPORTIONATE, which is what settles it. Three properties compound:
# it is MODAL (grabs the keyboard until you pick a hint or press ESC); it REPAINTS THE PANE AS
# PLAIN UNCOLOURED TEXT (indistinguishable from a crashed TUI — layout intact, every SGR colour
# gone, emoji unaffected); and it offers NO on-screen affordance saying ESC is the way out.
# On a fleet of ~16 concurrent panes, most running unattended, one mis-hit yields a pane that
# looks dead and will not accept keys. Measured cost: ~8 minutes of crash investigation on a
# perfectly healthy session, and a second overlay caught live on an unrelated pane during the
# 2026-08-17 sweep — so this is recurrent, not a one-off.
#
# WHAT IS NOT LOST: kitty's own ctrl+shift+e stays bound (kitty ships it; nothing here removes
# it), so the hints kitten remains reachable — only the mis-hittable one-handed alias is gone.
# To restore, delete the no_op line and reinstate the map line quoted above verbatim.
#
# Precedent: `map cmd+enter no_op` (§3) neutralises a stock binding for exactly this class of
# reason — a single mistyped chord silently wrecking a live layout.
map cmd+e no_op

# ─────────────────────────────────────────────────────────────────────────────
# 7. APPEARANCE — kitty's stock defaults are the harshest of the three terminals
# ─────────────────────────────────────────────────────────────────────────────
# Until this section existed, §1-6 declared layout, remote control and keybindings and
# NOTHING about appearance, so kitty ran its stock defaults. Measured 2026-07-31 against
# the iTerm2 "Default" profile this fleet actually ran for months, and against Ghostty's
# shipped defaults (`ghostty +show-config --default`):
#
#                                   kitty stock   iTerm2 (ours)   Ghostty stock
#   background                      #000000       #1e1e24         #282c34
#   foreground                      #dddddd       #e6e6e6         #ffffff
#   fg/bg contrast ratio            15.46:1       13.29:1         ~12:1
#   ANSI slots at 100% saturation   7 of 12       4 of 12         0 of 12
#   window padding                  0 px          inset           3 px vertical
#   font                            monospace/11  Monaco 12       (system)/13
#                                   (7c now runs Monaco 14 — two points above iTerm2 by request)
#
# THE PALETTE IS THE DOMINANT TERM, not the background. Claude Code's TUI leans on green
# (diff-adds, ✓, tool names), cyan (paths, links) and yellow (warnings) — and those are
# exactly the slots where kitty's default is a PURE PRIMARY. ansi10 #23fd00 and ansi11
# #fffd00 are 100% saturated and land at 15.1:1 and 19.3:1 against pure black. That is a
# neon sign, not a terminal. The same three slots in our iTerm2 profile are #6bf385 /
# #ffd959 at 11.7:1 and 12.1:1 — same hue, same legibility, none of the glare.
#
# The background still matters, but as a MULTIPLIER: contrast is measured against it, so
# lifting #000000 → #1e1e24 softens every colour at once, INCLUDING the 24-bit truecolor
# Claude Code emits that no palette entry can reach.

# ── 7a. Colours — ported verbatim from the iTerm2 "Default" profile ──────────
# Read out of ~/Library/Preferences/com.googlecode.iterm2.plist, not hand-picked, so this
# is the exact look the fleet ran before the kitty migration. To go softer still, swap the
# background for Ghostty's #282c34; nothing else in this file depends on the value.
background            #1e1e24
foreground            #e6e6e6

# Normal
color0  #262b33
color1  #e04040
color2  #52dc6b
color3  #f3c233
color4  #6194f3
color5  #c77ae6
color6  #4de0e0
color7  #c8c8c8
# Bright
color8  #727272
color9  #ff6b6b
color10 #6bf385
color11 #ffd959
color12 #80b3ff
color13 #e094ff
color14 #66f3f3
color15 #e6e6e6

# kitty's default selection background is #fffacd (lemon chiffon) — a full-brightness
# yellow flash on every drag. iTerm2 used a muted slate; that is what is ported here.
selection_background  #3a4555
selection_foreground  #e6e6e6

# Links: kitty's default url_color is a saturated blue. ansi12 is the same hue, softened.
url_color             #80b3ff

# ── 7b. Cursor — iTerm2 had "Blinking Cursor = False" and that is load-bearing here ──
# One blinking block is a non-issue. THIRTY of them, animating out of phase across a
# 30-pane grid, is continuous peripheral motion in a field you are trying to read.
# 0 disables blinking outright.
cursor                #e6e6e6
cursor_text_color     background
cursor_blink_interval 0

# ── 7c. Font ─────────────────────────────────────────────────────────────────
# kitty's default is the generic `monospace` family at 11pt, which resolves to Menlo on
# macOS — a different typeface AND a point smaller than what this fleet was reading.
#
# KNOWN COST, stated rather than discovered later: Monaco ships exactly ONE face.
# kitty's auto bold/italic resolution returns /System/Library/Fonts/Monaco.ttf for all
# four slots (medium, bold, italic, bold-italic), so bold and italic are SYNTHETIC.
# Claude Code's TUI uses both heavily. This is not a regression — iTerm2 ran the same
# single-face Monaco with "Use Bold Font = True", i.e. synthesising too — but it is the
# one place a different family would beat parity.
#
# If real bold/italic is wanted, the only monospace family on this box with four genuine
# faces (plus Nerd glyphs) is JetBrainsMono, verified resolvable as:
#     font_family JetBrainsMono Nerd Font Mono
# (-Regular / -SemiBold / -Italic / -SemiBoldItalic). Menlo also has four real faces.
# Left as an offer, not taken: it changes the typeface the operator has read for months.
font_family           Monaco
font_size             18.0

# SIZE IS DELIBERATELY SIX POINTS ABOVE iTerm2 PARITY (operator request; 12.0 -> 14.0 on
# 2026-08-01, 14.0 -> 18.0 on 2026-08-26). iTerm2 ran Monaco 12. Everything else in 7a-7d stays at
# parity — this line is the only place the two diverge, so reverting is a one-token edit back to
# 12.0 and touches nothing else.
#
# 🚨 18.0 IS THE OPERATOR'S MEASURED PREFERENCE, NOT A GUESS, AND IT HAS TO LIVE HERE. It was
# recovered on 2026-08-26 by calibrating the cell grid against known sizes on a fixed window
# (14 -> 74 cols, 16 -> 63, 17 -> 60, 18 -> 57, 19 -> 54, 20 -> 50, 21 -> 48) and confirming
# `set-font-size 18` reproduced the 57-col grid the operator had just set by hand. Until this
# edit the file said 14.0, so the config watcher documented at the top of this file reverted his
# ⌘+ zoom to 14 every one to three minutes, all day, invisibly. There was nothing to read back:
# kitty holds the runtime size in memory only, `kitty @ ls` does not report it, and no file on
# disk records it — so a zoom lost to a reload is UNRECOVERABLE and has to be re-measured this
# way. If the operator changes size again, change THIS LINE; a bare ⌘+ will not survive.
#
# What it costs, measured rather than assumed: kitty's natural Monaco cell grows 8x16 -> 9x19
# px logical (12pt -> 14pt), so a pane loses roughly an eighth of its columns and a sixth of
# its rows. That is the real trade at 30 panes, and it is the operator's call to spend it.
#
# LINE HEIGHT IS NOW SET, AND IT IS AN ALIGNMENT FIX, NOT A TYPOGRAPHY PREFERENCE. kitty's
# natural Monaco line box (48 device px at 18pt) matches iTerm2 at "Vertical Spacing 1.0", and
# that was the reason to leave it alone until 2026-09-13. What changed is that a full-borders
# grid (7d, `draw_minimal_borders no`) makes pane RECTANGLES visible, and rectangles have to
# line up. They could not, and the reason is pure arithmetic:
#
#   OS window cell area      2160 device px          a stacked pair splits it at exactly 1080
#   cell height 48           2160 / 48 = 45 rows     1080 / 48 = 22.5  <- NOT a whole cell
#
# A 44-row full-height pane therefore ends 24 device px short of where a 22+22 stack ends, and
# NOTHING in the decoration budget can close it: solving the layout for an arbitrary chrome C
# gives bottom_single - bottom_stacked = 1080 - 48*k, which for integer k is +-24 and never 0.
# Measured, not derived: `window_padding_width 0 4` moved 8 px out of the panes and into the
# seam and left the 24 px gap EXACTLY where it was. placement_strategy only chooses which edge
# wears the error — `center` splits it 12/12, `top` puts all 24 at the bottom.
#
# The only lever that reaches it is the cell height, because the condition for equal leftover
# in both columns is `(cell area / 2) MOD cell_height == 0`. At 94% kitty rounds the cell to
# 45 device px, and 1080 = 24 x 45 exactly. Measured on the live 3-pane window:
#
#   48 px cell   left box 0..2123   right 0..1067 + 1080..2147   bottom edges 24 px apart
#   45 px cell   left box 0..2118   right 0..1038 + 1080..2118   bottom edges IDENTICAL
#
# It is also the rare fix that pays: rows go 44 -> 47 in a full-height pane and 22 -> 23 in each
# half, i.e. ~7% more content, and the render was checked rather than assumed — at 18pt Monaco a
# 45px line box still reads open, not cramped. And it is robust to how the tab is split, which
# 48 was not: 1080 halves, thirds (720 = 16x45), quarters (540 = 12x45) and sixths are all whole
# cells at 45, whereas at 48 only thirds were.
#
# TIED TO THE WINDOW HEIGHT, so do not treat it as a free constant. The arithmetic above assumes
# a 2160 device px cell area (a 1728x1080 pt OS window under the macOS menu bar). If that height
# changes, re-derive: the value that aligns is any cell height dividing HALF the new cell area.
modify_font           cell_height 94%

# ── 7d. Breathing room — the other half of "harsh" ───────────────────────────
# kitty's default padding is 0 on all four sides, so glyphs touch the pane divider and the
# window edge (visible in the 2026-07-31 baseline capture: text hard against every seam).
# Two values = vertical, horizontal.
#
# THESE NUMBERS ARE DERIVED, NOT CHOSEN FOR TASTE — padding is what absorbs the sub-cell
# remainder, and that is the difference between a flush grid and a gappy one. Once the cell
# height divides the split (7c), each pane's leftover is exactly `cell - chrome`, where chrome
# is the pane's own borders plus vertical padding. That leftover has to go SOMEWHERE: with it
# outside the boxes it shows up as dead space, once between every stacked pair and again at the
# foot of the window. Pushed INSIDE, it is breathing room around the glyphs and the boxes sit
# flush. Operator, 2026-09-13, on the gappy state: "i feel like were leaving a lot of room on
# the bottom and also in between vertically stacked split panes."
#
# Measured on the live 3-pane window (device px, 45px cell), grid 77x47 / 77x23 in every row:
#
#   vertical padding    0pt      2pt      10pt
#   gap at the seam     41 px    33 px     1 px
#   gap at the bottom   41 px    33 px     1 px
#
# 10pt vertical (= chrome 44 of a 45px cell) leaves ONE pixel and costs ZERO rows — the row
# count is identical at all three values, because the space was never doing anything.
# 7pt horizontal is the same trick on the other axis, and is CAPPED there: 77 columns need
# chrome <= 34 device px, so 7.5pt is the ceiling and 8pt silently costs a column. It takes the
# side gutters from 7/14/7 px to 1/2/1 and, with the top edge already flush at 0, makes every
# edge of every pane uniform to within one device pixel — the consistency the operator asked
# for after seeing a flush top against an inset side.
window_padding_width  10 5
# HORIZONTAL 7 -> 5, 2026-09-14, and the 2px is not the point — the COLUMN it buys is.
# Operator: "sometimes if we have more than two vertically split panes then we have larger
# gaps in our margin between split panes." Measured on his live windows, and the model below
# reproduces kitty's own column counts exactly (77 / 50 / 29 at the old value), so this is
# arithmetic rather than a theory:
#
#   gutter between two panes = 2*padding + 2*border + LEFTOVER
#
# where LEFTOVER is whatever of a pane's slot does not fill a whole 22px cell. Each column
# pays its own leftover, so it is not one gap that grows — it is N of them, and at this
# screen width two panes are LUCKY: 1728 - 28 - 5 leaves 1694, which is exactly 77 cells,
# leftover 0.7px. Three or more are not, and the gap jumps:
#
#   pad 7 ->  N=2 leftover  0.7px gutter 34px   |   pad 5 ->  N=2 leftover 8.7px gutter 34px
#             N=3 leftover 18.7px gutter 52px   |             N=3 leftover 4.7px gutter 30px
#             N=4 leftover 16.7px gutter 50px   |             N=4 leftover 2.7px gutter 28px
#             N=5 leftover 19.9px gutter 53px   |             N=5 leftover 5.9px gutter 31px
#             N=6 leftover 14.7px gutter 48px   |             N=6 leftover 0.7px gutter 26px
#
# So the visible jump he is pointing at is 34px at two panes against ~50px at three or more,
# and it is sub-cell waste, not a margin someone chose. Freeing 2 logical px per side lets ONE
# MORE COLUMN fit in every pane at N>=3 (50->51, 37->38, 29->30, 24->25), which absorbs the
# waste: the gutters land at 26-34px across every split count instead of 34-53px.
#
# IT APPLIES ON `kitty @ load-config` — NO RESTART NEEDED, and that was worth proving because
# this file's own history is full of settings the live windows ignored. Measured in an ISOLATED
# instance (the live one cannot be used: editing the conf there writes through a symlink into the
# deploy repo), one tab held at five panes, padding flipped 7 -> 5 -> 7 -> 5: columns went
# 17 -> 18 -> 17 -> 18, reversibly, four times. A first attempt to measure this on the live
# instance read "no effect at any padding, even 40" — that was the deploy converger restoring the
# symlink under the test, i.e. the file being edited was not the file being loaded. A negative
# from an instrument that quietly stopped pointing at the subject is not a negative.
#
# WHAT DOES NOT WORK, so nobody re-tries it: `placement_strategy top-left`. It moves a pane's
# leftover from both sides to one side, so the INTERNAL gutter is unchanged (2*pad + leftover
# either way) and only the screen's own edges shift. The leftover has to be absorbed, not
# relocated. And no single padding is optimal for every N — at 0 the N=6 leftover jumps back
# to 20.7px — so 5 is chosen as the value whose worst case across N=2..6 is smallest.

# With zero padding AND a 0.5pt hairline border, adjacent panes read as one continuous
# wall of text. A 1pt border plus a border colour that is actually distinguishable from
# the background is what makes the grid parseable at a glance; the active pane gets the
# blue so focus is findable without hunting for the cursor.
#
# Worth naming what the defaults were, because they belong on the harshness charge sheet:
# kitty's stock active_border_color is #00ff00 — PURE GREEN — and inactive_border_color is
# #cccccc, a near-white hairline. At 30 panes that is a grid drawn in highlighter.
window_border_width   1pt
active_border_color   #6194f3
inactive_border_color #3a4555

# ── draw_minimal_borders: OFF, and this is the whole fix for the corner case ──────────────────
# SYMPTOM (operator, 2026-09-13): "the border only shows colour when there is a pane in between,
# but it doesn't highlight the edges around the corners of the full window screen, so we can only
# infer which is the blue active pane if it's in the middle with both lines."
# CAUSE, read out of kitty's own source rather than inferred from the option name: minimal mode
# sets `border_mult = 0` (kitty/layout/splits.py:257), so NO border pixels are reserved around a
# window — only 2*bw at each split SEAM. The OS-window edge has no seam, so a corner pane is
# STRUCTURALLY INCAPABLE of showing more than two blue edges. Setting `no` flips border_mult to 1,
# pushing one border width into every window's decoration on all four sides, and add_borders()
# then emits a CLOSED RECTANGLE including at the OS-window edge. This restores kitty's own
# pre-0.20 default (changelog:4581-4585) — it is not a hack.
# WIDTH IS NOT A SUBSTITUTE: measured at `window_border_width 2pt`, the corner still has ZERO ink.
# Width cannot thicken a line that does not exist.
# COST, measured across 31 window sizes (20 widths x 11 heights): <=1 column and <=1 row FOR THE
# WHOLE TAB, at any pane count — 28 of 31 cost nothing, 3 cost exactly one cell. Seam cost is
# identical in both modes; the only new space is one outer perimeter, which does not scale with
# panes. `stack` layout and single-pane tabs are dimensionally IDENTICAL in both modes, so
# enabled_layouts `stack` is untouched.
# HONEST TRADE: seams go from one shared rule to two hairlines ~8px apart, so panes read a little
# more like cards than like a divided field. If that reads busy, the dial is the line below it —
# a dimmer inactive grid leaves LESS total ink than today while the blue rectangle is unchanged.
draw_minimal_borders no
# inactive_border_color #262c37   # <- the dial: dimmer grid, blue unchanged, less ink than today

# bell_border_color — REQUIRED COMPANION to the line above, not an optional extra.
# kitty paints a bell'd window's border in this colour, and with full borders now drawn that is a
# COMPLETE RECTANGLE rather than a seam. At kitty's stock #ff5a00 a single bell would throw a full
# orange frame around a pane — precisely the "gold borders / too abrasive" failure the operator
# rejected on 2026-09-13. Pinned to the inactive grey so the bell is silent in colour terms.
bell_border_color     #3a4555

# Pane boxes must LINE UP across a split — and the line above is what made this visible:
# with minimal borders there was no outer perimeter to compare, so the offset had nothing to
# reveal it. kitty's default `center` splits the leftover
# sub-cell pixels evenly above and below a window, and the leftover is NOT the same in every
# column. Measured on the operator's 2026-09-13 capture (3456x2234 device px, one OS window
# holding a 77x44 pane on the left and two 77x22 panes stacked on the right): both columns
# carry 44 rows, but the right column also pays for a second pane's border and vertical
# padding, so it has ~22 device px less slack. `center` halved each column's own slack
# independently, and the two outlines came out STAGGERED — the left pane's box sat 10 device
# px lower at the top and 12 px higher at the bottom than the right column's, i.e. every text
# row on the left was ~5 logical px off the right's baseline.
#
# `top` pins the top edge of every pane to the same y and pushes all the leftover to the
# bottom, where it is one ragged edge at the foot of the screen instead of an offset repeated
# on every row. The horizontal half stays centred — hence `top`, not `top-left` — because the
# columns already share a width and centring keeps the left and right window gutters equal.
placement_strategy    top

# ── Semantic pane headers: ON DEMAND — the toggle wins over the jitter fix ───
# cmd+shift+b (`toggle_window_title_bars`, bound in §3) shows a per-pane title. The bar is
# drawn inside the pane's own allocation and eats exactly ONE text row from every pane in the
# tab, so kitty SIGWINCHes every child on the show AND again on the hide: one peek costs TWO
# full scrollback reflows in every pane. Operator: "any way to eliminate content layout shift
# jitter when we command + shift + B to show the semantic header title for each split pane?"
#
# The reflow itself cannot be suppressed — a row-count change IS a PTY resize and kitty must
# signal the child. The only way to have no reflow is to have no row change, which is what
# `1` (= always show) buys: kitty's own docs on the toggle say it "has no effect on tabs where
# title bars are already naturally visible", so the chord becomes inert. Measured in an
# isolated instance: 18/18 rows across two presses, zero SIGWINCH.
#
# COST, stated plainly: one row, permanently — 47 -> 46 full height, 23 -> 22 per half. It does
# NOT disturb the geometry above; the bar consumes a row INSIDE the box, so every pane's
# rectangle and all five gaps are unchanged (verified after the reload).
# SET TO 0 = THE OPERATOR'S RULING, 2026-09-13, and it reverses the paragraph above on purpose.
# Always-on (`1`) DID kill the jitter, exactly as measured — and it also killed the chord, because
# kitty makes the toggle inert once the bars are naturally visible. Operator, within minutes of it
# landing: "command shift b is not working at all to hide the split pane titles." That is the whole
# verdict: the ABILITY TO HIDE is worth more than the reflow it costs. A titled pane is a thing he
# looks at occasionally, not a thing he wants nailed open, and a fix that removes the control is
# not a fix. The two reflows per peek stay, and they are the price of the chord working.
#
# So do NOT "fix the jitter" by setting this to 1 again. The mechanism note above is kept because
# it is true and it is the reason there is nothing else to try — the reflow is a PTY resize and
# cannot be suppressed — not because the remedy is available. It is not: it was tried and refused.
window_title_bar_min_windows 0

# ── The REAL bars, styled to match the overlay ───────────────────────────────
# ⌘⌥B (§3) shows kitty's own title bars so a pane can be DRAGGED to a new slot. Left as
# shipped they are a dim centred line in the terminal face — foreign beside the ⌘⇧B strip,
# and the two are the same feature wearing two faces. kitty exposes the four colours and the
# alignment, so they are set to the overlay's palette: the focused pane in kitty's own
# active_border_color hue at full chroma, the rest a blue that reads as a band rather than a
# tint, and left-aligned because that is where the overlay puts its label.
#
# What canNOT be matched is the FACE: these bars are drawn in the terminal's own cell grid, so
# they are Monaco at body size, where the overlay is SF Pro Semibold. That is the whole reason
# the overlay exists and is not a defect here — ⌘⌥B is a mode you enter to drag, not a mode
# you read in.
window_title_bar_align            left
window_title_bar_active_background   #2f62d8
window_title_bar_active_foreground   #ffffff
window_title_bar_inactive_background #3f5590
window_title_bar_inactive_foreground #f4f6fd

# ── 7e. Deliberately NOT set ─────────────────────────────────────────────────
# text_fg_override_threshold — forces foreground colours up to a minimum contrast against
#   the background. It would systematically UNDO 7a, re-brightening exactly the colours
#   this section softened. Leave at its 0 default. If it is ever wanted, use the `ratio`
#   form (`4.5 ratio`, WCAG AA via HSLuv, which preserves hue) and NEVER the `%` form —
#   kitty's own docs warn that `%` slams the foreground to pure white or pure black and
#   breaks any program drawing block graphics with matching fg/bg. Claude Code's TUI draws
#   exactly that (progress bars, box rules), so `%` here would be actively destructive.
# macos_thicken_font — the pre-0.28 way to thicken glyphs. kitty's 0.28 changelog now calls
#   it obsolete and warns it "will make the font too thick" when left configured alongside
#   the modern path, because the two stack: it strokes at glyph rasterisation, while
#   text_composition_strategy adjusts alpha in the composite shader. Do not add it.
# text_composition_strategy — left at the macOS default (`platform`, numerically `1.7 30`).
#   Verified from kitty's own cell_fragment.glsl: the mix weight is (1 - L_fg + L_bg)/2, so
#   for light text on a dark background it collapses to ~0 and the GAMMA term is a near
#   no-op. On this dark theme the CONTRAST term is the only live lever — `1.7 40` renders
#   slightly thicker/softer, `1.7 10` thinner/harsher. A real dial if the text still reads
#   thin, but it is a taste call, so it is not taken by default.
# inactive_text_alpha — dimming unfocused panes is the obvious 30-pane move and iTerm2
#   offers it, but the operator's standing rule is "never dim data" (memory: TUI numbers
#   first). Left at 1.0 on purpose; set to ~0.85 only if that rule is revisited.
# modify_font cell_height — NO LONGER in this list: it is SET in 7c at 94%, and for pane-box
#   alignment rather than for taste. Read that block before changing it — a different value
#   re-staggers the grid unless it divides half the OS window's cell area.

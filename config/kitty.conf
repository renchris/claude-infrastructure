# kitty.conf — SSOT for the operator's terminal, deployed by symlink to ~/.config/kitty/kitty.conf
#
# WHY THIS FILE EXISTS
#   iTerm2 froze the box at ~30 concurrent Claude Code panes
#   (docs/research/iterm2-freeze-30-sessions-2026-07-30.md). kitty is the challenger the bakeoff
#   selected on thread count flat-in-pane-count; the standing caveats live in
#   docs/research/terminal-for-30-panes-2026-07-31.md §6 and are NOT restated here — read them
#   before crediting kitty with anything this file does not itself measure.
#
# APPLYING THIS FILE
#   `kitty @ load-config` reloads most options live, but NOT allow_remote_control and NOT listen_on
#   ("Changing this option by reloading the config is not supported" — kitty 0.48.2 conf docs).
#   Those two need a full kitty restart, and a restart kills every pane and every Claude Code
#   session inside them. Restart at a clean moment, never mid-build.
#
# VERIFIED AGAINST kitty 0.48.2 (`kitty @ <cmd> --help`, 2026-07-31). Every option below was read
# out of this machine's own kitty docs, not from memory.

# ─────────────────────────────────────────────────────────────────────────────
# 1. LAYOUT — the `splits` layout is what makes vsplit/hsplit legal at all
# ─────────────────────────────────────────────────────────────────────────────
# --location=vsplit|hsplit are "only used by the splits layout" (launch --help). Without `splits`
# enabled the ⌘D bindings below silently place the pane somewhere layout-dependent instead of
# erroring — the same silent-misplacement shape as the anchor trap in §4 of the research doc.
# `stack` is second so ⌘⇧Enter can zoom one pane to fill the tab (iTerm2's ⌘⇧Enter).
enabled_layouts splits,stack

# ─────────────────────────────────────────────────────────────────────────────
# 2. REMOTE CONTROL — the load-bearing setting for handoff / self-recycle
# ─────────────────────────────────────────────────────────────────────────────
# socket-only: "Remote control requests received over a socket are accepted unconditionally.
# Requests received over the TTY are denied." That denial is the point — with `yes`, ANY program
# that can print to a pane (including a compromised dependency, or `cat` on a hostile file) can
# open windows, read other panes' contents, and run commands. Our automation only ever needs the
# socket, so the TTY path is pure attack surface. Do not "simplify" this to `yes`.
allow_remote_control socket-only

# kitty exports KITTY_LISTEN_ON into every child process, so a script running inside a pane finds
# the socket with no configuration ("if you run kitten @ within a kitty window, there is no need to
# specify the --to option as it will automatically read from the environment" — kitty --help).
#
# This is REQUIRED, not optional, for agent automation. A script run by Claude Code's Bash tool has
# NO controlling terminal, so kitty's fallback tty path fails with
#   Error: open /dev/tty: device not configured
# — measured on this box before this file existed. socket-only would deny that path anyway, but the
# absence of a socket is what actually breaks it. listen_on is the whole reason handoff works.
#
# {kitty_pid} keeps concurrent kitty instances from colliding on one socket path.
# HARDENING NOT YET APPLIED: /tmp is world-writable on macOS, so any local user could drive kitty
# through this socket. Single-user box ⇒ accepted for now; the fix is a 0700 dir, and it must be
# verified (kitty expands env vars but does not create directories) before being trusted.
listen_on unix:/tmp/kitty-{kitty_pid}

# ─────────────────────────────────────────────────────────────────────────────
# 3. SPLIT PANES — iTerm2 muscle memory, preserved key-for-key
# ─────────────────────────────────────────────────────────────────────────────
# iTerm2 ⌘D  = "Split Vertically"   = vertical divider  = new pane to the RIGHT → vsplit
# iTerm2 ⌘⇧D = "Split Horizontally" = horizontal divider = new pane BELOW      → hsplit
# If these land the opposite way on your screen, swap the two words — nothing else changes.
#
# ⚠ ORDER IS LOAD-BEARING FOR cmd+shift+d. kitty ships a macOS default binding of
# cmd+shift+d → close_window. Both survive into the keymap with identical (empty) conditions, and
# the LAST one wins — verified on this config: n=2, [0]='close_window', [1]='launch --location=
# hsplit'. Ours is last only because this is the user config, loaded after the defaults. Do not
# move these two lines into an included file that loads earlier, or ⌘⇧D silently becomes
# "close the pane" instead of "split the pane" — a destructive inversion with no error.
#
# --cwd=current inherits the working directory of the pane you split FROM, which is what iTerm2
# does and what makes ⌘D usable mid-task. It reads the cwd of the source window's foreground
# process and needs no shell integration (shell integration is enabled by default in 0.48 and
# only `--cwd=last_reported` actually depends on it).
map cmd+d       launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current

# Close the focused pane (iTerm2 ⌘W). Closing the last pane closes the tab, then the OS window.
map cmd+w close_window

# Zoom/unzoom the focused pane to fill the tab (iTerm2 ⌘⇧Enter). Uses the `stack` layout above.
map cmd+shift+enter toggle_layout stack

# ─────────────────────────────────────────────────────────────────────────────
# 3b. DRAGGING PANES WITH THE MOUSE — the half of iTerm2's split handling that
#     keyboard bindings cannot cover
# ─────────────────────────────────────────────────────────────────────────────
# iTerm2 gives a split two mouse gestures: drag the DIVIDER to resize, and drag a pane by its
# header to re-order it. kitty implements both, but neither is usable as shipped, and they fail
# in two DIFFERENT ways — so they need two different fixes, not one.
#
# RESIZE — on by default, but effectively un-hittable. `window_drag_tolerance` (default 2pt) is
# the tolerance around a border where a left-press starts a border drag, and `window_border_width`
# is a 0.5pt hairline. Raising the tolerance widens the GRAB REGION while drawing exactly zero
# extra pixels — the right lever at 30 panes, where border width is screen space we cannot spend.
# 6pt is comfortably grabbable yet well inside a cell, so a click meant for text near a divider is
# not swallowed. kitty's own docs note a border drag resizes the layout row/column/slot rather
# than one window, so several panes may move together — that IS iTerm2's divider behaviour.
# kitty's documented off switch is a large negative value (e.g. -200), not 0.
window_drag_tolerance 6

# RE-ORDER — absent by default, and not because of a missing keybinding: the grab handle is the
# window TITLE BAR, which kitty does not draw. kitty documents `toggle_window_title_bars` as
# "Temporarily show window title bars to allow drag-to-reorder", so the map below IS the feature.
# Without it there is no way to drag a pane to a new position; ⌘⇧arrows (§4) move a pane by
# keyboard, but that is a different gesture and cannot target an arbitrary slot.
# ⌘⇧B verified FREE against the loaded keymap (kitty 0.48.2) — not merely absent from a list:
# the probe was positive-controlled against ⌘D, which correctly read as taken.
map cmd+shift+b toggle_window_title_bars

# `drag_threshold` (default 5px — the distance before ANY drag begins) is deliberately left alone.
# It already matches iTerm2's feel, and lowering it turns ordinary text selection near a border
# into an accidental window drag. A value of 0 disables dragging entirely.

# ─────────────────────────────────────────────────────────────────────────────
# 4. PANE NAVIGATION
# ─────────────────────────────────────────────────────────────────────────────
# Directional focus — the split-aware equivalent of iTerm2's ⌘⌥arrows.
map cmd+opt+left  neighboring_window left
map cmd+opt+right neighboring_window right
map cmd+opt+up    neighboring_window up
map cmd+opt+down  neighboring_window down

# Cycle panes (iTerm2 ⌘] / ⌘[).
map cmd+]         next_window
map cmd+[         previous_window

# Move the focused pane within the split tree.
map cmd+shift+left  move_window left
map cmd+shift+right move_window right
map cmd+shift+up    move_window up
map cmd+shift+down  move_window down

# Resize mode — press, use arrows, Esc to leave.
map cmd+r start_resizing_window

# ─────────────────────────────────────────────────────────────────────────────
# 5. TABS
# ─────────────────────────────────────────────────────────────────────────────
map cmd+t new_tab_with_cwd
map cmd+shift+]  next_tab
map cmd+shift+[  previous_tab

# ─────────────────────────────────────────────────────────────────────────────
# 6. BEHAVIOUR AT 30+ PANES
# ─────────────────────────────────────────────────────────────────────────────
# Every pane holds its own scrollback in memory; this is the one memory knob that scales with pane
# count. 2000 lines/pane is kitty's default and is deliberately NOT raised here — overflow spills
# to a disk-backed pager instead of RAM.
scrollback_lines 2000

# Do not let a stray ⌘Q during a 30-pane run take the fleet with it.
confirm_os_window_close 2

# Keep the app alive when the last window closes, so a restart does not race the fleet coming back.
macos_quit_when_last_window_closed no

# A pane whose command exits should close, not linger as a dead rectangle in a 30-pane grid.
# (This is kitty's default; stated explicitly because the handoff self-close path depends on it.)
close_on_child_death no

# The BAR-ON half of the zero-shift title-bar toggle. Loaded by scripts/kitty-pane-title-toggle.sh.
# It includes the real config and overrides exactly two values, so it can never drift from it.
#
# 🚨 SUPERSEDED 2026-09-16 — THIS FILE IS NOW CALIBRATED AND IS BOUND TO ⌘⇧B. The block below is
# kept verbatim as the record of what was believed; its ARITHMETIC is still right and its
# CONCLUSION is wrong, and the difference is one assumption. It reasons that the reservoir has to
# be ADDED to the top padding while the bottom keeps its 10pt (`26 5 10 5`), which puts total
# vertical padding at 36pt and does cost the permanent row it warns about. The bottom 10pt is
# spendable: `22.5 5 0 5` puts the whole one-cell reservoir at the TOP and leaves the total at
# 22.5pt, so the OFF row count is the same 30 as today's `10 5`. Measured below.
# The old text follows, unedited:
# 🚨 THIS FILE WAS UNCALIBRATED AND BOUND TO NO CHORD. DO NOT WIRE IT AS-IS.
# The pairing IS the mechanism: top padding must drop by exactly one cell in the same relayout the
# bar claims one, so the row count is identical in both states. That requires the MAIN config to
# carry a one-cell reservoir in its top padding — and it no longer does. kitty.conf:864 reads
# `window_padding_width 10 5`, i.e. top 10pt, the same value this file sets. A zero-pt drop
# compensates nothing, so binding this today buys the full one-row shift while claiming zero.
# (The header used to say "32.5pt -> 10pt". True when written; kitty.conf's top padding was later
# reduced to 10 to stop paying the permanent row, and this half was never re-derived.)
#
# MEASURED 2026-09-15 on this machine, isolated kitty 0.48.2 instance, Monaco 18, this kitty.conf,
# one window, `kitty @ ls` lines before/after each `load-config`:
#   top_pad  0 -> 31 rows   10 -> 30   17 -> 29   25 -> 28      (one cell ~= 16pt here)
#   bare `toggle_window_title_bars` at top_pad 10:   30 -> 29 rows    <- the shift, one row
#   PAIR  OFF `10 5` + min_windows 0            :   30 rows, no bars
#   PAIR  OFF `26 5 10 5` + ON `10 5 10 5` + min_windows 1 : 29 / 29 / 29 / 29 across four swaps
# So the pairing WORKS — one `load-config` of a complete file is one relayout and holds the row
# count with REAL, draggable bars. This refutes kitty.conf §3's "measured DEAD ON THIS MACHINE";
# that reading is left in place there as the record of what was believed, annotated.
# Its price is exact and is the thing the operator rejected: 29 rows instead of 30, ALWAYS.
#
# TO ARM IT, both halves change together (and that is a decision, not a fix — see kitty.conf §3):
#   kitty.conf:864          window_padding_width 26 5 10 5     <- the reservoir, one row, permanent
#   here                    window_padding_width 10 5 10 5     <- hands it back to the bar
#
# ─────────────────────────────────────────────────────────────────────────────
# THE ARMED PAIR, MEASURED 2026-09-16 (isolated kitty 0.48.2, this kitty.conf, Monaco 18, 45px
# cell, 2-pane split, SIGWINCH-trapping children, absolute paths, no `-o` anywhere):
#
#   TODAY  `10 5`                         min_windows 0     rows 30,30
#   OFF    `22.5 5 0 5`                   min_windows 0     rows 30,30   <- SAME as today
#   ON     `0 5 0 5`  (this file)         min_windows 1     rows 30,30   6 swaps, SIGWINCH 0
#   control: forced row change                              rows 27,27   SIGWINCH 1 -> 2
#
# The bar IS drawn — proven by one variable, not by absence: at a FIXED `0 5 0 5`, min_windows 0
# gives 31,15,15 and min_windows 1 gives 30,14,14, twice. The row each pane loses is the bar.
# Pixels, screenshot, static pane: content row 1 at y 465..644 in BOTH states, and the ONLY
# changed rows OFF->ON are y 420..464 — one band, 45px, exactly one cell, where the reservoir was.
#
# 22.5 IS EXACT, NOT APPROXIMATE: the reservoir must equal the cell in PIXELS. 23pt rounds to 46px
# against a 45px cell and leaves a 1px creep (content row 1 at 466 vs 465). Floats are accepted.
include kitty.conf
# ⚠ THIS FILE COMPENSATES NOTHING AGAIN, 2026-09-16, and this time by DECISION rather than by drift.
# kitty.conf's top padding went back to 0 (operator: "Is there a way to remove the top margin?"),
# so the paired values are once more identical and the ⌘⌥B swap's real bars take one row while up.
# That is accepted: the reservoir was 45px of dead space on every pane all day, bought for a
# gesture used a few times a week. To restore exactness both halves must move together — kitty.conf
# back to `22.5 5 0 5` and this file left at `0 5 0 5` — and that re-buys the permanent cost.
window_padding_width 0 5 0 5
window_title_bar_min_windows 1

# The BAR-ON half of the zero-shift cmd+shift+b toggle. Loaded by scripts/kitty-pane-title-toggle.sh.
# It includes the real config and overrides exactly two values, so it can never drift from it.
# The pairing is the whole mechanism: top padding drops by exactly one cell (32.5pt -> 10pt) in the
# same relayout the bar claims one, so the row count is identical in both states.
# `-o` overrides were tried first and do NOT reproduce this reliably; a real conf file does.
include kitty.conf
window_padding_width 10 7 10 7
window_title_bar_min_windows 1

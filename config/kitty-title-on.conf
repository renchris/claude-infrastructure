# The BAR-ON half of the zero-shift title-bar toggle. Loaded by scripts/kitty-pane-title-toggle.sh.
# It includes the real config and overrides exactly two values, so it can never drift from it.
#
# 🚨 THIS FILE IS CURRENTLY UNCALIBRATED AND BOUND TO NO CHORD. DO NOT WIRE IT AS-IS.
# The pairing IS the mechanism: top padding must drop by exactly one cell in the same relayout the
# bar claims one, so the row count is identical in both states. That requires the MAIN config to
# carry a one-cell reservoir in its top padding — and it no longer does. kitty.conf:864 reads
# `window_padding_width 10 5`, i.e. top 10pt, the same value this file sets. A zero-pt drop
# compensates nothing, so binding this today buys the full one-row shift while claiming zero.
# (The header used to say "32.5pt -> 10pt". True when written; kitty.conf's top padding was later
# reduced to 10 to stop paying the permanent row, and this half was never re-derived.)
#
# MEASURED 2026-09-15 on this machine, isolated kitty 0.48.2 instance, Monaco 18, this kitty.conf,
# one window, `kitty @ ls` lines before/after each `load-config`:
#   top_pad  0 -> 31 rows   10 -> 30   17 -> 29   25 -> 28      (one cell ~= 16pt here)
#   bare `toggle_window_title_bars` at top_pad 10:   30 -> 29 rows    <- the shift, one row
#   PAIR  OFF `10 5` + min_windows 0            :   30 rows, no bars
#   PAIR  OFF `26 5 10 5` + ON `10 5 10 5` + min_windows 1 : 29 / 29 / 29 / 29 across four swaps
# So the pairing WORKS — one `load-config` of a complete file is one relayout and holds the row
# count with REAL, draggable bars. This refutes kitty.conf §3's "measured DEAD ON THIS MACHINE";
# that reading is left in place there as the record of what was believed, annotated.
# Its price is exact and is the thing the operator rejected: 29 rows instead of 30, ALWAYS.
#
# TO ARM IT, both halves change together (and that is a decision, not a fix — see kitty.conf §3):
#   kitty.conf:864          window_padding_width 26 5 10 5     <- the reservoir, one row, permanent
#   here                    window_padding_width 10 5 10 5     <- hands it back to the bar
include kitty.conf
window_padding_width 10 5 10 5
window_title_bar_min_windows 1

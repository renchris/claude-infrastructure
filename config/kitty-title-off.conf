# THE OFF HALF of the ⌘⇧B title toggle — the bar DOWN.
#
# WHY THIS FILE HAD TO EXIST. kitty-pane-title-toggle.sh used to load the MAIN kitty.conf as its
# off half (`CONF_OFF="$HOME/.config/kitty/kitty.conf"`). That worked only while the resting config
# carried `window_title_bar_min_windows 0` — i.e. only while the pane title was NOT draggable by
# default. The operator's ruling of 2026-09-16 made real, draggable bars the resting state, which
# silently made the toggle's OFF unreachable: the chord flipped its state file honestly, loaded a
# config that still said 1, and the bar never moved. Exactly the failure the drop-in caused one
# level up, and it reports success the whole time.
#
# THE GENERAL SHAPE, worth carrying: a toggle whose OFF half is "the default config" is not a
# toggle, it is a bet that the default never changes. Give each half a file that states its own
# value, so changing the resting value cannot make one end of the toggle unreachable.
#
# `include kitty.conf` first, so this half cannot drift from the main config; then the one
# directive that differs. It must come AFTER the include — kitty takes the LAST definition, and
# kitty.conf ends with `globinclude drag-arm.d/*.conf`.
include kitty.conf
window_title_bar_min_windows 0

# ─────────────────────────────────────────────────────────────────────────────
# § FABLE 5.1 (lateral bump 2026-09-03) — STAGED, and BLOCKED ON THE BINARY, not on auto mode.
# Anthropic shipped Claude Fable 5.1 (`claude-fable-5-1`) and Claude Mythos 5.1
# (`claude-mythos-5-1`, Project Glasswing only — we are not participants, so it is recorded
# for completeness and never routed to). Fable 5.1 succeeds Fable 5 as the frontier tier.
#
# WHY STAGED — a DIFFERENT gate than Opus 5's. Opus 5 was blocked on auto-mode allowlist
# membership, which an agent cannot self-verify. Fable 5.1 is blocked one level lower: the
# model ID is not in the binary at all. Measured 2026-09-03 against the Bun-compiled
# claude.exe of every installed version:
#
#     strings -a <claude.exe> | grep -c -- <model-id>
#     version        fable-5-1   fable-5   opus-5   opus-4-8   sonnet-5
#     2.1.220              0        32       47         59         36
#     2.1.219              0        32       45         59         36
#     2.1.114 (stable)     0         0        0          -          -
#
# The four non-zero columns are POSITIVE CONTROLS: the instrument works, so the zero is a
# real absence and not a blind read. (A plain `grep` on claude.exe returns 0 for EVERY model
# including ones we demonstrably run — it is blind on a Bun-compiled binary. `strings` first,
# always, and never report a null without the controls beside it.) Note `claude-fable-5` is a
# PREFIX of `claude-fable-5-1`, so the 32 would also have counted any 5.1 hits; it did not.
# ⇒ Until a CC build registers the ID, `--model claude-fable-5-1` cannot resolve, and
#   `claude-bump-models --apply` MUST NOT RUN: it would rewrite frontier roles + the auto-mode
#   allowlist to an ID the harness cannot dispatch, breaking every /frontier-run spawn at once.
#   API/SDK callers are unaffected — the model is live there today.
#
# ECONOMICS — the headline is the CACHE READ, not the sticker. Base price is IDENTICAL to
# Fable 5 ($10/$50) and so is the tokenizer, so token counts and cost math carry over. What
# changed: cache hits/refreshes are priced at 0.025× base input ($0.25/MTok) against 0.1×
# ($1/MTok) on Fable 5 and every other model. Cache writes are unchanged. For our workload —
# long agentic sessions that re-read a large cached prefix on every turn — the dominant input
# line item drops 4×, so 5.1 is materially CHEAPER per session than 5 at the same sticker.
# This partially re-opens the delta that § Opus 5 adoption recorded as collapsed: the routing
# note there ("Opus 5 ≈ Fable at HALF cost") was computed on base rates only. Re-do that
# comparison on effective cost-per-task at activation, not on the $10-vs-$5 headline.
# Anthropic's own prompting guide points the same way: 5.1 @ medium ≈ Fable 5 at lower cost,
# and @ low it is "often competitive with Claude Opus and Claude Sonnet models on cost per
# task while scoring higher" — i.e. the frontier tier may now win slots it used to lose.
#
# THREE BREAKING CHANGES vs Fable 5 (docs: /models/fable-5-1/whats-new-fable-5-1):
#  1. FORCED TOOL USE → 400. `tool_choice` of `{"type":"any"}` or `{"type":"tool",...}` is
#     rejected (also on count_tokens); `auto` and `none` are unchanged. Thinking is always on
#     and a forced call would skip it. ⚠️ CHECK AT ACTIVATION: our Dynamic Workflow `schema:`
#     option forces a StructuredOutput tool call. If the binary implements that as forced
#     tool_choice rather than strict tool use, every schema-bearing workflow agent pinned to
#     Fable 5.1 400s. Probe one schema agent before routing any workflow slot to 5.1.
#  2. THINKING BLOCKS ARE MODEL-BOUND, one-directionally: 5.1 reads earlier models' blocks,
#     no earlier model reads 5.1's. A conversation moving ONTO 5.1 keeps its reasoning; one
#     moving OFF it (a refusal fallback to Opus 5 / Opus 4.8) loses it for those turns. Drops
#     are silent unless you send `thinking-binding-controls-2026-08-01` and read
#     `input_transformations`. Dropped blocks are not billed.
#  3. EDITING EARLIER TURNS INVALIDATES THINKING BLOCKS → 400 "bound to a different
#     conversation". LOW RISK FOR US, twice over: the check is enforced only for accounts
#     created on or after 2026-08-31 (all four of ours predate that; for older accounts the
#     API records the mismatch but acts only if the request opts in), and Claude Code,
#     claude.ai, Managed Agents and the Agent SDK all keep the prefix intact by construction.
#     It binds our hand-built `messages` arrays, if we ever grow one — not our CC sessions.
#
# FIVE ADDITIVE (each behind its own beta header):
#  - Per-message effort, `mid-conversation-output-config-2026-07-01` — change effort mid
#    conversation WITHOUT invalidating the prompt cache. Also supported on Opus 5. This is the
#    first lever that would let a lead raise effort for one hard step and drop back, instead of
#    the launcher-wide --effort flag we are stuck with today (GH #25591).
#  - Turn-scoped system messages, `mid-conversation-system-clear-at-2026-08-21` —
#    `clear_at: "next_user_message"`; the message keeps system authority for one turn, then
#    stops rendering and costs no input tokens, while staying in `messages` byte-for-byte.
#    This is the correct shape for our per-turn reminder injections.
#  - `thinking.display: "updates"`, `thinking-display-updates-2026-08-18` — progress updates
#    between tool calls delivered as readable text while raw reasoning stays hidden.
#  - The cache-read price above.
#  - Content provenance: statistical text watermark on all output, C2PA Content Credentials on
#    files retrieved via the Files API. No tokens, no request changes.
#
# SEVEN BEHAVIOR DELTAS (no code change; all prompt-fixable — see the prompting guide):
#  parallel tool calling is more variable (may issue one call/turn where 5 batched several, in
#  coding + computer-use loops where the next reads are implied rather than named) · fewer
#  user-facing progress updates during long tool runs, more pronounced at higher effort ·
#  answers from memory more often at `low` effort (calls search/retrieval less) · denser prose ·
#  LESS formatting in chat, so anti-formatting rules written for older models now over-suppress ·
#  unmarked quotations when summarising sources · whole-file rewrites for small edits.
#
# UNCHANGED from Fable 5: adaptive thinking always on (`disabled` and `budget_tokens` both
# 400) · `display` defaults to `"omitted"` · prefill 400s · non-default temperature/top_p/top_k
# 400 · 512-token minimum cacheable prefix · 1M context (default AND max) · 128K max output ·
# same tokenizer · 30-day data retention, no ZDR · refusal categories and fallback-credit
# behaviour. Permitted server-side fallback targets for 5.1: claude-opus-4-8 and claude-opus-5.
#
# ACTIVATION (do these in order; the first is the gate everything else waits on):
#   1. Upgrade the binary. ANSWERED 2026-09-03 — bisected, so this is no longer homework.
#      Probe: `strings -a <claude.exe> | grep -c -- <id>`, every row carrying its positive
#      control so a zero is provably a zero (a plain `grep` on the Bun-compiled claude.exe
#      reads 0 for EVERY model, including ones we demonstrably run):
#
#          version            fable-5-1   mythos-5-1   control opus-5
#          2.1.220 (ours)          0           0             47
#          2.1.229                 0           0             48
#          2.1.236 (`stable`)      0           0             48
#          2.1.242                 0           0             48
#          2.1.248                 0           0             18
#          2.1.250                 0           0             18
#          2.1.252                 0           0             19
#          2.1.259 (`latest`)     11           6             18
#
#      So the minimum registering build lies in 2.1.253–2.1.259, and 2.1.259 is VERIFIED to
#      carry both ids. 2.1.257/258 were not probed (the run was interrupted) — narrow further
#      only if you care which; otherwise go to `latest`. Note the npm `stable` dist-tag
#      (2.1.236) does NOT have it, so "move to stable" is not a route to 5.1.
#      Install PARALLEL (`npm i --prefix ~/.claude-<ver> @anthropic-ai/claude-code@<ver>`),
#      never in place, and keep 2.1.220 for a one-line rollback. Carry
#      `CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH=1` forward — 2.1.219 defaulted nested spawn depth
#      to 3, which re-opens the still-open #68619 runaway (4M tok/5min) on this spawn-heavy
#      fleet; a jump of ~39 versions is well past where that default was last audited, so
#      re-read the spawn/subagent defaults before firing a wave on the new binary.
#      ⚠️ This is a 2.1.220 → 2.1.259 jump. Registration is the ONLY axis measured above.
#      Everything else our harness depends on — hooks, Stop-hook semantics, auto mode, the
#      effort ladder, Agent Teams, permissions, MCP — is unmeasured across those 39 versions.
#      Run the `cc-upgrade-gate` skill against the candidate BEFORE adopting it; that gate
#      exists for exactly this and is cheaper than discovering a broken way-of-working live.
#   2. Confirm ENTITLEMENT, which is separate from registration and may be server-date-gated
#      (Fable 5 was): `--model claude-fable-5-1 --print "ok"` must return a real completion and
#      `claude-accounts` must show a live budget. A registered-but-unentitled ID fails at spawn.
#   3. Confirm PLAN INCLUSION before treating 5.1 as free. frontier_access.source is
#      `plan-usage` on the strength of Anthropic's 2026-07-17 Fable 5 announcement (all Max +
#      Team Premium plans, 50% of limits). That statement was about Fable 5 and does NOT
#      transitively cover 5.1 — read the current plan docs before assuming it carries over.
#   3b. 🚨 REWRITE THE HARDCODED `claude-fable-5` SITES **IN THE SAME DIFF AS THE FLIP.** This
#      is measured, not a worry (census 2026-09-03). `claude-fable-5-1` is not equal to
#      `claude-fable-5`, and NOTHING here does a prefix match. There are TWO classes, with two
#      different failure modes — fix both; a fix to only one is worse than neither, because it
#      makes the adoption look done.
#
#      (i) DETECTORS — test `$MODEL` against the literal. On a flip each silently evaluates
#          FALSE: no error, no log, just a Fable session that nothing accounts as one.
#        scripts/handoff-fire.sh:7928   [ "$MODEL" = "claude-fable-5" ] && FABLE_EFFECTIVE=1
#        scripts/handoff-fire.sh:7713   [ "$MODEL" = "claude-fable-5" ] && kind=fable
#        scripts/handoff-fire.sh:7838   [ "$MODEL" = "claude-fable-5" ] && probe_model=...
#        scripts/handoff-fire.sh:7485   [ "${MODEL:-}" = "claude-fable-5" ] && return 0
#        bin/cc-route:325 · bin/cc-wave-plan:891   ← selftest assertions; these would go
#          VACUOUSLY GREEN, still asserting the OLD id, so the suite cannot catch (i) for you.
#      7928 is the load-bearing one: `FABLE_EFFECTIVE` is how the fire path knows it is spending
#      the frontier meter at all.
#
#      (ii) EMITTERS — WRITE the literal (they are keyed on an alias or on CC_ACCT_IS_FABLE, not
#          on the model string, so they do not "go false"). After a flip they keep launching
#          Fable **5** while the SSOT says the frontier is 5.1 — the config reads adopted and
#          the fleet is not. Arguably the worse half, and invisible to any check that only greps
#          for equality tests.
#        scripts/handoff-fire.sh:7436          fable) MODEL="claude-fable-5" ;;   ← alias mapping
#        bin/reso-resume-one:349-352           model=claude-fable-5 ;;    ← 4 per-account arms
#        scripts/limit-recover/lr-fire-resume.sh:225
#              [ "$CC_ACCT_IS_FABLE" = 1 ] && { model="claude-fable-5"; effort="high"; }
#        scripts/limit-recover/lr-handoff.sh:338
#              FIRE_ARGV+=(--model claude-fable-5 --effort "${EFFORT:-high}")
#
#      (iii) 🚨 A THIRD AXIS, AND IT IS NOT A MODEL ID AT ALL — THE QUOTA METER KEYS ON THE
#          SCOPE'S **DISPLAY NAME**. Verified 2026-09-03. `accounts.json:33` sets
#          `"scoped_display_name": "Fable"`; `bin/claude-accounts:1267` does
#          `fp, fr = pick(u, "weekly_scoped", cfg["frontier"]["scoped_display_name"])`, and
#          `pick()` returns `(None, None)` on any mismatch. A miss lands in `:2835`
#          `return None, "no-fable-limit"`, which `:2921` documents as DELIBERATELY meaning
#          "no entitlement, not 100% headroom". Consequence: if Anthropic labels the 5.1
#          weekly scope anything other than the literal `Fable`, every account is excluded
#          from the fable lane, `claude-accounts --rank fable` comes back empty, and
#          `handoff-fire.sh:7713` halts the fire rather than firing blind. A grep for
#          `claude-fable-5` will NEVER find this — it is a different string in a different
#          file. Check it the first time a 5.1 call lands: run one `--print`, then
#          `claude-accounts --fresh --json` and confirm a Fable-scoped percentage MOVED.
#          UNVERIFIABLE until then: nothing on this box can predict Anthropic's scope label.
#
#      (iv) THE EMITTERS ARE A SAFETY BUG, NOT ONLY A CORRECTNESS ONE. `hooks/frontier-spawn-
#          gate.sh` gates ONLY the SSOT model or the family alias — `case "$req_model" in
#          fable|"$fmodel") ;; *) exit 0 ;; esac`. After a flip to 5.1, `$fmodel` is 5.1, so
#          every surviving hardcoded `claude-fable-5` spawn falls through `*) exit 0` and
#          **BYPASSES THE PER-SESSION FRONTIER SPAWN CAP ENTIRELY**
#          (`frontier_discovery_budget.max_fable_spawns_per_session`, currently 6). A partial
#          keying sweep therefore does not merely under-count the frontier tier — it removes
#          the only bound on how much of it a single session can spend.
#
#      THE ASYMMETRY IS THE TRAP. The zshrc cost warning (~/.zshrc:489) uses a GLOB —
#      `[[ " ${CLAUDE_NEXT_MODEL:-} $* " == *claude-fable-5* ]]` — which DOES match
#      `claude-fable-5-1`. So a flip made without 3b yields the worst possible split: the human
#      still gets warned about Fable's cost, while every mechanical arm that counts it reads
#      "not Fable". Warned about the money, not counting the money. Prefer matching the glob's
#      shape (a prefix/case test covering both IDs) over swapping one literal for another, so
#      the NEXT frontier bump does not re-create this.
#   4. Only then: frontier_latest → claude-fable-5-1, frontier_prior → claude-fable-5, clear
#      frontier_staged, `claude-bump-models --apply`, add claude-fable-5-1 to
#      auto_mode_allowlist.non_firstParty_max ALONGSIDE claude-fable-5, flip the launcher
#      default, re-run claude-lint-models.
#   5. RE-SWEEP effort (see effort_defaults § fable51). Anthropic is explicit that effort level
#      names do NOT correspond to the same amount of thinking across models — the Fable 5 sweep
#      does not transfer, exactly as the Opus 4.8 → Opus 5 sweep did not.
# Until then: Fable 5 remains frontier_latest and every Fable role keeps working unchanged.

# Reasoning effort per role profile. Within a tier (e.g. universal Opus 4.8 for
# teammates) effort is the tuning axis; ACROSS tiers the ladder above is the axis
# (Fable 5 → Opus 4.8 → Sonnet 5 → Haiku 4.5).
# MECHANISM (2026-06-11 redesign — replaces the old `export CLAUDE_CODE_EFFORT_LEVEL=max`):
#   - zshrc launchers (claude / claude-default / claude-next / firewall wrappers)
#     inject `--effort ${CLAUDE_DEFAULT_EFFORT:-max}` before "$@" — the flag SEEDS
#     the session, /effort stays adjustable, and an explicit --effort passed by the
#     caller wins (Commander last-wins). Tier wrappers (claude-x/-h, claude-fable-h/-q)
#     append their own --effort.
#   - Settings floor: ~/.claude/settings.json "effortLevel": "xhigh" (symlinked into
#     every CLAUDE_CONFIG_DIR) covers non-wrapped surfaces: IDE extension, teammate
#     pane spawns, bare binary calls. The settings schema enum caps at xhigh — `max`
#     is expressible ONLY via --effort or the env var, so xhigh is the persistable floor.
#   - CLAUDE_CODE_EFFORT_LEVEL is BANNED from exports/settings-env: the binary re-reads
#     it every turn AHEAD of session state, so it locks /effort for the whole session
#     and cannot be unset from inside. session-start.sh has a tripwire that warns any
#     session starting with it set.
# Lead judges mundane-ness during Phase 0 and opts into `xhigh` via `claude-x` (or
# `claude --effort xhigh`).
# PER-SPAWN EFFORT (corrected 2026-06-11, binary-verified on 2.1.170 — two classes):
#   - Teammate PANES: per-member effort IS settable — panes launch fresh processes
#     that re-resolve <worktree>/.claude/settings.local.json (lead's effort is NOT
#     forwarded; no --effort in pane argv). Mechanism:
#     `~/.claude/scripts/set-teammate-effort.sh <worktree> low|medium|high|xhigh`
#     run during worktree setup, before spawn. Capped at xhigh (settings schema);
#     user-settings floor (xhigh) applies when no worktree override is written.
#   - In-process SUBAGENTS (Agent tool, no team_name): inherit the lead's LIVE
#     effort with NO override surface (AgentInput has no effort field; frontmatter
#     `effort` not parsed — GH #25591/#25669/#31536/#65598 open). Fable panels
#     fired from an Opus@max lead therefore run @max: an accepted, BOUNDED premium
#     (CursorBench $18-vs-$15 band per task, capped by max_fable_spawns_per_session)
#     — do NOT ask the user to /effort-dip around waves; that's manual steering.
#     ⚠️ SCARCE-WINDOW CARVE-OUT (2026-06-30, "Prompting Fable 5" guide): the line above
#     is COST-framed and holds for an OPEN-ENDED window. During a PLAN-USAGE-CAPPED window
#     (2026-07-01→07-07, ≤50% weekly then unaffordable) it is WRONG-SIGNED: Fable@max
#     over-deliberates + burns the window, and Fable@high already beats Opus@xhigh. For
#     that window PREFER running the derivation/judge spawn WAVE from a `claude-fable-h`
#     launcher OR a deliberate one-time `/effort xhigh` on the lead (restore after),
#     keeping the orchestrating lead on Opus otherwise — the ONE case where the /effort-dip
#     is correct, not manual steering. See docs/research/FABLE5_PROMPTING_PLAYBOOK_2026-06-30.md.
# Rule doc: memory/feedback-agent-team-models.md (2026-04-17 revision).
effort_defaults:
  default: high                             # implementer, reviewer, doctor, lead, researcher, CODING, SYNTHESIS,
                                            # mechanical-with-search.
                                            # 2026-08-01 — max → high, executing the re-sweep directive written into
                                            # the opus5 block below ("max is wrong-signed for Opus 5"). `high` IS
                                            # Opus 5's own API default and Anthropic's stated starting point; `max`
                                            # is "prone to overthinking" and feeds the self-correction /
                                            # re-verification loops the system card documents. This is the guide's
                                            # STARTING POINT, not a measured optimum — a real per-class sweep is
                                            # still owed (docs/research/opus5-adaptation-2026-08-01.md §D3), and the
                                            # opus5_* keys below are the per-class starting points to sweep FROM.
                                            # [HISTORY — do not delete: why it was max] CERTIFIED 2026-06-30
                                            # (freewin probe T1, wf_771c1e9f-644, blind default-to-equivalent judge
                                            # panels over real reso briefs) **on Opus 4.8**: xhigh did NOT tie max on
                                            # grounding-heavy classes — synthesis (max surfaced a VERIFIED SUPERSET
                                            # of findings xhigh missed) and mechanical-search (xhigh HALLUCINATED a
                                            # fabricated diff against a non-existent file + misclassified an internal
                                            # alias) both showed real xhigh quality regressions; coding marginal.
                                            # That certification is MODEL-SCOPED and does not transfer to Opus 5 —
                                            # Anthropic: "run a fresh effort sweep on your evals rather than
                                            # reusing" a setting tuned for an earlier model. Restore `max` only with
                                            # an Opus-5 probe that reproduces the above.
  verify_judge: xhigh                       # CERTIFIED FREE WIN (T1, wf_771c1e9f-644): LLM-judge / adversarial-
                                            # verify tasks with BOUNDED grounding (verify ONE specific claim) tie max
                                            # on quality (2/2 briefs TIE, one cheaper-lean) at lower cost — the
                                            # bounded-grounding task doesn't need max's extra exploration turns.
                                            # Workflow-tunable slots ONLY (in-process subagents inherit lead effort,
                                            # GH #25591). Coincides with fable_capability_sensitive: xhigh → the
                                            # workflow_judge / eval_judge / research_adversarial slots use xhigh
                                            # whether on Fable (in-window) or Opus-fallback (window shut).
  mundane: xhigh                            # opt-in: rename sweep, reformat, KNOWN-TARGET mechanical edit. CAVEAT
                                            # (T1 mech-d1): mechanical work that must SEARCH for the site (find the
                                            # barrel / the untyped fn) stays at default max — xhigh hallucinated a
                                            # fabricated edit there. xhigh is safe only when the targets are given.
  frontier: max                             # novel algorithm, security audit (= default tier)
  # settings_floor: the persistable "effortLevel" floor for every CLAUDE_CONFIG_DIR's settings.json
  # (non-wrapped surfaces: IDE ext, teammate panes, bare-binary calls). These are NOT symlinked — five
  # independent real files that drift apart; scripts/effort-parity-assert.sh asserts the live dirs
  # against this key (exit 1 on drift).
  # 2026-08-01 — xhigh → high. The old floor was derived FROM `default: max`: max is not expressible
  # in the settings schema (its enum caps at xhigh), so xhigh was "the highest persistable
  # approximation of max". With the default now `high`, that derivation is void — and the stale floor
  # had INVERTED the guard: effort-parity-assert was emitting PS-WARN against 8 live sessions for
  # running `--effort high`, i.e. convicting them of obeying Opus 5's own documented default. A guard
  # that reds on the correct value trains you to ignore it. Floor tracks `default`; move both together.
  settings_floor: high
  # Fable-5 SURFACES follow a DIFFERENT ladder (Anthropic "Prompting Claude Fable 5"
  # guide, 2026-06-11 audit). The binary's live-session effort enum is
  # low < medium < high < xhigh < max — `max` is the absolute ceiling, ABOVE xhigh.
  # The article: `high` is the DEFAULT, `xhigh` for the most capability-sensitive work,
  # `medium`/`low` for routine — and Fable @ a LOWER level ≈ Opus @ max quality, so
  # max-everywhere over-deliberates and burns the 5-hour window (the very cost that
  # reverted lead_default off Fable on 2026-06-09). The lever is the launcher's
  # --effort flag (per-spawn effort unsupported, GH #25591).
  # ⚠️ STALE LEVER, corrected 2026-09-03: this block used to name `claude-fable-h` (high) /
  # `claude-fable-q` (medium) / `claude-fable` (max) as the way to pick a Fable effort tier.
  # Launcher consolidation v2 DELETED every launcher name except `claude` and `claude-prev`,
  # so all three are gone and the instruction was unrunnable. Today the levers are: `/effort`
  # live in-session, `claude-x` (xhigh) / `claude-h` (high) wrappers, or `--effort <level>`
  # passed through `claude` (last-wins over the launcher's injected default). The surviving
  # Fable-specific artifact is the cost warning inside `claude()` in ~/.zshrc, which fires on
  # a `*claude-fable-5*` glob — that glob DOES also match `claude-fable-5-1`, so the warning
  # keeps working through the 5.1 flip without an edit.
  # Applies to /frontier-run panels and the call-time research_adversarial / workflow_judge /
  # eval_judge / teammate_frontier slots.
  fable_default: high                       # Fable surfaces — NOT max (article 2026-06-11)
  fable_capability_sensitive: xhigh         # derivation panels, security/arch judgment
  fable_routine: medium                     # routine Fable use (was implicitly max)
  # Fable 5.1 SURFACES (on activation) — DO NOT inherit the fable_* values above. Anthropic is
  # explicit in "Prompting Claude Fable 5.1": "Re-run the sweep even if you already ran one on
  # Claude Fable 5: effort level names don't correspond to the same amount of thinking across
  # models." Same lesson the Opus 4.8 → Opus 5 sweep taught. `high` is 5.1's API default and the
  # stated starting point; gains over Fable 5 are largest at the HIGHER settings, while `medium`
  # roughly matches Fable 5 at lower cost and `low` is often competitive with Opus/Sonnet on
  # cost-per-task while scoring higher. Two effort-specific traps: at `low` it calls search and
  # retrieval tools LESS (add a verification nudge for anything needing fresh information), and
  # at `xhigh`/`max` it thinks longer before a long deliverable (leave max_tokens headroom or it
  # truncates). These are STARTING POINTS to sweep from, not measured optima — no probe has run.
  fable51_default: high                     # 5.1's own API default and Anthropic's start point
  fable51_capability_sensitive: xhigh       # derivation panels, security/arch judgment
  fable51_routine: medium                   # ≈ Fable 5 quality at lower cost
  fable51_cheap: low                        # NEW TIER — competitive with Opus/Sonnet on cost/task;
                                            # pair with a search nudge (low suppresses retrieval)
  # Opus 5 SURFACES (on adoption) follow their OWN ladder — do NOT inherit default:max.
  # Anthropic migration guide + Opus 5 system card: `high` is Opus 5's default; `max` is
  # "prone to overthinking" and shows self-correction / re-verification loops at high effort
  # (FrontierCode peaks at MEDIUM; FrontierBench best at xhigh, max within-noise). low/medium
  # are STRONGER on Opus 5 than any prior Opus. Lowering effort does NOT reliably shorten the
  # VISIBLE response — prompt for concision explicitly. ⇒ when opus_latest becomes the active
  # model, RE-SWEEP effort_defaults.default (max is wrong-signed for Opus 5) per docs/research/
  # OPUS5_ADOPTION_AND_PROMPTING_2026-07-24.md.
  # ✅ THAT RE-SWEEP IS DONE — 2026-08-01, cb7f8e3fa: `default` is `high` (see the key above,
  # which carries the full rationale + the model-scoped Opus-4.8 certification kept as history).
  # This directive is retained as the RATIONALE for the current value, NOT as an open action.
  # Starting points:
  opus5_default: high                       # coding / agentic / lead — Opus 5's own API default
  opus5_capability_sensitive: xhigh         # hardest long-horizon agentic (set max_tokens ≥64k)
  opus5_coding_agentic: medium              # FrontierCode peaks here; test medium vs high per task
  opus5_routine: low                        # scoped / latency-sensitive (low is strong on Opus 5)


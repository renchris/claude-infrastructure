# Pricing per MTok, input/output USD. Verified against platform.claude.com/docs/en/about-claude/pricing
# on 2026-09-03 (supersedes the 2026-06-09 claude-api-skill snapshot, which had gone stale on Sonnet 5).
# Used by research-subagents.md cost math — Fable slots cost 2× Opus slots.
# ⚠️ These pairs are [input, output] BASE rates and deliberately stay 2-element — consumers index them
# positionally. Cache-read rates are the third real dimension and are recorded in comments, not in the
# array: the standard multiplier is 0.1× base input EXCEPT on Fable 5.1 / Mythos 5.1, which are 0.025×.
# For a long agentic session the cache read is the dominant input cost, so a base-rate-only comparison
# systematically misprices the frontier tier. Cache WRITES are 1.25× (5m) / 2× (1h) on every model.
pricing_per_mtok:
  claude-fable-5-1: [10, 50]                 # NEW 2026-09-03 — same base as Fable 5, but cache reads are
                                             # $0.25/MTok (0.025×) vs Fable 5's $1 (0.1×): 4× cheaper on the
                                             # line that dominates our sessions. Batch $5/$25. § Fable 5.1.
  claude-mythos-5-1: [10, 50]                # Project Glasswing only — we have no access. Listed so a cost
                                             # model that meets the ID does not treat it as unknown.
  claude-fable-5: [10, 50]                   # cache reads $1/MTok (0.1×). STILL the routed frontier model.
  claude-opus-5: [5, 25]                     # NEW 2026-07-24 — same price as Opus 4.8, ≈Fable quality on
                                             # most benchmarks ⇒ Fable's cost-justified delta has collapsed
                                             # for most work (routing note in § Opus 5 adoption above).
                                             # ⚠️ That verdict is BASE-RATE-ONLY; re-check it against Fable
                                             # 5.1's 0.025× cache reads before reusing it. Cache read $0.50.
  claude-opus-4-8: [5, 25]                   # still served (Opus 5 fallback); kept for prior-pinned cost math
  claude-sonnet-5: [2, 10]                   # CORRECTED 2026-09-03 (was [3,15]). The $2/$10 launch price is
                                             # now the STANDARD price — Anthropic cancelled the increase:
                                             # "The previously scheduled increase to $3/$15 ... on September
                                             # 1, 2026 will not occur." The old row was a dated prediction
                                             # that this file kept asserting two days after it was refuted,
                                             # and research-subagents cost math was reading it. Cache $0.20.
  claude-sonnet-4-6: [3, 15]                # still served — kept for prior-pinned cost math
  claude-haiku-4-5: [1, 5]


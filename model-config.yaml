#          next2 weekly Fable 1% (`··········`) → three claude-fable-5-1 calls → 2%
#          (`▏·········`). Fable 5.1 usage lands in the SAME scope named `Fable`, so
#          `scoped_display_name` still matches, `pick()` resolves, no account is excluded, and
#          the fable lane keeps ranking. **The axis stays documented because the COUPLING is
#          permanent** — the meter will keep keying on a display name we do not control, so the
#          next frontier model has to re-run this same A/B. What was verified is this release,
#          not the mechanism.
#          UNVERIFIABLE until then: nothing on this box can predict Anthropic's scope label.

  teammate_research: claude-opus-5        # same model; effort differentiates (see effort_defaults)
  research_worker: claude-opus-5          # IN-PROCESS / teammate synthesis-worker default = GA ceiling (Opus 5).
                                            # In-process /research inherits LEAD effort (can't pin max, GH #25591) and
                                            # Sonnet 5 is NOT teammate-allowlisted → those two surfaces stay Opus 4.8.
                                            # HISTORY: T2 (probe wf_771c1e9f-644, 2026-06-30, on Sonnet 4.6) + re-probe
                                            # (wf_fe2b1218-297, 2026-07-01, on Sonnet 5): Sonnet @ low/med/high/xhigh
                                            # LOSES the synthesis-worker floor — satisfices on stale rule-doc citations
                                            # / wrong-file cites vs Opus's source-verified grounding. So Sonnet is NOT
                                            # a safe in-process worker (effort there is uncontrollable → could land in
                                            # the rejected band). The ONE exception is EQUAL-MAX effort in a Workflow
                                            # (see workflow_synthesis_worker). (research_retrieval stays Haiku.)
  workflow_synthesis_worker: claude-sonnet-5  # CERTIFIED FREE WIN (2026-07-01, adopt-confirmed) — Workflow-run bulk
                                            # synthesis / breadth-first worker slots ONLY. Spawn:
                                            #   agent(brief, {model: 'claude-sonnet-5', effort: 'max'})
                                            # Ties Opus-4.8@max QUALITY across easy AND hard synthesis briefs (0 reliable
                                            # Opus wins; blind 4-judge default-to-refute panels — probes wf_fe2b1218-297
                                            # / wf_53759023 / wf_18a92ab8) at ~2-3× LIGHTER quota-draw ($3/$15 vs $5/$25
                                            # + ~5× lighter/token). TWO HARD REQUIREMENTS (probe-verified):
                                            #  (1) effort MUST be `max` — low/med/high/xhigh all drop BELOW the grounding
                                            #      floor on hard briefs (wrong-file citations / fabrication); max is
                                            #      load-bearing. Opus @ med/low also fail hard briefs → no cheap shortcut.
                                            #  (2) briefs MUST carry a saturation bound (~15-25 tool calls, stop when
                                            #      answerable) — unbounded max-effort Sonnet 5 overflowed context once.
                                            # NOT for in-process /research (effort uncontrollable) or teammates (not
                                            # allowlisted) — those use research_worker (Opus 4.8). Intro $2/$10 → std
                                            # $3/$15 on 2026-08-31 (win holds at std). SSOT: ~/.claude/model-routing-freewin-probe.md.
  research_retrieval: claude-haiku-4-5      # Explore tier (25% slot, codebase/file:line lookups)
  research_adversarial: claude-fable-5-1    # adversarial/red-team/judge/depth-coordination slots
                                            # (10-15%); call-time Agent `model: "fable"` override,
                                            # eval track + active window only; else fallback.
                                            # The `fable` ALIAS is safe here: measured on 2.1.260,
                                            # `--model fable` resolves to claude-fable-5-1.
  workflow_judge: claude-fable-5-1          # Dynamic Workflow judge/synthesis agents — same
                                            # conditionality as research_adversarial.
                                            # ✅ THE `schema:` HAZARD IS CLEARED, and by the CLIENT
                                            # not by us (§ Fable 5.1 breaking change 1 asked for this
                                            # probe BEFORE routing any workflow slot to 5.1).
                                            # claude.exe 2.1.260 carries:
                                            #   if ($M?.type==="tool" && thinkingActive)
                                            #     "tool_choice {type:'tool'} demoted to auto:
                                            #      extended thinking is active"; $M={type:"auto"}
                                            # Fable 5.1 has thinking ALWAYS ON, so a forced
                                            # StructuredOutput choice is rewritten to `auto` before
                                            # the request is built and never reaches the 400.
                                            # ⚠️ The residue is RELIABILITY, not failure: `auto`
                                            # means the schema call is no longer compelled, so a
                                            # schema-bearing agent leans on the Workflow layer's
                                            # validate-and-retry instead of a guaranteed first call.
  classifier: claude-sonnet-4-6             # hardcoded by Anthropic (not user-configurable)
  eval_judge: claude-fable-5-1              # highest-quality judge during window; else fallback


#      still gets warned about Fable's cost, while every mechanical arm that counts it reads
#      "not Fable". Warned about the money, not counting the money. Prefer matching the glob's
#      shape (a prefix/case test covering both IDs) over swapping one literal for another, so
#      the NEXT frontier bump does not re-create this. ← THIS IS WHAT WAS DONE: every detector
#      became `case … in claude-fable-5*)`, not a swapped literal.
#
#      THREE CORRECTIONS TO THE CENSUS ABOVE, found by executing it. Grep, never trust its line
#      numbers:
#        (a) EVERY line number above has DRIFTED ~46 lines from sibling landings (7485/7713/
#            7838/7928 as written; 7531/7759/7884/7974 when the rewrite ran). They are kept
#            as-written because they are the record of what was surveyed, not a map to use.
#        (b) `bin/cc-route:325` IS MISFILED AS A DETECTOR — it is not one, and it was

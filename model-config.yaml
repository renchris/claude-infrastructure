# ─────────────────────────────────────────────────────────────────────────────
# § FABLE 5.1 (lateral bump 2026-09-03) — ADOPTED. Binary gate cleared, keying flip landed.
# Anthropic shipped Claude Fable 5.1 (`claude-fable-5-1`) and Claude Mythos 5.1
# (`claude-mythos-5-1`, Project Glasswing only — we are not participants, so it is recorded
# for completeness and never routed to). Fable 5.1 succeeds Fable 5 as the frontier tier.
#
# ✅ STATUS AS OF 2026-09-03 EVENING — READ THIS BEFORE THE HISTORY BELOW, WHICH IT SUPERSEDES:
#   · The launcher was repointed by the OPERATOR: ~/.zshrc:496 `_bin` 2.1.220 → **2.1.260**.
#     A NEW shell now runs a binary that registers claude-fable-5-1 (11 hits, control 18).
#     ~/.claude-220 is retained for a one-line rollback. Already-running sessions keep 2.1.220
#     until relaunched — the flip reaches new shells only.
#   · cc-upgrade-gate on 2.1.260 × claude-opus-5: **VERDICT GREEN, 13 pass / 0 fail / 1 skip.**
#     Passing includes the three expensive live ones — teammate spawn, Dynamic Workflow agent,
#     and subagent all ran with modelUsage carrying the model and no demotion — plus hooks
#     firing, auto-mode not over-blocking, resume routing, and MCP resolving 7 servers. The
#     single SKIP is #14 authstore-writeloss, unchanged from the 2.1.220 baseline and declared
#     by the gate itself "known-open upstream, not an upgrade blocker".
#     ⇒ The operator mandate the gate encodes — "we ALWAYS upgrade immediately to a new model IF
#     all our ways of working continue to work" — is SATISFIED for the binary.
#   · cc-upgrade-gate on 2.1.260 × **claude-fable-5-1**: VERDICT GREEN, 13 pass / 0 fail / 1 skip
#     — the same shape as the opus-5 run above, i.e. the gate was run against the model being
#     adopted and not only against the incumbent. (#13 mcp-reachability resolved 5 servers on
#     this run vs 7 on the opus one — a live-server count, not a gate failure.)
#   · Entitlement and plan inclusion: both CONFIRMED by measurement (steps 2 and 3 below).
#   · ✅ THE KEYING FLIP IS DONE — this file now reads claude-fable-5-1, and it landed in ONE
#     diff with the 3b rewrite (step 3b and step 4 below both closed). Every role, panel and
#     lane routes to 5.1; the per-session frontier spawn cap covers BOTH ids by prefix.
#   · MEASURED, and it is what makes the alias lane safe: on 2.1.260 the bare family alias
#     `fable` resolves to **claude-fable-5-1** — `--model fable --print --output-format json`
#     returned `modelUsage` keyed `claude-fable-5-1`. This mattered because the 2.1.257
#     CHANGELOG says "Changed `fable` and `best` in Claude apps gateway sessions to keep
#     resolving to Fable 5 for now, since gateways not yet configured for Fable 5.1 reject it".
#     That caveat does NOT bite this fleet on 2.1.260 (the binary's own resolver reads
#     `Lp() = el("fable") ?? fable51`), and our fire path is immune either way because
#     handoff-fire resolves the alias to the FULL id from this file before exec. Re-measure the
#     alias at the NEXT frontier bump rather than trusting this line — it is a fact about one
#     binary, not about the alias mechanism.
#
# WHY IT WAS STAGED — a DIFFERENT gate than Opus 5's, and worth keeping because the SHAPE
# recurs. Opus 5 was blocked on auto-mode allowlist membership, which an agent cannot
# self-verify. Fable 5.1 was blocked one level lower: the model ID was not in the binary at
# all. Measured 2026-09-03 against the Bun-compiled claude.exe of every installed version:
#
#     strings -a <claude.exe> | grep -c -- <model-id>
#     version        fable-5-1   fable-5   opus-5   opus-4-8   sonnet-5
#     2.1.220              0        32       47         59         36
#     2.1.219              0        32       45         59         36
#     2.1.114 (stable)     0         0        0          -          -
#
# The four non-zero columns are POSITIVE CONTROLS: the instrument works, so the zero is a
# real absence and not a blind read. (A plain `grep` on claude.exe returns 0 for EVERY model
# including ones we demonstrably run — it is blind on a Bun-compiled binary. `strings` first,
# always, and never report a null without the controls beside it.) Note `claude-fable-5` is a
# PREFIX of `claude-fable-5-1`, so the 32 would also have counted any 5.1 hits; it did not.
# ⇒ WHILE THAT WAS TRUE, `--model claude-fable-5-1` could not resolve and
#   `claude-bump-models --apply` MUST NOT HAVE RUN: it would have rewritten frontier roles + the
#   auto-mode allowlist to an ID the harness could not dispatch, breaking every /frontier-run
#   spawn at once. (API/SDK callers were unaffected — the model was live there from day one.)
#   RESOLVED by the launcher move to 2.1.260. The exact boundary is now known and is not a
#   range: npm never published 2.1.253–2.1.256, so **2.1.257 is the minimum registering build**
#   and there is no gap left to bisect.
#   🚨 THE PREFIX HAZARD SURVIVES THIS, AND IT IS NEW TO THIS BUMP. `claude-fable-5` is a strict
#   PREFIX of `claude-fable-5-1` — the first time in this file's history that an old id prefixes
#   its successor. `~/bin/claude-bump-models:133` replaces with an UNANCHORED
#   `sed -i.bump-bak "s|$OLD|$NEW|g"`, so now that frontier_prior is set, the armed pair is
#   `claude-fable-5|claude-fable-5-1` and an --apply over any file already containing 5.1 would
#   corrupt it to `claude-fable-5-1-1`. Exposure is currently ZERO and that is a property of the
#   sweep's TARGET SET, not of the tool: model-classification.json's effective targets are 60
#   reso team-brief files, none of which contain any Fable id (its README.md/agents/*.md globs
#   are dead — matched as "$root/$glob" against roots that already ARE those dirs). ⚠️ So the
#   guard is: do NOT add `scripts/`, `bin/` or `hooks/` to model-classification.json's `update`
#   list without anchoring that sed first. `scripts/claude-lint-models.sh:82` is prefix-SAFE
#   (`grep -qE "${literal}([^-0-9]|$)"`) — two tools, one SSOT, opposite safety.
#
# ECONOMICS — the headline is the CACHE READ, not the sticker. Base price is IDENTICAL to
# Fable 5 ($10/$50) and so is the tokenizer, so token counts and cost math carry over. What
# changed: cache hits/refreshes are priced at 0.025× base input ($0.25/MTok) against 0.1×
# ($1/MTok) on Fable 5 and every other model. Cache writes are unchanged. For our workload —
# long agentic sessions that re-read a large cached prefix on every turn — the dominant input
# line item drops 4×, so 5.1 is materially CHEAPER per session than 5 at the same sticker.
# This partially re-opens the delta that § Opus 5 adoption recorded as collapsed: the routing
# note there ("Opus 5 ≈ Fable at HALF cost") was computed on base rates only. Re-do that
# comparison on effective cost-per-task at activation, not on the $10-vs-$5 headline.
# Anthropic's own prompting guide points the same way: 5.1 @ medium ≈ Fable 5 at lower cost,
# and @ low it is "often competitive with Claude Opus and Claude Sonnet models on cost per
# task while scoring higher" — i.e. the frontier tier may now win slots it used to lose.
#
# THREE BREAKING CHANGES vs Fable 5 (docs: /models/fable-5-1/whats-new-fable-5-1):
#  1. FORCED TOOL USE → 400. `tool_choice` of `{"type":"any"}` or `{"type":"tool",...}` is
#     rejected (also on count_tokens); `auto` and `none` are unchanged. Thinking is always on
#     and a forced call would skip it. ✅ CHECK DONE 2026-09-03 — THE CLIENT ALREADY HANDLES IT,
#     so this never reaches our workflows. Read out of claude.exe 2.1.260:
#         if ($M?.type === "tool" && thinkingActive)
#           log("tool_choice {type:'tool', name:'…'} demoted to auto: extended thinking is active")
#           $M = { type: "auto" }
#     Thinking is always-on for 5.1, so the demotion always fires and the request is built with
#     `auto`. Corroborating: the binary contains ZERO `"type":"any"` tool_choice constructions.
#     ⚠️ What remains is a RELIABILITY delta, not a failure: `auto` does not COMPEL the
#     StructuredOutput call, so a schema-bearing agent now depends on the Workflow layer's
#     validate-and-retry rather than on a guaranteed first-call. Watch for retry-rate growth on
#     schema slots; do not expect 400s.
#  2. THINKING BLOCKS ARE MODEL-BOUND, one-directionally: 5.1 reads earlier models' blocks,
#     no earlier model reads 5.1's. A conversation moving ONTO 5.1 keeps its reasoning; one
#     moving OFF it (a refusal fallback to Opus 5 / Opus 4.8) loses it for those turns. Drops
#     are silent unless you send `thinking-binding-controls-2026-08-01` and read
#     `input_transformations`. Dropped blocks are not billed.
#  3. EDITING EARLIER TURNS INVALIDATES THINKING BLOCKS → 400 "bound to a different
#     conversation". LOW RISK FOR US, twice over: the check is enforced only for accounts
#     created on or after 2026-08-31 (all four of ours predate that; for older accounts the
#     API records the mismatch but acts only if the request opts in), and Claude Code,
#     claude.ai, Managed Agents and the Agent SDK all keep the prefix intact by construction.
#     It binds our hand-built `messages` arrays, if we ever grow one — not our CC sessions.
#
# FIVE ADDITIVE (each behind its own beta header):
# ✅ NONE OF THESE IS OURS TO ADOPT — MEASURED 2026-09-03. This note exists to stop a future session
# filing adoption work for them. Every named beta header is already compiled into claude.exe 2.1.260
# and sent by the client:
#     mid-conversation-output-config-2026-07-01     1 hit
#     mid-conversation-system-clear-at-2026-08-21   1 hit
#     thinking-display-updates-2026-08-18           3 hits
#     thinking-binding-controls-2026-08-01          1 hit
# (`strings -a claude.exe | /usr/bin/grep -c` — the same instrument, with the same positive controls,
# the binary gate used; a plain grep is blind on a Bun-compiled binary.) The client also drives one
# of them itself: it sets `display:"updates"` when thinking is active. So read the list below as
# CAPABILITY WE ALREADY HAVE, not as a backlog. What is NOT reachable from here is issuing a beta WE
# pick — the CLI owns the header set, so a beta Anthropic ships that Claude Code does not send is
# unavailable to this fleet whatever the API docs say. Re-measure at the next binary bump rather than
# trusting this block: it is a fact about ONE build, exactly like the `fable` alias resolution above.
#  - Per-message effort, `mid-conversation-output-config-2026-07-01` — change effort mid
#    conversation WITHOUT invalidating the prompt cache. Also supported on Opus 5. This is the
#    first lever that would let a lead raise effort for one hard step and drop back, instead of
#    the launcher-wide --effort flag we are stuck with today (GH #25591).
#  - Turn-scoped system messages, `mid-conversation-system-clear-at-2026-08-21` —
#    `clear_at: "next_user_message"`; the message keeps system authority for one turn, then
#    stops rendering and costs no input tokens, while staying in `messages` byte-for-byte.
#    This is the correct shape for our per-turn reminder injections.
#  - `thinking.display: "updates"`, `thinking-display-updates-2026-08-18` — progress updates
#    between tool calls delivered as readable text while raw reasoning stays hidden.
#  - The cache-read price above.
#  - Content provenance: statistical text watermark on all output, C2PA Content Credentials on
#    files retrieved via the Files API. No tokens, no request changes.
#
# SEVEN BEHAVIOR DELTAS (no code change; all prompt-fixable — see the prompting guide):
#  parallel tool calling is more variable (may issue one call/turn where 5 batched several, in
#  coding + computer-use loops where the next reads are implied rather than named) · fewer
#  user-facing progress updates during long tool runs, more pronounced at higher effort ·
#  answers from memory more often at `low` effort (calls search/retrieval less) · denser prose ·
#  LESS formatting in chat, so anti-formatting rules written for older models now over-suppress ·
#  unmarked quotations when summarising sources · whole-file rewrites for small edits.
#
# UNCHANGED from Fable 5: adaptive thinking always on (`disabled` and `budget_tokens` both
# 400) · `display` defaults to `"omitted"` · prefill 400s · non-default temperature/top_p/top_k
# 400 · 512-token minimum cacheable prefix · 1M context (default AND max) · 128K max output ·
# same tokenizer · 30-day data retention, no ZDR · refusal categories and fallback-credit

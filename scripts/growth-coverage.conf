# ══ 2026-08-10 SWEEP — surfaces the live layer grew AFTER the 2026-07-25 audit ═════════════════
# The nightly runs this lint with no GROWTH_ROOT override, i.e. against the real ~/.claude, and it
# reported 29 unclassified surfaces — not the 4 named in
# docs/research/nightly-regression-triage-2026-07-30.md. That item's count was a snapshot, and the
# live layer kept growing for the ten days it sat unworked; classifying only the named 4 would have
# left the gate red at 25. Every row below was traced to its writer AND to a deletion site (or the
# proven absence of one) before it was given a verb.
#
# Two notes on the verbs as applied here:
#   · `ignore` is used below in one sense the header above does not spell out: BOUNDED BY
#     CONSTRUCTION — a fixed-cardinality, overwrite-not-append surface (one file per account, or per
#     caller id, and the ids are string literals in repo code). It cannot grow with time, so `gap`
#     would be a false alarm while `reaper=` and `unbounded-by-design=` would both be false claims.
#   · These rows are APPENDED rather than merged into the sections above, so the line numbers those
#     sections already carry stay valid — scripts/handoff-fire.sh:2665 cites this file's line 94.

# ── COVERED — a real age reaper owns these ────────────────────────────────────────────────────
# postland looks alarming by `du` (174 MB) and is not: 173 MB of it is exactly two per-run git
# worktree cells, torn down on every exit path, with the -mmin sweep as the crash backstop. It is a
# bounded ~2-cell working set, NOT an 11 MB/day accumulation. Its children `stamps/` (130 json) and
# `reverts/` have no horizon, but the lint does not enumerate below autonomy/<child>, so they carry
# no row here; `flakes.jsonl` and `runner.log` beneath it are rotate-autonomy-logs.sh targets.
autonomy/postland      reaper=postland-verify.sh
autonomy/spawn-budget  reaper=agent-teams-enforce.sh

# ── UNBOUNDED BY DESIGN — reaping these is the bug ────────────────────────────────────────────
oauth-tokens  unbounded-by-design=live OAuth credentials, 1 .token/account (lib/config-mirror.zsh:191); reaping logs the account out
salvage       unbounded-by-design=stranded-WIP salvage patch; the bundle IS the recovery evidence, so reaping it is the data loss
autonomy/migrations  unbounded-by-design=applied/staged C10 migration receipts; applied/ IS the re-run gate (deploy-migrations.sh:357)
autonomy/websetup    unbounded-by-design=per-account link latch; expiring one silently re-drives an account that is already linked
autonomy/branch-reaper unbounded-by-design=restore manifests written BEFORE the delete; branch-reaper.sh promises --restore valid indefinitely
autonomy/permission-archive unbounded-by-design=the only record of real permission prompts; cc-permission-audit defaults to ALL history
autonomy/recycle-events.jsonl unbounded-by-design=recycle-outcome store; cc-ctx-audit's sid→window denominator, so a reaped row deletes the metric
autonomy/worktree-disposals.jsonl unbounded-by-design=disposal ledger; the only trace a worktree went by DECISION rather than by accident

# ── IGNORE — code mounts, and surfaces bounded by construction ────────────────────────────────
vendor        ignore=repo/vendor code (symlink to the checkout's vendor/codex-security)
shims         ignore=repo code (kitty-setup PATH shims, symlinked to ~/.claude/bin)
auth-profiles ignore=live Chromium profiles (cc-authbrowser, <=1/account); deleting one logs the account out
autonomy/capacity-admit ignore=bounded by construction — one int per caller id (3 literals in repo code), overwritten never appended


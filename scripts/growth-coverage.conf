# growth-coverage.conf — the SSOT of live-layer growth surfaces.
# Read by scripts/growth-coverage-lint.sh.  Format:  <path>  <verb>=<value>
#   path   relative to $GROWTH_ROOT (default ~/.claude)
#   verb   reaper=<grep-token> | unbounded-by-design=<why> | gap=<ref> | ignore=<why>
#
# Adding a state dir or append-only log to the live layer WITHOUT adding a row here fails the
# lint. That is the point: audit 03 §3 found the reaper lint has a floor and no ceiling, so
# every one of these dirs was added with a lifecycle `rm`, no horizon, and nothing watching.
# `autonomy/comms-alarms` reached 395 files with ZERO rm sites of any kind.
#
# Sizes/counts below are the 2026-07-25 audit measurements, kept as the "why this row exists"
# record — they are not re-verified by the lint.

# ══ REPO CODE — symlinked in from the checkout, not state ══════════════════════════════════════
agents        ignore=repo code (per-file symlinks into the checkout)
bin           ignore=repo code
commands      ignore=repo code
hooks         ignore=repo code
lib           ignore=repo code
scripts       ignore=repo code
skills        ignore=repo code
skills-pending  ignore=repo code (skill drafts awaiting /skill-promote)
plugins       ignore=repo/vendor code
workflows     ignore=repo code (saved Workflow scripts)
memory        ignore=curated knowledge, hand-maintained (MEMORY.md index + topic files)

# ══ CC-HARNESS OWNED — bounded by the harness's own cleanupPeriodDays ══════════════════════════
# Verified 2026-07-25: 0 files older than 30 d in each (audit 03 §1c). We do not own these
# horizons; CC prunes them at session start. The one real finding there — an ABANDONED config
# dir never re-runs cleanup — is a property of ~/.claude-tertiary, not of this root.
projects        ignore=CC cleanupPeriodDays (0 files >30d; 765 MB / 1,629 jsonl)
file-history    ignore=CC cleanupPeriodDays (0 dirs >30d; 63 MB)
shell-snapshots ignore=CC cleanupPeriodDays (4.8 MB / 32 files)
paste-cache     ignore=CC cleanupPeriodDays (540 KB / 114 files, oldest exactly 30 d)
todos           ignore=CC harness state
tasks           ignore=CC harness state
statsig         ignore=CC harness telemetry cache
ide             ignore=CC harness IDE integration state
debug           ignore=CC harness debug state
run             ignore=CC harness runtime state
rules           ignore=CC harness rules state
session-env     ignore=CC harness per-session env
plans           ignore=CC harness plan-mode scratch (versioned into plan-history by the hook)
chrome          ignore=browser-automation profile state

# ══ CONTAINERS — classified through their children, which the lint enumerates separately ══════
autonomy      ignore=container dir; every autonomy/<child> carries its own row below

# ══ COVERED — a real age reaper owns these ═════════════════════════════════════════════════════
autonomy/sweep-seen       reaper=autonomy-sweep.sh
autonomy/sweep-push-seen  reaper=autonomy-sweep.sh
autonomy/pages            reaper=autonomy-sweep.sh
autonomy/comms-alarms     reaper=autonomy-sweep.sh
autonomy/push-records     reaper=autonomy-sweep.sh
autonomy/inbox-guard      reaper=autonomy-sweep.sh
completion-push           reaper=autonomy-sweep.sh
cc-teardown               reaper=autonomy-sweep.sh
cc-registry               reaper=CC_REG_RETAIN_H
telemetry                 reaper=CC_SUP_GC_S
backups                   reaper=prune-backups.sh
plan-versions             reaper=prune-plan-history.sh
logs                      reaper=rotate-autonomy-logs.sh
autonomy/idl.jsonl        reaper=rotate-autonomy-logs.sh

# ══ UNBOUNDED BY DESIGN — durable ledgers; reaping these is the bug, not the fix ═══════════════
autonomy/decisions   unbounded-by-design=class-C decision ledger; a packet is the operator's record of a call and outlives every event around it
autonomy/backlog.jsonl unbounded-by-design=append-only work ledger read by cc-backlog/cc-blockers; 313 KB at ~44 KB/day is cheap against losing the audit trail
history.jsonl        unbounded-by-design=CC prompt history, 9 months deep at 31 KB/day; survives cleanupPeriodDays by design and is the only cross-session record of what was asked
archives             unbounded-by-design=frozen 2.1.112/114 binary trees (994 MB, static since 2026-05-28); an insurance policy is worthless if it is GC'd
plan-history         unbounded-by-design=git repo whose HISTORY is the product; plans/ is its working tree (one current file per plan). Object compaction is handled by prune-plan-history.sh; truncating history would delete the artifact to save its index
autonomy/pending-activation unbounded-by-design=staged C10 activations awaiting the operator; expiring one silently un-stages work nobody agreed to drop


# These are audit 03 fix 10 and the residue of fix 4. Declaring them here is the honest answer:
# they are visible on every nightly run instead of hiding as a false `unbounded-by-design`.
mailbox            gap=audit-03-fix-10 — 126 entries / 1.38 MB, 12 lifecycle-rm sites and no horizon; ties into the known 78%-unacked mail-v3 item
watchdog           gap=audit-03-fix-10 — session-end.sh reaps cp-*.count at +2d; the .pid/.id pairs (72 files back to April) have no reaper
state              gap=audit-03-fix-10 — nudge-*.count (+1d) and *.fired (+7d) are covered; the live*/brief*/arm* triples (120 files) are not
teams              gap=audit-03-fix-10 — 23 live + 40 archived dirs, oldest 2026-04-06, zero rm sites
cache              gap=unmeasured — claude-latest changelog cache; overwrite-not-append today, no horizon if that changes
land.log           gap=unrotated (59 KB); rotation targets are owned by rotate-autonomy-logs.sh
autonomy/supervisor.log     gap=audit-03-§2 — highest-rate rotation miss at 104 KB/day
autonomy/supervisor.out.log gap=audit-03-§2 — launchd sink, never truncated
autonomy/supervisor.err.log gap=audit-03-§2 — launchd sink, never truncated
autonomy/abstain-alarm.log  gap=audit-03-§2 — unrotated
autonomy/caffeinate-floor.log gap=audit-03-§2 — unrotated
autonomy/power-policy.log   gap=audit-03-§2 — unrotated
autonomy/regression.log     gap=audit-03-§2 — unrotated
autonomy/boundary-latch  gap=unmeasured — boundary-handoff latch state, lifecycle-only
autonomy/desk-invariant  gap=unmeasured — desk-invariant state, lifecycle-only
autonomy/digests         gap=unmeasured — cc-digest output, no horizon
autonomy/dod             gap=unmeasured — dod-persist records, no horizon
cc-announce-alarms  gap=drained by autonomy-sweep (.seen markers age out) but the source records have no horizon
cc-fired            gap=fired-peer markers; cc-reaper clears them on confirmed teardown (lifecycle), no age backstop
cc-roles            gap=role pointers, lifecycle-only; tiny but unbounded
deathwatch          gap=lead-deathwatch records, no horizon
sessions            gap=session state records, no horizon
staging             gap=staging area, no horizon
wait-contracts      gap=cc-wait contracts (62 files), lifecycle-only
handoff-briefs      gap=fired handoff briefs, no horizon
research-artifacts  gap=research outputs, no horizon
research            gap=research outputs, no horizon
repo-ref-manifests  gap=repo reference manifests, no horizon
route               gap=cc-route state, no horizon
drafts              gap=draft artifacts, no horizon
patches             gap=saved patches, no horizon
session-index.lock.d gap=the 107-day abandoned sweep lock; the staleness-aware trylock now reclaims it automatically on the first tick after deploy
# A MUTEX, not a growth surface: bin/cc-reaper:93 mkdir-locks it per sweep and holds exactly two
# files (pid, lstart — the pid+lstart pinning that makes a recycled pid unable to wedge the lock).
# It is created and released every sweep, so it BLINKS in and out of existence on a live host; the
# bats assertion is therefore driven from the checked-in reference, never from live disk.
autonomy/cc-reaper.sweep.lock.d reaper=cc-reaper


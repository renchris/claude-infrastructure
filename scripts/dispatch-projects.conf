# dispatch-projects.conf — the SSOT of DISPATCHABLE projects (read by bin/cc-dispatch).
#
# Format:  <project>  <verb>=<value>       (one row per project; `#` comments; blank lines ok)
#   repo=<path>    DISPATCHABLE. The path is the git repo the worker's worktree is provisioned
#                  FROM. `~` expands. Must be a git repo at pass time or the item reopens with a
#                  recorded failure — cc-dispatch never fires into an unresolvable repo.
#   skip=<why>     DELIBERATELY NOT dispatched, with the reason on the record. A `skip` row is a
#                  DECLARATION, not silence: its open items are still journalled every pass as
#                  {verdict:"skip", reason:"project-not-dispatched"} so they stay visible.
#
# WHY THIS FILE EXISTS (backlog f7abcbdee98c). cc-dispatch filtered on ONE project — the single
# `CC_DISPATCH_PROJECT` the launchd plist pins. Every open item in any OTHER project was not
# deferred, not skipped, not decided: it was invisible. 19 items (doc_classifier 7,
# reso-management-app 7, "/" 5) sat structurally undrained, the oldest for 8 days — and the 5
# OLDEST open items in the entire ledger were among them.
#
# WHY A CONF FILE AND NOT MORE PLISTS. Coverage must not be an operator action per project. A
# second launchd instance per project needs a new plist + `launchctl bootstrap` for each one (C10,
# operator-only; 6 activations are already rotting >24 h), and would multiply the fleet ceiling and
# collide on the shared singleton lock — see the DISPATCH SET header block in bin/cc-dispatch for
# the full four-point rationale. A row here is an agent action that needs no activation.
#
# ADDING A PROJECT: add its row. There is no other step. The project's items enter the SAME single
# queue under the SAME fleet ceiling, ordered by the existing S7 fairness key (thrash ASC, then
# oldest ts) — so a long-undrained item sorts to the HEAD rather than behind the incumbent's queue.
#
# NOT LISTED = NOT DRAINED, LOUDLY. An unlisted project's open items are journalled as
# `project-not-dispatched` every pass and printed to stderr. This is deliberately NOT a blocking
# lint: the ledger is shared, so a foreign project appearing in it would turn every author's gate
# red for work no author caused (memory: whole-tree-lint-is-a-fleet-wide-hard-stop).
#
# THIS FILE DOES NOT WIDEN DISCOVERY, only dispatch. cc-discover keeps its own scope knob
# (CC_DISCOVER_PLAN_SCOPE, default `project`) and it stays narrow ON PURPOSE: find-plan is
# cross-project, so an unscoped discovery walk floods the ledger — one measured `--once` added 261
# foreign `advance` items and drowned the dispatcher's pull (bin/cc-discover:176-181). Draining a
# project's EXISTING items and manufacturing new ones from its plans are separate decisions; this
# file is only the former.

# ══ DISPATCHABLE ═══════════════════════════════════════════════════════════════════════════════
# The incumbent. Always in the set regardless of this file (CC_DISPATCH_PROJECT is unioned in, so
# a bad edit here can never silently un-cover the project the plist pins).
claude-infrastructure  repo=~/Development/claude-infrastructure

# The two real foreign projects with open work. Both verified 2026-07-29: repo present,
# origin/main is the default branch. reso-management-app has a project-local /ship + CLAUDE.md;
# doc_classifier has NEITHER, so its briefs get the no-ship-rail variant (cc-dispatch composes the
# rails line from the resolved repo, never a hardcoded "/ship").
doc_classifier         repo=~/Development/doc_classifier
reso-management-app    repo=~/Development/reso-management-app

# ══ DECLARED, NOT DISPATCHED ═══════════════════════════════════════════════════════════════════
# Present in the ledger's history but with no open items as of 2026-07-29. Listed as `skip` rather
# than omitted so that the day one of them DOES get an open item, the record says why it was left
# out instead of reading as an oversight. Promote by changing `skip=` to `repo=`.
reso-qa-runner   skip=no open items (134 historical, all terminal); repo present if promoted
reso-playwright  skip=no open items; repo sits on a feature branch, not main
agent-secrets    skip=no open items; secrets repo — autonomous worker not authorized

# ══ NEVER DISPATCHABLE — corrupt project labels, not projects ══════════════════════════════════
# These are PRODUCER defects, not repos: `cc-backlog add` defaulted `project` to `$(pwd)`, so a
# caller under launchd (cwd=/) minted "/" and a caller inside a worktree minted the worktree's own
# basename. Fixed at both producers (bin/cc-backlog normalizes; scripts/autonomy-sweep.sh passes
# --project explicitly). The rows stay so the historical labels remain explained.
/                   skip=NOT a project — cc-backlog $(pwd) default under launchd (cwd=/); producer fixed
/tmp/wt-autonomy-100  skip=NOT a project — a worktree path from the same $(pwd) default; producer fixed
wt-closeout         skip=NOT a project — a worktree basename from the same $(pwd) default; producer fixed

# A DIFFERENT producer from the three above, and the reason this row is not just a fourth of them:
# `reso` was passed EXPLICITLY (`cc-backlog add --project reso`, source wave7-close-2026-08-07), so
# no amount of hardening `project_default()` reaches it — the $(pwd) normalization those three
# document runs only when --project is ABSENT. ~/Development/reso does not exist; the real project
# is reso-management-app, two rows up. The label's one open item (333aed941b6b, a live OrderBar
# clipping defect) was therefore journalled {verdict:"skip", reason:"project-not-dispatched"} on
# EVERY pass since 2026-08-07T09:07Z and could never drain. It was migrated to 0c9d92ba9a0a under
# reso-management-app rather than closed — an alias is a mislabel, never a retraction, and closing
# it would have destroyed a real defect report. Verified after: `reso` open=0.
#
# NOT promoted to `repo=` DELIBERATELY. Pointing this label at ~/Development/reso-management-app
# would drain the item but permanently split one repo across two ledger buckets — the S7 fairness
# key orders WITHIN a project, and per-project counts are how coverage is audited (this file's own
# header cites them). One repo, one label.
reso                skip=NOT a project — an ALIAS of reso-management-app, hand-passed via an explicit
#                        --project (not a $(pwd) default, so the producer fix above cannot catch it);
#                        item migrated to 0c9d92ba9a0a. Class fix filed: validate an explicit
#                        --project against this file's dispatch set at add time.

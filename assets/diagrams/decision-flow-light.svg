  <text x="1181.2959999999998" y="318.28666666666663" text-anchor="middle" font-size="13" font-weight="500" fill="#1f2328"><tspan x="1181.2959999999998" dy="-3.9000000000000012">ONE decision card for you</tspan><tspan x="1181.2959999999998" dy="16.900000000000002">or ONE command under ▶ Run this:</tspan></text>

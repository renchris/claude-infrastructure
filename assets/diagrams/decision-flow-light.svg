<g class="edge-label" data-from="Close" data-to="Safe" data-label="every rung verified from live git">
  <rect x="588.1700000000001" y="50.90000000000001" width="160.804" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="668.5720000000001" y="66.05000000000001" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">every rung verified from live git</text>
</g>

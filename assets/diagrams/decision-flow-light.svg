<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1345.27 424.73" width="1345.27" height="424.73" style="--bg:#ffffff;--fg:#1f2328;--line:#d1d9e0;--accent:#0969da;--muted:#59636e">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="Board" data-to="Close" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="356.1199999999999,139.8 404.1199999999999,139.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Close" data-to="Safe" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="every rung verified from live git" points="509.15749999999986,104.78750000000001 580.1700000000001,104.78750000000001 580.1700000000001,66.9 792.9739999999999,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Close" data-to="Back" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="the ledger disagrees,
or the work was drivable" points="544.1699999999998,139.8 1015.3820000000001,139.8 1015.3820000000001,187.71625 1027.382,187.71625" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Close" data-to="Ask" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="a real decision remains" points="509.15749999999986,174.8125 556.1699999999998,174.8125 556.1699999999998,285.065 734.5219999999999,285.065" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Ask" data-to="Back" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="no" points="900.6303333333332,251.84333333333333 969.8520000000001,251.84333333333333 969.8520000000001,248.64833333333334 1015.3820000000001,248.64833333333334 1015.3820000000001,205.6495833333333 1027.382,205.6495833333333" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />

  <text x="878.4159999999999" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="#1f2328"><tspan x="878.4159999999999" dy="-3.9000000000000012">✅ SAFE TO CLOSE</tspan><tspan x="878.4159999999999" dy="16.900000000000002">nothing of mine is open</tspan></text>
</g>
<g class="node" data-id="Back" data-label="sent back to work
— the turn does not end" data-shape="rectangle">
  <rect x="1027.382" y="169.78291666666667" width="171.62499999999997" height="53.800000000000004" rx="0" ry="0" fill="#ffebe9" stroke="#cf222e" stroke-width="0.75" />
  <text x="1113.1945" y="196.68291666666667" text-anchor="middle" font-size="13" font-weight="500" fill="#1f2328"><tspan x="1113.1945" dy="-3.9000000000000012">sent back to work</tspan><tspan x="1113.1945" dy="16.900000000000002">— the turn does not end</tspan></text>
</g>
<g class="node" data-id="Ask" data-label="conviction ≤ 90%,
a research receipt,
two measured options?" data-shape="diamond">
  <polygon points="834.1869999999999,185.4 933.8519999999999,285.065 834.1869999999999,384.73 734.5219999999999,285.065" fill="#fff8c5" stroke="#9a6700" stroke-width="0.75" />
  <text x="834.1869999999999" y="285.065" text-anchor="middle" font-size="13" font-weight="500" fill="#1f2328"><tspan x="834.1869999999999" dy="-12.350000000000001">conviction ≤ 90%,</tspan><tspan x="834.1869999999999" dy="16.900000000000002">a research receipt,</tspan><tspan x="834.1869999999999" dy="16.900000000000002">two measured options?</tspan></text>
</g>

  <text x="941.533" y="139.10000000000002" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)"><tspan x="941.533" dy="-3.3000000000000007">the ledger disagrees,</tspan><tspan x="941.533" dy="14.3">or the work was drivable</tspan></text>
</g>

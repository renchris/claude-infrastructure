  <rect x="564.1699999999998" y="269.065" width="126.35200000000002" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="627.3459999999999" y="284.215" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">a real decision remains</text>
</g>
<g class="edge-label" data-from="Ask" data-to="Back" data-label="no">
  <rect x="977.8520000000001" y="232.64833333333334" width="29.53" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="992.6170000000001" y="247.79833333333335" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">no</text>
</g>
<g class="edge-label" data-from="Ask" data-to="You" data-label="yes">
  <rect x="977.8519999999999" y="302.28666666666663" width="35.47" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="995.5869999999999" y="317.4366666666666" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">yes</text>
</g>
<g class="node" data-id="Board" data-label="what to work on next

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 524" width="1400" height="524"
     role="img" aria-labelledby="ttl dsc">
<title id="ttl">Twice, this repo shipped it first</title>
<desc id="dsc">Two tracks on one time axis, May to August 2026. On each, a green disc marks the date the capability was running in this repo and a blue ring the Claude Code release that shipped it; the bar between them is the lead, drawn to scale and labelled — 4 days and 28 days. A light column crosses left to right once every 24 seconds, igniting each marker in date order.</desc>
<defs>
<linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" class="g-plate-a"/><stop offset="1" class="g-plate-b"/></linearGradient>
<linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" class="g-pill-a"/><stop offset="1" class="g-pill-b"/></linearGradient>
<radialGradient id="haloRep"><stop offset="0" class="g-rep" stop-opacity=".85"/>
  <stop offset="1" class="g-rep" stop-opacity="0"/></radialGradient>
<radialGradient id="haloCc"><stop offset="0" class="g-cc" stop-opacity=".85"/>
  <stop offset="1" class="g-cc" stop-opacity="0"/></radialGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" class="g-sweep" stop-opacity="0"/>
  <stop offset=".62" class="g-sweep" stop-opacity=".55"/>
  <stop offset=".88" class="g-sweep" stop-opacity="1"/>
  <stop offset="1" class="g-sweep" stop-opacity="0"/></linearGradient>
</defs>
<style>
.g-plate-a{stop-color:var(--plate_a)} .g-plate-b{stop-color:var(--plate_b)}
.g-pill-a{stop-color:var(--pill_a)} .g-pill-b{stop-color:var(--pill_b)}
.g-rep{stop-color:var(--rep)} .g-cc{stop-color:var(--cc)}
.g-sweep{stop-color:var(--sweep)}
</style>
<style>
:root{--plate_a:#ffffff;--plate_b:#f2f6fb;--edge:#d6dee8;--edge_hi:#ffffff;--edge_hi_o:0.85;--grid:#e4ebf3;--ink:#0d1319;--ink2:#54606e;--ink3:#7d8794;--track:#c8d3e0;--rep:#1a7f37;--rep_hi:#2da44e;--cc:#0969da;--cc_hi:#218bff;--pill_a:#e9f7ed;--pill_b:#dcf1e3;--sweep:#1f4e8c;--sweep_o:0.05;--halo_o:0.16;--core:#ffffff;}
@media (prefers-color-scheme: dark){:root{--plate_a:#111823;--plate_b:#0a0e15;--edge:#222b3a;--edge_hi:#ffffff;--edge_hi_o:0.05;--grid:#1e2937;--ink:#e9eff6;--ink2:#98a5b5;--ink3:#6a7686;--track:#37455a;--rep:#3fb950;--rep_hi:#6ee787;--cc:#4b93e6;--cc_hi:#8cc8ff;--pill_a:#16241a;--pill_b:#0f1a13;--sweep:#a8d0ff;--sweep_o:0.09;--halo_o:0.34;--core:#0a0e15;}}

text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;dominant-baseline:auto}
.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}
.ink{fill:var(--ink)} .ink2{fill:var(--ink2)} .ink3{fill:var(--ink3)}
.c-rep{fill:var(--rep)} .c-cc{fill:var(--cc)} .c-rep-hi{fill:var(--rep_hi)}

.t-kicker{font-size:18px;font-weight:600;letter-spacing:2.4px;fill:var(--ink3)}
.t-key{font-size:20px;fill:var(--ink2)}
.t-legend{font-size:18px;fill:var(--ink2)}
.t-name{font-size:26px;font-weight:600;fill:var(--ink)}
.t-namesub{font-size:20px;fill:var(--ink2)}
.t-date{font-size:17.5px;letter-spacing:.4px}
.t-detail{font-size:19px;fill:var(--ink2)}
.t-coda{font-size:17.5px;fill:var(--ink2)}
.t-month{font-size:16px;letter-spacing:.4px;fill:var(--ink3)}
.t-pill{font-size:26px;font-weight:700;fill:var(--rep_hi)}
.t-pill-u{font-size:15px;font-weight:600;letter-spacing:1.5px;fill:var(--rep)}

.plate{fill:url(#plate)}
.edge{fill:none;stroke:var(--edge);stroke-width:1.5}
.edgehi{fill:none;stroke:var(--edge_hi);stroke-width:1.5;opacity:var(--edge_hi_o)}
.grid{stroke:var(--grid);stroke-width:1}

/* the full-width track: dotted where neither side had it yet, and where both do */
.track{stroke:var(--track);stroke-width:2;stroke-dasharray:2 9;stroke-linecap:round}
/* the lead: the one span that means "only this repo had it" */
.rail{fill:none;stroke:var(--rep);stroke-width:3.5;stroke-linecap:round}
.rail-hi{fill:none;stroke:var(--rep_hi);stroke-width:1.2;stroke-linecap:round;opacity:.55}
.tick-rep{stroke:var(--rep);stroke-width:1.5;opacity:.5;stroke-linecap:round}
.tick-cc{stroke:var(--cc);stroke-width:1.5;opacity:.5;stroke-linecap:round}

.halo{opacity:var(--halo_o)}
.halo-rep{fill:url(#haloRep)} .halo-cc{fill:url(#haloCc)}
.mk-rep{fill:var(--rep)}
.mk-core{fill:var(--core)}
.mk-spec{fill:#ffffff;opacity:.45}
.mk-ring-cc{fill:var(--core);stroke:var(--cc);stroke-width:4}

.pill-bg{fill:url(#pill);stroke:var(--rep);stroke-width:1.4}

/* ── motion ─────────────────────────────────────────────────────────────────────────────────
   One animation per element, and no literal delay value anywhere — phase rides --d through the
   additive calc channel the freeze can seek (banner-shots --lint enforces both). Every period
   divides 24s, so t=0 and t=P render identically. NB the lint reads this stylesheet as text, so
   a prose mention of that property followed by a colon reads to it as a declaration. */

@keyframes sweepx{from{transform:translateX(0px)}to{transform:translateX(1700px)}}
.sweep{animation:sweepx 24s linear infinite;animation-delay:calc(var(--d,0s) + var(--fz,0s))}
.sweepfill{fill:url(#sweep);opacity:var(--sweep_o)}

@keyframes ignite{
  0%{opacity:0;transform:scale(1)}
  2%{opacity:.9;transform:scale(1)}
  10%{opacity:0;transform:scale(3.1)}
  100%{opacity:0;transform:scale(1)}}
.ig{fill:none;stroke-width:2.4;transform-box:fill-box;transform-origin:50% 50%;opacity:0;
     animation:ignite 24s linear infinite;animation-delay:calc(var(--d,0s) + var(--fz,0s))}
.ig-rep{stroke:var(--rep_hi)} .ig-cc{stroke:var(--cc_hi)}

@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<rect class="plate" x="0" y="0" width="1400" height="524" rx="16"/>
<g class="sweep" style="--d:0s"><rect class="sweepfill" x="-300" y="0" width="300" height="524"/></g>
<g>
<line class="grid" x1="328.0" y1="104" x2="328.0" y2="472"/>
<line class="grid" x1="688.0" y1="104" x2="688.0" y2="472"/>
<line class="grid" x1="1060.0" y1="104" x2="1060.0" y2="472"/>
</g>
<g>
<text class="t-month mono" x="142.0" y="494" text-anchor="middle">May ’26</text>
<text class="t-month mono" x="508.0" y="494" text-anchor="middle">Jun</text>
<text class="t-month mono" x="874.0" y="494" text-anchor="middle">Jul</text>
<text class="t-month mono" x="1198.0" y="494" text-anchor="middle">Aug</text>
</g>
<text class="t-name" x="64" y="140">a research team that attacks its own findings</text>
<text class="t-namesub" x="720" y="140">· a share of every wave briefed to refute the rest</text>
<line class="track" x1="64" y1="216" x2="217.0" y2="216"/>
<line class="track" x1="295.0" y1="216" x2="1336" y2="216"/>
<line class="rail" x1="232.0" y1="216" x2="280.0" y2="216"/>
<line class="rail-hi" x1="232.0" y1="216" x2="280.0" y2="216"/>
<line class="tick-rep" x1="232.0" y1="204" x2="232.0" y2="184"/>
<line class="tick-cc" x1="280.0" y1="228" x2="280.0" y2="247"/>
<rect class="pill-bg" x="310.0" y="195.0" width="101.4" height="42.0" rx="21.0"/>
<text class="t-pill" x="330.0" y="225">4</text>
<text class="t-pill-u" x="352.7" y="225">DAYS</text>
<g transform="translate(232.0,216)">
<circle class="halo halo-rep" r="16"/>
<circle class="mk-rep" r="9.5"/>
<circle class="mk-spec" cx="-3" cy="-3.4" r="2.2"/>
<circle class="ig ig-rep" r="12.5" style="--d:-20.696s"/>
</g>
<g transform="translate(280.0,216)">
<circle class="halo halo-cc" r="16"/>
<circle class="mk-ring-cc" r="7.5"/>
<circle class="ig ig-cc" r="12.5" style="--d:-20.019s"/>
</g>
<text class="t-date mono c-rep" x="226.0" y="178">2026-05-24</text>
<text class="t-detail" x="343.0" y="178">running here</text>
<text class="t-date mono c-cc" x="274.0" y="262">2026-05-28</text>
<text class="t-detail" x="391.0" y="262">Dynamic Workflows 2.1.154 — the same idea</text>
<text class="t-name" x="64" y="320">two-way session messaging</text>
<text class="t-namesub" x="436" y="320">· open, brief, question and retire peers from any session</text>
<line class="track" x1="64" y1="396" x2="781.0" y2="396"/>
<line class="track" x1="1147.0" y1="396" x2="1336" y2="396"/>
<line class="rail" x1="796.0" y1="396" x2="1132.0" y2="396"/>
<line class="rail-hi" x1="796.0" y1="396" x2="1132.0" y2="396"/>
<line class="tick-rep" x1="796.0" y1="384" x2="796.0" y2="364"/>
<line class="tick-cc" x1="1132.0" y1="408" x2="1132.0" y2="427"/>
<rect class="pill-bg" x="906.0" y="375.0" width="116.1" height="42.0" rx="21.0"/>
<text class="t-pill" x="926.0" y="405">28</text>
<text class="t-pill-u" x="963.3" y="405">DAYS</text>
<g transform="translate(796.0,396)">
<circle class="halo halo-rep" r="16"/>
<circle class="mk-rep" r="9.5"/>
<circle class="mk-spec" cx="-3" cy="-3.4" r="2.2"/>
<circle class="ig ig-rep" r="12.5" style="--d:-12.734s"/>
</g>
<g transform="translate(1132.0,396)">
<circle class="halo halo-cc" r="16"/>
<circle class="mk-ring-cc" r="7.5"/>
<circle class="ig ig-cc" r="12.5" style="--d:-7.991s"/>
</g>
<text class="t-date mono c-rep" x="790.0" y="358">2026-07-10</text>
<text class="t-detail" x="907.0" y="358">running here</text>
<text class="t-date mono c-cc" x="550.8" y="442">2026-08-07</text>
<text class="t-detail" x="667.8" y="442">Claude Code 2.1.224 — sessions message each other</text>
<text class="t-kicker" x="64" y="44">HERE FIRST — TWICE</text>
<text class="t-key" x="64" y="78">Each bar is how long the capability was running here before the Claude Code release that shipped it.</text>
<circle class="mk-rep" cx="967" cy="38" r="7"/>
<text class="t-legend" x="980" y="44">running here</text>
<circle class="mk-ring-cc" cx="1123" cy="38" r="5.5"/>
<text class="t-legend" x="1136" y="44">shipped in Claude Code</text>
<rect class="edge" x=".75" y=".75" width="1398.5" height="522.5" rx="16"/>
<path class="edgehi" d="M 17 1.5 H 1383 A 15.5 15.5 0 0 1 1398.5 17"/>
</svg>

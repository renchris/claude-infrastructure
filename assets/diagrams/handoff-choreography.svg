<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 382" width="900" height="382" role="img" aria-labelledby="t d">
<title id="t">A Claude Code session opens a second pane, exchanges mail with it, and then closes itself</title>
<desc id="d">Three acts in one iTerm2 window. Act 1, self-open: the left pane runs /handoff, claims a worktree, ranks accounts, and splits its own pane; a second session boots on the right and reaches its first assistant turn. Act 2, two-way: the left pane sends a message with cc-notify; it lands as a line in a mailbox file, which the right pane drains at a safe boundary, then pings back. Act 3, self-close: the left pane verifies the successor is engaged, announces the succession into it, exits, and its pane closes with focus landing on the survivor.</desc>
<style>
  .f { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  .win  { fill: #0d1117; stroke: #30363d; }
  .bar  { fill: #161b22; }
  .pane { fill: #010409; stroke: #21262d; }
  .ph   { fill: #161b22; }
  .t    { fill: #c9d1d9; }
  .dim  { fill: #6e7681; }
  .gold { fill: #d4af37; }
  .grn  { fill: #3fb950; }
  .blu  { fill: #58a6ff; }

  /* every element shares one 16s master timeline */
  .a { animation-duration: 16s; animation-iteration-count: infinite; animation-timing-function: ease; }

  /* ── act 1 · self-open ─────────────────────────────────────────── */
  #paneB      { opacity: 0; transform: translateX(34px); animation-name: bIn; }
  #bGhost     { opacity: .55; animation-name: ghostOut; }
  @keyframes bIn    { 0%,12% { opacity:0; transform:translateX(34px) } 18%,80% { opacity:1; transform:translateX(0) }
                      88%,100% { opacity:1; transform:translateX(-14px) } }
  @keyframes ghostOut { 0%,11% { opacity:.55 } 16%,100% { opacity:0 } }

  #focusB     { opacity: 0; animation-name: focusB; }
  @keyframes focusB { 0%,80% { opacity:0 } 88%,97% { opacity:1 } 100% { opacity:0 } }

  #paneA      { animation-name: aOut; }
  @keyframes aOut   { 0%,80% { opacity:1 } 88%,97% { opacity:.14 } 100% { opacity:1 } }
  #closedA    { opacity: 0; animation-name: closedA; }
  @keyframes closedA { 0%,82% { opacity:0 } 88%,97% { opacity:1 } 100% { opacity:0 } }

  /* ── typed lines: each fades in at its cue and holds ───────────── */
  .l { opacity: 0; }
  #a1 { animation-name: cue03 } #a2 { animation-name: cue07 } #a3 { animation-name: cue11 }
  #b1 { animation-name: cue18 } #b2 { animation-name: cue25 }
  #a4 { animation-name: cue35 } #b3 { animation-name: cue48 } #b4 { animation-name: cue55 }
  #a5 { animation-name: cue61 } #a6 { animation-name: cue66 } #a7 { animation-name: cue71 }
  @keyframes cue03 { 0%,3%  {opacity:0} 5%,97%  {opacity:1} 100%{opacity:0} }
  @keyframes cue07 { 0%,7%  {opacity:0} 9%,97%  {opacity:1} 100%{opacity:0} }
  @keyframes cue11 { 0%,11% {opacity:0} 13%,97% {opacity:1} 100%{opacity:0} }
  @keyframes cue18 { 0%,18% {opacity:0} 20%,97% {opacity:1} 100%{opacity:0} }
  @keyframes cue25 { 0%,25% {opacity:0} 27%,97% {opacity:1} 100%{opacity:0} }
  @keyframes cue35 { 0%,35% {opacity:0} 37%,97% {opacity:1} 100%{opacity:0} }
  @keyframes cue48 { 0%,48% {opacity:0} 50%,97% {opacity:1} 100%{opacity:0} }
  @keyframes cue55 { 0%,55% {opacity:0} 57%,97% {opacity:1} 100%{opacity:0} }
  @keyframes cue61 { 0%,61% {opacity:0} 63%,97% {opacity:1} 100%{opacity:0} }
  @keyframes cue66 { 0%,66% {opacity:0} 68%,97% {opacity:1} 100%{opacity:0} }
  @keyframes cue71 { 0%,71% {opacity:0} 73%,97% {opacity:1} 100%{opacity:0} }

  /* caret blinks only while its pane is the one acting */
  #caret { fill:#d4af37; animation-name: blink; animation-timing-function: steps(1,end); }
  @keyframes blink { 0%,4%,8%,12%,16%,20% {opacity:1} 2%,6%,10%,14%,18% {opacity:0} 22%,100%{opacity:0} }

  /* ── act 2 · the mailbox bus ───────────────────────────────────── */
  #chip { animation-name: chipGlow; }
  @keyframes chipGlow { 0%,38% {opacity:.45} 41%,45% {opacity:1} 49%,55% {opacity:.45}
                        58%,62% {opacity:1} 66%,100% {opacity:.45} }
  #p1 { opacity:0; animation-name: send; }
  @keyframes send { 0%,36% { opacity:0; transform:translate(0,0) }
                    38%    { opacity:1; transform:translate(0,0) }
                    43%,46%{ opacity:1; transform:translate(268px,0) }
                    51%    { opacity:1; transform:translate(536px,0) }
                    53%,100%{ opacity:0; transform:translate(536px,0) } }
  #p2 { opacity:0; animation-name: back; }
  @keyframes back { 0%,56% { opacity:0; transform:translate(536px,0) }
                    58%    { opacity:1; transform:translate(536px,0) }
                    62%,64%{ opacity:1; transform:translate(268px,0) }
                    68%    { opacity:1; transform:translate(0,0) }
                    70%,100%{ opacity:0; transform:translate(0,0) } }

  /* ── act captions ──────────────────────────────────────────────── */
  #cap1 { animation-name: cap1 } #cap2 { animation-name: cap2 } #cap3 { animation-name: cap3 }
  @keyframes cap1 { 0%,1% {opacity:0} 3%,29% {opacity:1} 32%,100% {opacity:0} }
  @keyframes cap2 { 0%,32% {opacity:0} 35%,60% {opacity:1} 63%,100% {opacity:0} }
  @keyframes cap3 { 0%,63% {opacity:0} 66%,97% {opacity:1} 100% {opacity:0} }
  #capStatic { opacity: 0 }

  @media (prefers-reduced-motion: reduce) {
    .a { animation: none !important }
    .l, #paneB, #chip, #focusB, #closedA { opacity: 1 !important; transform: none !important }
    #bGhost, #p1, #p2, #cap1, #cap2, #cap3, #caret { opacity: 0 !important }
    #capStatic { opacity: 1 !important }
  }
</style>

<rect class="win" x="10" y="10" width="880" height="362" rx="11" stroke-width="1"/>
<path class="bar" d="M10 21a11 11 0 0 1 11-11h858a11 11 0 0 1 11 11v21H10z"/>
<circle cx="32" cy="26" r="5" fill="#3a4048"/><circle cx="50" cy="26" r="5" fill="#3a4048"/><circle cx="68" cy="26" r="5" fill="#3a4048"/>
<text class="f dim" x="450" y="30" font-size="12" text-anchor="middle">one window · the sessions do the scheduling</text>

<!-- ══ pane A — the session that opens, messages, and retires itself ══ -->
<g id="paneA" class="a">
  <rect class="pane" x="22" y="54" width="418" height="228" rx="7" stroke-width="1"/>
  <path class="ph" d="M22 61a7 7 0 0 1 7-7h404a7 7 0 0 1 7 7v20H22z"/>
  <text class="f gold" x="36" y="75" font-size="11.5">pane A · lead</text>
  <text class="f dim"  x="426" y="75" font-size="11.5" text-anchor="end">acct 1 · opus · max</text>

  <text id="a1" class="f l a" x="36" y="106" font-size="13"><tspan class="gold">❯</tspan><tspan class="t" dx="7">/handoff</tspan></text>
  <text id="a2" class="f l a dim" x="36" y="131" font-size="12.5">worktree-pool claim · ~3s warm slot</text>
  <text id="a3" class="f l a dim" x="36" y="153" font-size="12.5">rank 4 accounts · split ⌘D · type + submit</text>
  <text id="a4" class="f l a" x="36" y="185" font-size="12.5"><tspan class="blu">cc-notify</tspan><tspan class="t" dx="6">--role peer  "gate is green"</tspan></text>
  <text id="a5" class="f l a" x="36" y="207" font-size="12.5"><tspan class="grn">◀</tspan><tspan class="t" dx="6">HANDOFF-PING: landed 4f2a1c</tspan></text>
  <text id="a6" class="f l a" x="36" y="236" font-size="12.5"><tspan class="grn">✓</tspan><tspan class="dim" dx="6">successor verified engaged</tspan></text>
  <text id="a7" class="f l a" x="36" y="258" font-size="12.5"><tspan class="gold">❯</tspan><tspan class="t" dx="7">self-close --successor B</tspan></text>
  <rect id="caret" class="a" x="52" y="96" width="8" height="13" rx="1"/>
</g>
<g id="closedA" class="a">
  <rect x="22" y="54" width="418" height="228" rx="7" fill="#0d1117" fill-opacity=".96"/>
  <text class="f" x="231" y="163" font-size="13" text-anchor="middle" fill="#8b949e">pane closed · nothing left open</text>
  <text class="f dim" x="231" y="184" font-size="11.5" text-anchor="middle">transcript still resumable</text>
</g>

<!-- ══ pane B — the successor ══ -->
<rect id="bGhost" class="a" x="460" y="54" width="418" height="228" rx="7" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="5 5"/>
<g id="paneB" class="a">
  <rect class="pane" x="460" y="54" width="418" height="228" rx="7" stroke-width="1"/>
  <path class="ph" d="M460 61a7 7 0 0 1 7-7h404a7 7 0 0 1 7 7v20H460z"/>
  <text class="f grn" x="474" y="75" font-size="11.5">pane B · successor</text>
  <text class="f dim" x="864" y="75" font-size="11.5" text-anchor="end">acct 3 · opus · max</text>

  <text id="b1" class="f l a" x="474" y="106" font-size="13"><tspan class="gold">❯</tspan><tspan class="t" dx="7">claude-next3 --effort max "&lt;brief&gt;"</tspan></text>
  <text id="b2" class="f l a" x="474" y="131" font-size="12.5"><tspan class="grn">●</tspan><tspan class="dim" dx="6">engaged — first assistant turn</tspan></text>
  <text id="b3" class="f l a" x="474" y="185" font-size="12.5"><tspan class="blu">▸</tspan><tspan class="t" dx="6">mail drained at a safe boundary</tspan></text>
  <text id="b4" class="f l a" x="474" y="207" font-size="12.5"><tspan class="gold">❯</tspan><tspan class="t" dx="7">/ship</tspan><tspan class="dim" dx="6">→ landed on origin/main</tspan></text>
</g>
<rect id="focusB" class="a" x="458" y="52" width="422" height="232" rx="8" fill="none" stroke="#d4af37" stroke-width="1.5"/>

<!-- ══ the bus: a message is a line in a file, not a keystroke ══ -->
<line x1="150" y1="308" x2="750" y2="308" stroke="#21262d" stroke-width="1" stroke-dasharray="3 5"/>
<g id="chip" class="a">
  <rect x="356" y="294" width="188" height="28" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text class="f dim" x="450" y="312" font-size="11.5" text-anchor="middle">mailbox/&lt;uuid&gt;.md</text>
</g>
<g id="p1" class="a" transform="translate(0,0)">
  <rect x="150" y="296" width="112" height="24" rx="12" fill="#0d1d2e" stroke="#58a6ff"/>
  <text class="f blu" x="206" y="312" font-size="11" text-anchor="middle">cc-notify →</text>
</g>
<g id="p2" class="a" transform="translate(0,0)">
  <rect x="150" y="296" width="112" height="24" rx="12" fill="#12261a" stroke="#3fb950"/>
  <text class="f grn" x="206" y="312" font-size="11" text-anchor="middle">← ping back</text>
</g>

<!-- ══ act caption ══ -->
<text id="cap1" class="f a" x="26" y="352" font-size="12.5"><tspan class="gold">① self-open</tspan><tspan class="dim" dx="10">/handoff splits the firing pane, claims a worktree, picks the account — and submits the brief</tspan></text>
<text id="cap2" class="f a" x="26" y="352" font-size="12.5"><tspan class="gold">② two-way</tspan><tspan class="dim" dx="10">a message is a line in a file, drained at a safe boundary — never keystrokes on a live input line</tspan></text>
<text id="cap3" class="f a" x="26" y="352" font-size="12.5"><tspan class="gold">③ self-close</tspan><tspan class="dim" dx="10">the parent proves the successor is engaged, announces into it, exits — focus lands on the survivor</tspan></text>
<text id="capStatic" class="f" x="26" y="352" font-size="12.5"><tspan class="gold">self-open → two-way → self-close</tspan><tspan class="dim" dx="10">animation disabled by your reduced-motion setting</tspan></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 520" width="1920" height="520" role="img" aria-labelledby="t d">
<title id="t">claude-infrastructure — a population, not a diagram</title>
<desc id="d">The words claude-infrastructure set in monospace on a dark plate. The title is present the whole time and never moves; the only motion is the orange Claude Code pixel creature idling — glancing left, glancing right and occasionally stretching both arms above its head — on a loop that repeats indefinitely with no restart. The words sit at the left on a dotted line. Four identical creatures stand in a row to the right on the same line, each idling out of step. Nothing connects them.</desc>
<defs>
  <radialGradient id="plate" cx=".5" cy=".38" r=".72"><stop offset="0" stop-color="#171e27"/><stop offset="1" stop-color="#0d1117"/></radialGradient>
  <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1920" y2="0"><stop offset="0" stop-color="#30363d" stop-opacity="0"/><stop offset=".16" stop-color="#30363d" stop-opacity=".95"/><stop offset=".84" stop-color="#30363d" stop-opacity=".95"/><stop offset="1" stop-color="#30363d" stop-opacity="0"/></linearGradient>
</defs>
<style>
  .f { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  #c0 .eye { animation: gaze_c0 13s step-end infinite; }
  #c0 .arm { animation: arms_c0 19s step-end infinite; }
  #c1 .eye { animation: gaze_c1 13s step-end infinite; }
  #c1 .arm { animation: arms_c1 19s step-end infinite; }
  #c2 .eye { animation: gaze_c2 13s step-end infinite; }
  #c2 .arm { animation: arms_c2 19s step-end infinite; }
  #c3 .eye { animation: gaze_c3 13s step-end infinite; }
  #c3 .arm { animation: arms_c3 19s step-end infinite; }
  @keyframes gaze_c0 { 0%{transform:translateX(0px)} 7%{transform:translateX(0px)} 35%{transform:translateX(-16px)} 41%{transform:translateX(0px)} 68%{transform:translateX(16px)} 74%{transform:translateX(0px)} 100%{transform:translateX(0px)} }
  @keyframes arms_c0 { 0%{transform:translateY(0px)} 4.9%{transform:translateY(0px)} 90.9%{transform:translateY(-48px)} 95.9%{transform:translateY(0px)} 100%{transform:translateY(0px)} }
  @keyframes gaze_c1 { 0%{transform:translateX(0px)} 32%{transform:translateX(0px)} 60%{transform:translateX(-16px)} 66%{transform:translateX(0px)} 93%{transform:translateX(16px)} 99%{transform:translateX(0px)} 100%{transform:translateX(0px)} }
  @keyframes arms_c1 { 0%{transform:translateY(0px)} 8.4%{transform:translateY(-48px)} 13.4%{transform:translateY(0px)} 22.4%{transform:translateY(0px)} 100%{transform:translateY(0px)} }
  @keyframes gaze_c2 { 0%{transform:translateX(0px)} 18%{transform:translateX(16px)} 24%{transform:translateX(0px)} 57%{transform:translateX(0px)} 85%{transform:translateX(-16px)} 91%{transform:translateX(0px)} 100%{transform:translateX(0px)} }
  @keyframes arms_c2 { 0%{transform:translateY(0px)} 25.9%{transform:translateY(-48px)} 30.9%{transform:translateY(0px)} 39.9%{transform:translateY(0px)} 100%{transform:translateY(0px)} }
  @keyframes gaze_c3 { 0%{transform:translateX(0px)} 10%{transform:translateX(-16px)} 16%{transform:translateX(0px)} 43%{transform:translateX(16px)} 49%{transform:translateX(0px)} 82%{transform:translateX(0px)} 100%{transform:translateX(0px)} }
  @keyframes arms_c3 { 0%{transform:translateY(0px)} 43.4%{transform:translateY(-48px)} 48.4%{transform:translateY(0px)} 57.4%{transform:translateY(0px)} 100%{transform:translateY(0px)} }
  /* Same artwork, held still. Every cycle begins AND ends on `default`, so the
     frozen frame is one the animation genuinely passes through rather than a
     separate static fallback free to drift from it. */
  @media (prefers-reduced-motion: reduce) {
    /* The creature must freeze as ITSELF. An earlier version swept opacity onto
       .eye and .arm along with the stars, which washed out the arms and let orange
       bleed through the eyes — a degraded fallback wearing the same geometry, which
       is precisely what 'same artwork' rules out. */
    .eye, .arm { animation: none !important; transform: none !important; }
    /* Stars hold mid-twinkle rather than at their dimmest, so the sky still reads. */
    [id^=tw] { animation: none !important; opacity: .45 !important; }
  }
</style>
<rect width="1920" height="520" rx="14" fill="url(#plate)"/>
<rect x=".75" y=".75" width="1918.5" height="518.5" rx="14" fill="none" stroke="#21262d" stroke-width="1.5"/>
<g transform="translate(0 -60)">
<line x1="96" y1="384" x2="1824" y2="384" stroke="url(#rule)" stroke-width="2" stroke-dasharray="3 9" opacity="1"/>
<text class="f" x="150" y="354" text-anchor="start" fill="#e6edf3" font-size="62" letter-spacing="1.5">claude-infrastructure</text>
<g id="c0" shape-rendering="crispEdges">

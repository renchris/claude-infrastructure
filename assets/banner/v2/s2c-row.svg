  <g id="c1-armL" class="arm" fill="#D77757"><rect x="1220" y="288" width="16" height="32"/></g>
  <g id="c1-armR" class="arm" fill="#D77757"><rect x="1380" y="288" width="16" height="32"/></g>
  <g id="c1-eyeL" class="eye" fill="#0d1117"><rect x="1252" y="288" width="16" height="16"/></g>
  <g id="c1-eyeR" class="eye" fill="#0d1117"><rect x="1348" y="288" width="16" height="16"/></g>
</g>
<g id="c2" shape-rendering="crispEdges">
  <g fill="#D77757"><rect x="1436" y="256" width="144" height="96"/><rect x="1436" y="352" width="16" height="32"/><rect x="1468" y="352" width="16" height="32"/><rect x="1532" y="352" width="16" height="32"/><rect x="1564" y="352" width="16" height="32"/></g>
  <g id="c2-armL" class="arm" fill="#D77757"><rect x="1420" y="288" width="16" height="32"/></g>
  <g id="c2-armR" class="arm" fill="#D77757"><rect x="1580" y="288" width="16" height="32"/></g>
  <g id="c2-eyeL" class="eye" fill="#0d1117"><rect x="1452" y="288" width="16" height="16"/></g>
  <g id="c2-eyeR" class="eye" fill="#0d1117"><rect x="1548" y="288" width="16" height="16"/></g>
</g>
<g id="c3" shape-rendering="crispEdges">
  <g fill="#D77757"><rect x="1636" y="256" width="144" height="96"/><rect x="1636" y="352" width="16" height="32"/><rect x="1668" y="352" width="16" height="32"/><rect x="1732" y="352" width="16" height="32"/><rect x="1764" y="352" width="16" height="32"/></g>
  <g id="c3-armL" class="arm" fill="#D77757"><rect x="1620" y="288" width="16" height="32"/></g>
  <g id="c3-armR" class="arm" fill="#D77757"><rect x="1780" y="288" width="16" height="32"/></g>
  <g id="c3-eyeL" class="eye" fill="#0d1117"><rect x="1652" y="288" width="16" height="16"/></g>
  <g id="c3-eyeR" class="eye" fill="#0d1117"><rect x="1748" y="288" width="16" height="16"/></g>
</g>

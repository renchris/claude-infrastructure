<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 520" width="1920" height="520" role="img" aria-labelledby="t d">
<title id="t">claude-infrastructure — the long watch</title>
<desc id="d">The words claude-infrastructure set in monospace on a dark plate. The title is present the whole time and never moves; the only motion is the orange Claude Code pixel creature idling — glancing left, glancing right and occasionally stretching both arms above its head — on a loop that repeats indefinitely with no restart. A dense field of very faint stars twinkles on uncorrelated slow timings, with one star at the right on a far longer beat than any other. The creature stands centred on the dotted horizon below the words.</desc>
